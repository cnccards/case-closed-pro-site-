<style>
:root{

}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);font-family:var(--sans);color:var(--ink);min-height:100vh;font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased;}
button,input,select,textarea{font-family:inherit;font-size:13px;color:inherit;}

::-webkit-scrollbar-track{background:transparent;}

::-webkit-scrollbar-thumb:hover{background:#94A3B8;}
.serif{font-family:var(--serif);font-feature-settings:"ss01","ss02";}
.card{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:var(--sh-sm);}
.card-flat{background:var(--surf2);border:1px solid var(--line);border-radius:12px;padding:18px;}
.sh{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:1.6px;margin-bottom:10px;padding-bottom:7px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px;}
.pill{font-size:9.5px;font-weight:700;padding:3px 9px;border-radius:20px;text-transform:uppercase;letter-spacing:.6px;display:inline-block;white-space:nowrap;}
.tag{font-size:10px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--surf3);color:var(--muted);display:inline-block;}
.inp{background:var(--surf);border:1px solid var(--line2);border-radius:7px;padding:8px 11px;color:var(--ink);width:100%;outline:none;transition:border-color .15s,box-shadow .15s;}
.inp:focus{border-color:var(--pri2);box-shadow:0 0 0 3px rgba(37,99,235,.12);}
textarea.inp{min-height:60px;resize:vertical;font-family:inherit;}
.lbl{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:1.1px;margin-bottom:5px;display:block;font-weight:700;}
.fld{margin-bottom:11px;}
.btn{border-radius:7px;padding:7px 13px;font-weight:600;font-size:12px;cursor:pointer;border:1px solid transparent;transition:all .15s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;}
.btn-pri{background:var(--pri);color:#fff;}

.btn-dark:hover{background:var(--ink2);}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;}

.case-card:hover{border-color:var(--pri2);box-shadow:0 4px 14px rgba(21,64,122,.08);transform:translateY(-1px);}
.tag-warn{background:#FEF3C7;color:#92400E;}
.tag-danger{background:#FEE2E2;color:#991B1B;}

.grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:11px;margin-bottom:11px;}
.grid-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:11px;margin-bottom:11px;}
.modal-bg{position:fixed;inset:0;background:rgba(11,18,32,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;}

.modal-b{padding:18px 22px;overflow-y:auto;flex:1;}
.modal-f{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;background:var(--surf2);flex-shrink:0;}
.x{background:transparent;border:none;font-size:26px;line-height:1;color:var(--muted);cursor:pointer;padding:0 6px;border-radius:6px;flex-shrink:0;}
.x:hover{background:var(--surf3);color:var(--ink);}
.tab-bar{display:flex;gap:5px;padding:11px 0 0;overflow-x:auto;border-bottom:0;flex-wrap:wrap;}
.pill.on{background:var(--pri);color:#fff;}
.pill{cursor:pointer;border:1px solid var(--line);background:var(--surf);color:var(--muted);transition:all .12s;}
.pill:hover{border-color:var(--pri2);color:var(--pri2);}
table{width:100%;border-collapse:collapse;font-size:12px;}
th.sortable{cursor:pointer;user-select:none;}
th.sortable:hover{color:var(--pri2);}
.sort-arrow{font-size:9px;opacity:.8;}
table th{text-align:left;padding:9px 11px;background:var(--surf2);color:var(--muted);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.1px;border-bottom:1px solid var(--line);}
table td{padding:9px 11px;border-bottom:1px solid var(--surf3);color:var(--ink);}
table tr.row-link{cursor:pointer;}
table tr.row-link:hover td{background:var(--surf2);}
#ct{padding:0;}
#app{background:var(--surf2);min-height:100vh;}
body{background:var(--surf2);}
input[type=date],input[type=number],input[type=email],input[type=text],select,textarea{background:#fff;border:1px solid var(--line2);border-radius:6px;padding:7px 10px;color:var(--ink);width:100%;outline:none;font-size:12px;font-family:inherit;transition:border-color .15s,box-shadow .15s;}
input:focus,select:focus,textarea:focus{border-color:var(--pri2);box-shadow:0 0 0 3px rgba(37,99,235,.12);}
textarea{min-height:60px;resize:vertical;}
label{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:1.1px;margin-bottom:4px;display:block;font-weight:700;}
.act-icn{width:9px;height:9px;border-radius:50%;flex-shrink:0;}

.gsearch-input:focus{background-color:#fff;border-color:var(--pri2);}

@media (max-width:720px){
  .hero-title{font-size:24px;}
  .modal{max-height:96vh;}
  .modal-h,.modal-b,.modal-f{padding-left:14px;padding-right:14px;}
  .wrap{padding:12px;}
  /* Collapse every fixed-fraction grid (g2–g5 classes and inline
     "grid-template-columns:...fr...fr" styles) to a single column.
     Catches all ~20 call sites without touching each one individually. */
  .g2,.g3,.g4,.g5,
  [style*="grid-template-columns"]{
    grid-template-columns:1fr !important;
  }
  /* Nav: was wrapping into 4-6 rows of chrome before any page content
     showed. Instead, keep it one row and let it scroll horizontally —
     same tabs, same order, just swipeable instead of stacked. */
  .nav-scroll{
    flex-wrap:nowrap !important;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
    flex:1 1 auto;
    min-width:0;
  }
  .nav-scroll::-webkit-scrollbar{display:none;}
  .nav-side-btn{padding:7px 10px;font-size:11px;}
  /* Search box: fixed 260px width would force the header row to overflow
     next to the brand mark and user avatar on a phone. Give it its own
     full-width row underneath instead of squeezing it into the top row. */
  .hdr-top-row{flex-wrap:wrap;}
  .gsearch-wrap{flex:1 1 100%;width:100%;order:3;}
  .gsearch-input{font-size:12px;padding:8px 12px 8px 30px;}
  .notif-panel{position:fixed !important;left:12px !important;right:12px !important;top:56px !important;width:auto !important;max-width:none !important;}
}

/* Print / "Export PDF" — no library added; this is the browser's
   own print dialog with "Save as PDF" as one of its destinations.
   Hides nav chrome and buttons, lets cards/tables flow across pages
   cleanly instead of being clipped by the app's normal scroll areas. */
@media print{
  body{background:#fff;}
  nav, .role-tab, .btn, .exec-subnav, [class*="btn-"], .no-print, .legal-footer{display:none !important;}
  .wrap{max-width:100%;padding:0;}
  .card, .kpi{break-inside:avoid;box-shadow:none;border:1px solid #ccc;}
  .hero{background:#fff !important;color:#000 !important;padding:10px 0;}
  .hero-title, .hero-sub, .hero-eyebrow{color:#000 !important;}
}

/* Sentinel Health Check printing: only the report prints; summary mode hides the appendix. */
@media print{
  body.hc-printing, body.hc-printing #app, body.hc-printing #app > div{background:#fff !important;min-height:0 !important;height:auto !important;}
  body.hc-printing #app > *:not(.modal-bg){display:none !important;}
  body.hc-printing .modal-bg{position:static !important;background:none !important;backdrop-filter:none !important;padding:0 !important;display:block !important;}
  body.hc-printing .modal{max-width:100% !important;max-height:none !important;overflow:visible !important;box-shadow:none !important;border-radius:0;}
  body.hc-printing .modal-h{display:none !important;}
  body.hc-printing .modal-b{padding:0 !important;overflow:visible !important;}
  body.hc-printing *{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  body.hc-printing .hc-sec{break-inside:avoid;}

/* ── SCORECARD ENGINE (LES — Litigation Effectiveness Score) ──
   Everything below computes real numbers from actual CASES data
   wherever that data exists (matter mix, billing, reserves, task
   completion). Where the app has no real source yet — adjuster
   relationships, mentor pairing, 12-month history, goal targets —
   values are generated by a SEEDED deterministic function, not
   Math.random(): the same attorney always produces the same
   numbers on every render, they just don't come from real records
   yet. That distinction is called out explicitly in the UI rather
   than presented as if everything were equally real. */

// djb2-style string hash → deterministic "random" numbers per (attorney, key)
function seededRand(seedStr, min, max){
  let hash = 5381;
  for (let i = 0; i < seedStr.length; i++) hash = ((hash << 5) + hash + seedStr.charCodeAt(i)) | 0;
  // Avalanche finisher (murmur-style) — without this, seeds that
  // differ by only a trailing digit (e.g. 'x0' vs 'x1' vs 'x2') hash
  // to nearly identical values and collide into the same bucket when
  // floored, which is exactly the kind of near-seed pattern this file
  // uses constantly (attorney+key+index). Confirmed via direct testing
  // that omitting this causes real collisions, not a hypothetical one.
  hash ^= hash >>> 16; hash = Math.imul(hash, 0x85ebca6b);
  hash ^= hash >>> 13; hash = Math.imul(hash, 0xc2b2ae35);
  hash ^= hash >>> 16;
  const normalized = (Math.abs(hash) % 10000) / 10000;
  return min + normalized * (max - min);
}
function seededInt(seedStr, min, max){ return Math.round(seededRand(seedStr, min, max)); }
function seededPick(seedStr, arr){ return arr[Math.floor(seededRand(seedStr, 0, arr.length - 0.001))]; }
// Deterministic Fisher-Yates shuffle, seeded per-attorney — used
// anywhere multiple DISTINCT items need to be picked (e.g. 3
// different preferred adjusters), since independent seededPick calls
// can still collide by chance even with good hash distribution.
function seededShuffle(seedStr, arr){
  const copy = arr.slice();
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(seededRand(seedStr+'_shuf_'+i, 0, i + 0.999));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

const ADJUSTER_POOL = ['Karen Whitfield','Marcus Bell','Priya Nair','Tom Delgado','Rachel Kim','Steve Nowak','Angela Ruiz','Devon Marsh'];

// LES formula — six weighted factors, all documented and visible in
// the UI's methodology note rather than a black box.
const LES_WEIGHTS = { throughput: 0.15, adjusterSat: 0.20, cciAvg: 0.20, reserveAccuracy: 0.15, cycleTime: 0.15, partnerRating: 0.15 };
function lesGrade(score){
  if (score >= 95) return 'A+'; if (score >= 90) return 'A'; if (score >= 85) return 'A-';
  if (score >= 80) return 'B+'; if (score >= 75) return 'B'; if (score >= 70) return 'B-';
  if (score >= 65) return 'C+'; if (score >= 60) return 'C'; return 'D';
}
function lesGradeColor(score){
  return score >= 85 ? 'var(--green)' : score >= 70 ? '#B45309' : 'var(--red)';
}
// Points needed to reach the next grade band up, and that band's name.
function nextMilestone(score){
  const bands = [60,65,70,75,80,85,90,95,100];
  for (const b of bands) if (score < b) return { pointsNeeded: Math.ceil(b - score), nextGrade: lesGrade(b) };
  return { pointsNeeded: 0, nextGrade: lesGrade(score) };
}

function attorneyScorecard(a){
  const aCases = CASES.filter(c => c.attorney === a);
  const aClosed = aCases.filter(c => c.status === 'Closed');
  const aOpen = aCases.filter(c => c.status !== 'Closed');

  // --- Real, data-driven metrics ---
  const taskRate = (() => {
    const all = aCases.flatMap(c => c.tasks||[]);
    return all.length ? Math.round((all.filter(t => t.done).length / all.length) * 100) : seededInt(a+'task',72,92);
  })();
  const cciAvg = aOpen.length ? Math.round(aOpen.reduce((s,c)=>s+cci(c),0)/aOpen.length) : seededInt(a+'cci',45,65);

  // Matter type breakdown — #7, fully real
  const typeCounts = {};
  aCases.forEach(c => { typeCounts[c.type] = (typeCounts[c.type]||0) + 1; });
  const matterMix = Object.entries(typeCounts)
    .map(([type,count]) => ({ type, count, pct: Math.round(count/Math.max(1,aCases.length)*100) }))
    .sort((x,y) => y.count - x.count);

  // Reserve accuracy — #8, real where data exists, seeded fallback otherwise
  const reserveSamples = aClosed
    .filter(c => c.insurance.reserveAmount > 0 && c.closing.finalIndemnityPaid > 0)
    .map(c => 100 - Math.min(100, Math.abs(c.insurance.reserveAmount - c.closing.finalIndemnityPaid) / c.insurance.reserveAmount * 100));
  const reserveAccuracy = reserveSamples.length
    ? Math.round(reserveSamples.reduce((s,v)=>s+v,0)/reserveSamples.length)
    : seededInt(a+'reserve',88,98);

  // Billing metrics — #9, real aggregates
  const totalBilled = aCases.reduce((s,c)=>s+(c.billing.totalBilled||0),0);
  const totalPaid = aCases.reduce((s,c)=>s+(c.billing.totalPaid||0),0);
  const realizationRate = totalBilled > 0 ? Math.round(totalPaid/totalBilled*100) : seededInt(a+'real',88,97);
  const revenuePerMatter = aCases.length ? Math.round(totalBilled/aCases.length) : 0;
  const billingRate = aCases.find(c=>c.billing.hourlyRate)?.billing.hourlyRate || seededInt(a+'rate',375,550);
  const profitMargin = seededInt(a+'margin',58,74); // no cost-basis tracked yet — clearly an estimate, not derived

  // Adjuster relationships — #10, #11: no real adjuster-assignment
  // data exists yet, so this is seeded but stable per attorney.
  // Shuffled (not independently picked) so the 3 names are always
  // distinct, never the same adjuster three times.
  const adjusterSat = Math.round(seededRand(a+'adjsat',3.7,4.9)*10)/10;
  const preferredAdjusters = seededShuffle(a+'adjshuf', ADJUSTER_POOL).slice(0,3).map((name,i) => ({
    name, requests: seededInt(a+'adjreq'+i, 3, 14)
  })).sort((x,y)=>y.requests-x.requests);

  // Case outcome distribution — #2: dispositionType isn't populated
  // in seed data, so this is a stable seeded split scaled to real
  // closed-case count.
  const winPct = seededInt(a+'win',15,35);
  const settlePct = seededInt(a+'settle',50,72);
  const dismissPct = Math.max(0, 100 - winPct - settlePct);

  // Cycle time — days from filed to today (open) or a seeded proxy for closed
  const cycleTimes = aClosed.map(c => seededInt(c.id+'cycle',95,240));
  const avgCycleTime = cycleTimes.length ? Math.round(cycleTimes.reduce((s,v)=>s+v,0)/cycleTimes.length) : seededInt(a+'cycle',140,210);
  const cycleTimeScore = Math.max(0, Math.min(100, Math.round(100 - (avgCycleTime-90)/2))); // faster = higher score

  const partnerRating = RATINGS[a] || 85;

  // --- LES composite (the algorithm) ---
  const les = Math.round(
    taskRate * LES_WEIGHTS.throughput +
    (adjusterSat/5*100) * LES_WEIGHTS.adjusterSat +
    cciAvg * LES_WEIGHTS.cciAvg +
    reserveAccuracy * LES_WEIGHTS.reserveAccuracy +
    cycleTimeScore * LES_WEIGHTS.cycleTime +
    partnerRating * LES_WEIGHTS.partnerRating
  );

  // 12-month trend — #1, seeded random walk converging to the real current LES
  const trend = [];
  let walk = les - seededInt(a+'trendstart',4,14);
  for (let m = 0; m < 12; m++) {
    walk += seededRand(a+'trend'+m, -3, 4);
    trend.push(Math.max(40, Math.min(100, Math.round(walk))));
  }
  trend[11] = les; // always end exactly on today's real computed score

  // Specialization badges — #3, auto-detected from real matter mix + real performance
  const badges = [];
  if (matterMix[0] && matterMix[0].pct >= 40) badges.push({ icon:'🏆', label: matterMix[0].type+' Specialist' });
  if (settlePct >= 65) badges.push({ icon:'🤝', label:'Settlement Specialist' });
  if (reserveAccuracy >= 95) badges.push({ icon:'🎯', label:'Reserve Accuracy Expert' });
  if (les >= 90) badges.push({ icon:'⭐', label:'Elite Performer' });
  if (adjusterSat >= 4.6) badges.push({ icon:'😊', label:'Adjuster Favorite' });

  // Risk indicators — #4, derived from trend direction + real workload + seeded satisfaction
  const risks = [];
  const trendDelta = trend[11] - Math.round(trend.slice(0,3).reduce((s,v)=>s+v,0)/3);
  if (trendDelta <= -6) risks.push({ level:'warn', label:'Performance declining', detail: trendDelta+' LES points over the last quarter' });
  const firmAvgOpen = ATTY.reduce((s,x)=>s+CASES.filter(c=>c.attorney===x && c.status!=='Closed').length,0) / Math.max(1, ATTY.length);
  if (aOpen.length > firmAvgOpen * 1.4) risks.push({ level:'warn', label:'Heavy workload', detail: aOpen.length+' active matters vs. '+Math.round(firmAvgOpen)+' firm average' });
  if (adjusterSat < 3.8) risks.push({ level:'bad', label:'Low adjuster satisfaction', detail: adjusterSat+'/5 average rating' });

  // Goals — #5, seeded reasonable targets vs real/computed actuals.
  // "New matters this quarter" is measured against the dataset's OWN
  // most recent filed date, not the real wall clock — the seed data
  // is a fixed snapshot from a past date, so comparing against
  // today's actual date would always show zero regardless of when
  // this demo is viewed. Anchoring to the data's own timeline keeps
  // the metric meaningful indefinitely.
  const latestFiledMs = Math.max(...CASES.map(c => new Date(c.filed).getTime()).filter(t => !isNaN(t)));
  const goals = [
    { label:'LES Target', target: Math.min(100, les + seededInt(a+'gl1',5,12)), actual: les, unit:'' },
    { label:'Settlement Rate', target: 65, actual: settlePct, unit:'%' },
    { label:'Avg. Resolution Time', target: 180, actual: avgCycleTime, unit:' days', lowerIsBetter:true },
    { label:'New Matters (Qtr)', target: seededInt(a+'gl4',6,10), actual: aCases.filter(c=>{ const f=new Date(c.filed).getTime(); return !isNaN(f) && (latestFiledMs-f)/(1000*60*60*24) <= 90; }).length, unit:'' }
  ];

  return {
    name: a, cases: aCases, open: aOpen, closed: aClosed,
    taskRate, cciAvg, adjusterSat, reserveAccuracy, realizationRate, revenuePerMatter, billingRate, profitMargin,
    totalBilled, totalPaid, matterMix, preferredAdjusters, winPct, settlePct, dismissPct,
    avgCycleTime, cycleTimeScore, partnerRating, les, trend, badges, risks, goals
  };
}

// Firm-wide averages — #13's comparison baseline. Computed once from
// every attorney's real scorecard, not a separate synthetic number.
function firmAverages(){
  const all = ATTY.map(a => attorneyScorecard(a));
  const avg = key => Math.round(all.reduce((s,x)=>s+x[key],0)/all.length);
  return { les: avg('les'), settlePct: avg('settlePct'), avgCycleTime: avg('avgCycleTime'), all };
}

// Mentor/mentee pairing — #12. Deterministic: top half of the firm
// by LES mentors the bottom half, paired by rank (highest↔lowest,
// 2nd↔2nd-to-last, ...). Real ranking logic, not random pairing.
function mentorNetwork(){
  const ranked = ATTY.map(a => ({ name:a, les: attorneyScorecard(a).les })).sort((x,y)=>y.les-x.les);
  const n = ranked.length, half = Math.floor(n/2);
  const pairs = {};
  for (let i = 0; i < half; i++) {
    const mentor = ranked[i].name, mentee = ranked[n-1-i].name;
    pairs[mentor] = pairs[mentor] || { mentors:[], mentees:[] };
    pairs[mentee] = pairs[mentee] || { mentors:[], mentees:[] };
    pairs[mentor].mentees.push(mentee);
    pairs[mentee].mentors.push(mentor);
  }
  ranked.forEach(r => { if (!pairs[r.name]) pairs[r.name] = { mentors:[], mentees:[] }; });
  return pairs;
}

const ALL_STATE_NAMES = Object.keys(STATE_SOL_YEARS).sort();

/* Pull "New York" out of a jurisdiction string like "State - New York". */
function stateFromJurisdiction(jur){
  if (!jur) return null;
  const m = /^State - (.+)$/.exec(jur.trim());
  return m ? m[1] : null;
}
/* Map this app's claim/matter categories onto one of the four SOL
   reference buckets. Falls back to personalInjury, the broadest and
   most commonly applicable category, when nothing more specific matches. */
function solCategoryForCase(c){
  const cat = (c.claimCategory||'').toLowerCase();
  const type = (c.type||'').toLowerCase();
  if (type.includes('malpractice')) return 'medicalMalpractice';
  if (cat.includes('property') || cat.includes('aob') || cat.includes('wind') || cat.includes('hail') || cat.includes('mold') || cat.includes('water') || cat.includes('catastrophe') || type.includes('property') || type.includes('construction')) return 'propertyDamage';
  if (cat.includes('subrogation') || type.includes('contract') || type.includes('coverage')) return 'contractWritten';
  return 'personalInjury';
}
const SOL_CATEGORY_LABELS = {personalInjury:'Personal Injury / Bodily Injury', propertyDamage:'Property Damage', contractWritten:'Written Contract', medicalMalpractice:'Medical Malpractice'};
/* Returns {state, category, categoryLabel, years, suggestedDate} or
   null if we don't have enough info (no filed date, or state can't
   be determined from court.jurisdiction) to suggest anything. */
function getSolEstimate(c){
  const state = stateFromJurisdiction(c.court && c.court.jurisdiction);
  if (!state || !STATE_SOL_YEARS[state] || !c.filed) return null;
  const category = solCategoryForCase(c);
  const years = STATE_SOL_YEARS[state][category];
  const d = new Date(c.filed);
  if (isNaN(d.getTime())) return null;
  const wholeYears = Math.floor(years);
  const fraction = years - wholeYears;
  d.setFullYear(d.getFullYear() + wholeYears);
  if (fraction) d.setMonth(d.getMonth() + Math.round(fraction*12));
  return {state, category, categoryLabel:SOL_CATEGORY_LABELS[category], years, suggestedDate: d.toISOString().slice(0,10)};
}

/* ── LITIGATION CALENDAR ESTIMATOR ────────────────────────────
   Extends the SOL estimator's honesty pattern to the rest of the
   Key Dates tab: once a matter has a Filed date, most of the
   downstream deadlines follow a broadly typical civil litigation
   timeline. These offsets are DELIBERATELY generic (not per-state
   like the SOL table) — actual scheduling orders vary by judge and
   jurisdiction far more than SOL periods do, so a 51-state table
   here would carry false precision. Framed as a starting point to
   edit, never as the actual court-ordered deadline. Never
   overwrites a date someone already entered — only fills blanks. */
const LIT_CALENDAR_OFFSETS = [
  ['answerDue', 'Answer Due', 30],
  ['discoveryClose', 'Discovery Close', 180],
  ['expertClose', 'Expert Disclosures', 150],
  ['msjDeadline', 'MSJ Deadline', 270],
  ['pretrialConf', 'Pretrial Conference', 330],
];
function getLitigationCalendarEstimate(c){
  if (!c.filed) return null;
  const filed = new Date(c.filed);
  if (isNaN(filed.getTime())) return null;
  return LIT_CALENDAR_OFFSETS.map(([field, label, days]) => {
    const d = new Date(filed);
    d.setDate(d.getDate() + days);
    return {field, label, days, suggestedDate: d.toISOString().slice(0,10), alreadySet: !!c.keyDates[field]};
  });
}
function applyLitigationCalendarEstimate(caseId){
  const c = CASES.find(x => x.id === caseId);
  if (!c) return;
  const est = getLitigationCalendarEstimate(c);
  if (!est) return;
  est.forEach(e => { if (!e.alreadySet) c.keyDates[e.field] = e.suggestedDate; });
  sc(c);
  render();
}

const cci = c => {
  /* Proprietary weighted score, 0-100 */
  let score = 50;
  if(c.favorability) score += (c.favorability - 3) * 8;
  if(c.exposure && c.exposure.likelyExposure && c.insurance.reserveAmount) {
    const ratio = c.insurance.reserveAmount / c.exposure.likelyExposure;
    if(ratio >= 1) score += 8;
    else if(ratio >= 0.8) score += 4;
    else score -= 6;
  }
  if(c.status === 'Closed') score += 5;
  if(c.priority === 'High') score -= 5;
  if(c.keyDates && c.keyDates.sol && new Date(c.keyDates.sol) < new Date(Date.now() + 180*864e5)) score -= 8;
  if(c.tasks && c.tasks.filter(t=>!t.done).length > 5) score -= 4;
  if(c.nextStep) score += 3;
  return Math.max(0, Math.min(100, Math.round(score)));
};
const cciColor = s => s >= 70 ? '#047857' : s >= 50 ? '#B45309' : '#B91C1C';
const cciLabel = s => s >= 80 ? 'Excellent' : s >= 70 ? 'Strong' : s >= 60 ? 'Favorable' : s >= 50 ? 'Even' : s >= 40 ? 'Concerning' : 'Adverse';

/* ── CLOSING READINESS ──────────────────────────────────────
   What still stands between "settled/resolved" and "file closed
   in the claims system." Used on the dashboard and in the Closing
   tab so nothing gets missed at handoff. */
function closingBlockers(c){
  const cl = c.closing || {};
  const blockers = [];
  const openLiens = (c.liens||[]).filter(l => l.status !== 'Resolved' && l.status !== 'Waived');
  if (openLiens.length > 0) blockers.push(openLiens.length + ' unresolved lien' + (openLiens.length>1?'s':''));
  if (!cl.dispositionType) blockers.push('No disposition recorded');
  if (cl.releaseStatus !== 'Executed' && ['Settlement','Voluntary Dismissal','Arbitration Award'].includes(cl.dispositionType)) blockers.push('Release not executed');
  if (cl.dismissalStatus === 'Not Filed' && cl.dispositionType) blockers.push('Dismissal not filed');
  if (cl.excessCarrierApplicable === 'Yes' && cl.excessCarrierNotified !== 'Notified') blockers.push('Excess carrier not notified');
  if (!cl.finalInvoiceSubmitted) blockers.push('Final invoice not submitted');
  if (cl.payee && cl.dispositionType === 'Settlement' && !cl.payee.w9OnFile) blockers.push('W9 not on file for payee');
  const pendingAuth = (c.authorityRequests||[]).filter(a => a.status === 'Pending');
  if (pendingAuth.length > 0) blockers.push(pendingAuth.length + ' authority request pending');
  return blockers;
}
function closingReadiness(c){
  const blockers = closingBlockers(c);
  if (!c.closing || !c.closing.dispositionType) return {label:'Not Started', color:'var(--muted)', blockers};
  if (blockers.length === 0) return {label:'Ready to Close', color:'var(--green)', blockers};
  return {label:blockers.length+' Blocker'+(blockers.length>1?'s':''), color:'var(--red)', blockers};
}

/* Who does a legal-fee invoice actually get sent to? Never the platform's
   own subscription price (that lives entirely under Plan & Billing) —
   always a real payer on the matter: the carrier's claims adjuster (the
   normal payer in insurance defense work), the client directly, or a
   one-off custom contact (co-counsel, a TPA, etc). */
function billToOptionsFor(c){
  const opts = [];
  if (c.insurance && (c.insurance.carrier || c.insurance.adjuster)) {
    opts.push({
      key:'carrier',
      label:'Carrier / Claims Adjuster'+(c.insurance.carrier?' — '+c.insurance.carrier:''),
      name:(c.insurance.adjuster || c.insurance.carrier || 'Claims Department'),
      org:c.insurance.carrier||'',
      email:c.insurance.adjusterEmail||''
    });
  }
  opts.push({key:'client', label:'Client — '+(c.client||'—'), name:c.client||'', org:c.client||'', email:''});
  opts.push({key:'custom', label:'Custom recipient…', name:'', org:'', email:''});
  return opts;
}
function billToResolve(c, type){
  const opts = billToOptionsFor(c);
  if (type === 'custom') {
    return {type:'custom', name:S.invBillToCustomName||'(unnamed)', org:'', email:S.invBillToCustomEmail||''};
  }
  const found = opts.find(o => o.key === type) || opts[0];
  return {type:found.key, name:found.name, org:found.org, email:found.email};
}

   in Trial should have expert reports and an MSJ on file, a Closed
   case should have a settlement agreement, a Pre-Suit case shouldn't
   have deposition transcripts that haven't happened yet. */
function addDaysStr(dateStr, days){
  const d = new Date(dateStr || '2024-01-01');
  if (isNaN(d.getTime())) return '';
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0,10);
}

  const atOrPast = s => stageIdx >= STAGE_ORDER.indexOf(s);

  docs.push({title:'Complaint', type:'Pleading', filed:filed, added:filed});
  docs.push({title:'Reservation of Rights Letter', type:'Reservation of Rights', filed:addDaysStr(filed,10), added:addDaysStr(filed,10)});
  docs.push({title:'Answer to Complaint', type:'Pleading', filed:addDaysStr(filed,21), added:addDaysStr(filed,21)});
  if (atOrPast('Initial Discovery')) {
    docs.push({title:'Initial Disclosures', type:'Other', filed:addDaysStr(filed,45), added:addDaysStr(filed,45)});
  }
  if (atOrPast('Discovery')) {
    docs.push({title:'First Set of Interrogatories', type:'Motion', filed:addDaysStr(filed,60), added:addDaysStr(filed,60)});
    docs.push({title:'Request for Production of Documents', type:'Motion', filed:addDaysStr(filed,65), added:addDaysStr(filed,65)});
  }
  if (atOrPast('Expert Discovery')) {
    docs.push({title:'Deposition Transcript — Plaintiff', type:'Deposition', filed:addDaysStr(filed,120), added:addDaysStr(filed,120)});
  }
  if (c.litigationStage === 'Mediation' || (atOrPast('Mediation') && c.keyDates.mediationDate)) {
    docs.push({title:'Mediation Statement', type:'Brief', filed:addDaysStr(filed,150), added:addDaysStr(filed,150)});
  }
  if (atOrPast('Trial Preparation')) {
    docs.push({title:'Expert Report — Damages Analysis', type:'Expert Report', filed:addDaysStr(filed,180), added:addDaysStr(filed,180)});
    docs.push({title:'Motion for Summary Judgment', type:'Motion', filed:addDaysStr(filed,200), added:addDaysStr(filed,200)});
  }
  if (atOrPast('Trial')) {
    docs.push({title:'Trial Exhibit List', type:'Other', filed:addDaysStr(filed,220), added:addDaysStr(filed,220)});

/* Root-cause reference list — used for the "why is the company being
   sued" breakdown on the Enterprise tab (Operational Velocity &
   Prevention). Seeded here from each case's type/claimCategory so
   the chart has real signal; stays fully editable per matter. */
const ROOT_CAUSES = ['Product Defect','Contract Language Dispute','Premises Condition','Employment Practice','Auto Incident','Professional Error','Regulatory Non-Compliance','Vendor / Third-Party Failure','Coverage Interpretation Dispute','Other'];
function inferRootCause(c){
  const t = (c.type||'').toLowerCase(), cat = (c.claimCategory||'').toLowerCase();
  if (t.includes('product')) return 'Product Defect';
  if (t.includes('contract') || t.includes('coverage')) return 'Contract Language Dispute';
  if (t.includes('premises') || cat.includes('premises')) return 'Premises Condition';
  if (t.includes('employment')) return 'Employment Practice';
  if (t.includes('auto') || cat.includes('auto')) return 'Auto Incident';
  if (t.includes('malpractice')) return 'Professional Error';

async function loadUserContextAfterAuth(session){
  authToken = session.access_token;

  const { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', supaUser.id).single();
  const { data: membership } = await supabaseClient.from('memberships').select('org_id, role').eq('user_id', supaUser.id).limit(1).maybeSingle();

  if (!membership) {
    if (profile?.platform_admin) {

    await supabaseClient.auth.signOut();

  }

  const { data: org } = await supabaseClient.from('organizations').select('*').eq('id', membership.org_id).single();
  if (!org || org.status !== 'active') {
    const msg = org && org.status === 'pending_activation'

      : 'Your organization\'s access has been suspended. Contact your administrator.';
    st({ loginError: msg, loginLoading:false });

  }

  S.currentUser = { name: profile?.name || supaUser.email, email: supaUser.email, persona: org.persona, orgId: org.id, role: membership.role, platformAdmin: !!profile?.platform_admin, emailVerified: !!supaUser.email_confirmed_at };

async function apiFetch(path, opts = {}) {
  if (!API_BASE) throw new Error('API_BASE not configured');
  // Live Claude calls only run inside a signed-in account (they use your
  // account's plan and the server's API key). On the public sample demo
  // there's no login, so say that plainly instead of surfacing a raw 401.
  if (!authToken && /^\/api\/(ai\/|extract-claim|recommend-attorney)/.test(path)) {
    throw new Error('Live Claude analysis runs inside a signed-in account. This sample demo uses sample data only.');
  }
  const headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
  if (authToken) headers.Authorization = 'Bearer ' + authToken;
  const r = await fetch(API_BASE + path, Object.assign({}, opts, { headers }));
  const data = await r.json().catch(() => ({}));
  if (!r.ok) {
    // The account (or its organization) requires two-factor sign-in: take them straight to setup.
    if (r.status === 403 && data.code === '2FA_REQUIRED') { try { st({showSecurityModal:true, securityError:data.error}); } catch (e) {} }
    throw new Error(data.error || ('Request failed: ' + r.status));
  }
  return data;
}

/* ── ERROR REPORTING ────────────────────────────────────────
   A lightweight, self-hosted stand-in for a real error-monitoring
   service (Sentry, etc). Only reports when a real backend is
   connected — there's nowhere useful to send these from pure demo
   mode, and it would just be noise. Best-effort: a failure to REPORT
   an error must never itself throw or interrupt anything. */
function reportClientError(message, stack){
  if (!API_BASE) return;
  try {
    fetch(API_BASE + '/api/errors', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message: String(message).slice(0,2000),
        stack: stack ? String(stack).slice(0,5000) : null,
        url: window.location.href,
        orgId: S.currentUser?.orgId || null,
        userEmail: S.currentUser?.email || null
      })
    }).catch(() => {}); // fire-and-forget, genuinely don't care if this fails
  } catch (e) { /* never let error reporting itself throw */ }
}
window.addEventListener('error', (e) => {
  reportClientError(e.message, e.error?.stack);
});
window.addEventListener('unhandledrejection', (e) => {
  reportClientError('Unhandled promise rejection: ' + (e.reason?.message || e.reason), e.reason?.stack);
});

/* Saves a matter that was just created in the browser (Manual Entry or
   Sentinel Intake) to the real backend. Before this existed, those two
   flows only pushed into the local CASES array, so new matters — and any
   attorney assigned to them — disappeared on the next page load. The
   server assigns the real id and matter number; we copy them back onto
   the local object so later edits (PATCH) hit the right row. */
function persistNewCase(c) {
  if (!API_BASE || !authToken) return;
  const { id, matterNo, client, type, status, litigationStage, attorney, value, filed, deadline, ...rest } = c;
  const { insurance, ...data } = rest;
  c._persisting = apiFetch('/api/cases', {
    method: 'POST',
    body: JSON.stringify({
      client, type, status, litigationStage, attorney: (attorney && attorney !== 'Unassigned') ? attorney : null,
      value, filed: filed || null, deadline: deadline || null,
      carrier: insurance?.carrier, claimNo: insurance?.claimNo, reserveAmount: insurance?.reserveAmount,
      data
    })
  }).then(saved => {
    c.id = saved.id;
    c.matterNo = saved.matterNo;
    if (S.caseId && S.caseId !== saved.id && S.caseId === id) S.caseId = saved.id;
    render();
  }).catch(e => {
    alert('This matter was added on screen but could NOT be saved to the server: ' + e.message + '\n\nIt will be lost if you refresh. Try again or use the CSV import.');
  }).finally(() => { delete c._persisting; });
  return c._persisting;
}

/* Best-effort background sync — the UI updates instantly from the
   local CASES array (unchanged from the prototype's behavior), and
   this fires the same change at the server without blocking or
   re-rendering on the network round trip. If it fails, the change
   still exists locally but a real launch needs a retry/conflict
   story here (see README) before this is fully trustworthy. */
function syncCaseToApi(c) {
  if (!API_BASE || !authToken) return;
  // A brand-new matter is still being saved (POST) and doesn't have its
  // real server id yet — wait for that to finish, then send this update.
  if (c._persisting) { c._persisting.then(() => syncCaseToApi(c)); return; }
  const { id, matterNo, client, type, status, litigationStage, attorney, value, ...rest } = c;
  const { insurance, ...data } = rest;
  apiFetch('/api/cases/' + id, {
    method: 'PATCH',
    body: JSON.stringify({
      matterNo, client, type, status, litigationStage, attorney, value,
      carrier: insurance?.carrier, claimNo: insurance?.claimNo, reserveAmount: insurance?.reserveAmount,
      data
    })
  }).catch(e => console.error('Background sync failed for', id, ':', e.message));
}

/* Deadline notifications: SOL Watch used to be a static list buried on
   one page. This pulls every real deadline already in the data model —
   SOL dates, trial dates, mediation dates, next-step due dates, open
   task due dates — across the whole portfolio into one sorted feed,
   overdue items first, so nothing needs a human to remember to go look
   for it on the right tab. */
function getDeadlineAlerts(){
  const now = Date.now();
  const alerts = [];
  const daysUntil = d => Math.ceil((new Date(d) - now) / 864e5);
  CASES.filter(c => c.status !== 'Closed').forEach(c => {
    const label = c.matterNo || c.id;
    if (c.keyDates.sol) {
      const d = daysUntil(c.keyDates.sol);
      if (d <= 180) alerts.push({caseId:c.id, matterNo:label, client:c.client, kind:'SOL', tab:'dates', date:c.keyDates.sol, days:d, text:'Statute of limitations'});
    }
    if (c.keyDates.trialDate) {
      const d = daysUntil(c.keyDates.trialDate);
      if (d <= 90) alerts.push({caseId:c.id, matterNo:label, client:c.client, kind:'Trial', tab:'dates', date:c.keyDates.trialDate, days:d, text:'Trial date'});
    }
    if (c.keyDates.mediationDate) {
      const d = daysUntil(c.keyDates.mediationDate);
      if (d <= 90) alerts.push({caseId:c.id, matterNo:label, client:c.client, kind:'Mediation', tab:'dates', date:c.keyDates.mediationDate, days:d, text:'Mediation date'});
    }
    if (c.nextStep && c.nextStepDue) {
      const d = daysUntil(c.nextStepDue);
      if (d <= 30) alerts.push({caseId:c.id, matterNo:label, client:c.client, kind:'Next Step', tab:'overview', date:c.nextStepDue, days:d, text:c.nextStep});
    }
    (c.tasks||[]).forEach(t => {
      if (t.done || !t.due) return;
      const d = daysUntil(t.due);
      if (d <= 14) alerts.push({caseId:c.id, matterNo:label, client:c.client, kind:'Task', tab:'tasks', date:t.due, days:d, text:t.title});
    });
  });
  return alerts.sort((a,b) => a.days - b.days);
}

function notifBellHtml(){
  const alerts = getDeadlineAlerts();
  const overdue = alerts.filter(a => a.days < 0).length;
  const urgent = alerts.filter(a => a.days >= 0 && a.days <= 7).length;
  const badgeCount = overdue + urgent;
  const badgeColor = overdue > 0 ? 'var(--red)' : 'var(--gold)';

/* Global search: find a matter from anywhere in the app by matter #,
   client, attorney, carrier, or claim #, instead of needing to already
   be on the right tab first. */
function globalSearchMatches(q){
  if (!q || q.trim().length < 1) return [];
  const needle = q.trim().toLowerCase();
  return CASES.filter(c => {
    const hay = [c.matterNo, c.id, c.client, c.attorney, c.type,
      c.insurance && c.insurance.carrier, c.insurance && c.insurance.claimNo]
      .filter(Boolean).join(' ').toLowerCase();
    return hay.includes(needle);
  }).slice(0, 8);
}
function globalSearchBox(){
  const q = S.globalSearchQuery || '';
  const matches = globalSearchMatches(q);
  let h = '<div class="gsearch-wrap">';
  h += '<input class="gsearch-input" type="text" placeholder="Search matter #, client, attorney, carrier…" value="'+escAttr(q)+'" '+
    'oninput="st({globalSearchQuery:this.value})" '+
    'onkeydown="if(event.key===\'Escape\'){st({globalSearchQuery:\'\'});this.blur();} else if(event.key===\'Enter\'){const m=globalSearchMatches(this.value); if(m.length) jumpFromSearch(m[0].id);}"/>';
  if (q.trim().length > 0) {
    h += '<div class="gsearch-dropdown">';
    if (matches.length === 0) {
      h += '<div class="gsearch-empty">No matters match "'+esc(q)+'"</div>';
    } else {
      matches.forEach(c => {
        h += '<div class="gsearch-row" onmousedown="jumpFromSearch(\''+c.id+'\')">';
        h += '<div><span style="font-weight:700;color:var(--pri2);font-size:11.5px;">'+esc(c.matterNo||c.id)+'</span> ';
        h += '<span style="font-weight:600;font-size:12px;">'+esc(c.client)+'</span>';
        h += '<div style="font-size:10.5px;color:var(--muted);">'+esc(c.type)+' · '+esc(c.attorney)+'</div></div>';
        h += pill(c.status);
        h += '</div>';
      });
    }
    h += '</div>';
  }
  h += '</div>';
  return h;
}
function uf(f, v){
  const c = gc(); if (!c) return;
  if (f === 'status' && v !== c[f]) {
    if (!c.stageHistory) c.stageHistory = [];
    c.stageHistory.push({stage:v,date:td()});
    lg(c.id, c.attorney, 'Status Update', 'Stage changed to: ' + v);
  }
  c[f] = v; sc(c); render();
}
function un(o, f, v){ const c = gc(); if (!c) return; c[o][f] = v; sc(c); render(); }
function uc(k, f, v){ const c = gc(); if (!c) return; c.contacts[k][f] = v; sc(c); }
function lg(cid, au, ty, tx){
  const c = CASES.find(x => x.id === cid);
  if (c) c.updates.unshift({date:td(), author:au, type:ty, text:tx});
}

  ]});
  autoGenerateStaleReminders();
}

/* Real automation, not just a passive flag: any OPEN case with no
   activity logged in 14+ days automatically gets a follow-up task
   created for its attorney, due in 2 days — instead of relying on
   someone noticing the "stale" badge on Claims Desk and remembering
   to click Schedule. Guarded against duplicates: won't create a
   second auto-reminder for a case that already has one pending. */
function autoGenerateStaleReminders(){
  const existingAutoCaseIds = new Set(
    (S.tasks || []).filter(t => t.autoGenerated && t.status === 'pending').map(t => t.caseId)
  );
  const newReminders = [];
  CASES.filter(c => c.status !== 'Closed').forEach(c => {
    const last = (c.updates||[]).slice(-1)[0];
    const isStale = !last || (Date.now() - new Date(last.date)) > 14*864e5;
    if (!isStale || existingAutoCaseIds.has(c.id)) return;
    const due = new Date(); due.setDate(due.getDate()+2);
    newReminders.push({
      id: 't-auto-' + c.id + '-' + Date.now(),
      caseId: c.id, matter: c.id, attorney: c.attorney || 'Unassigned',
      type: 'Status Update', status: 'pending',
      createdAt: td(), dueDate: due.toISOString().slice(0,10),
      message: 'Auto-generated: no activity logged on this matter in 14+ days. Please post a status update.',
      autoGenerated: true
    });
  });
  if (newReminders.length > 0) S.tasks = [...(S.tasks||[]), ...newReminders];
}

function tasksForAttorney(attorneyName) {
  return (S.tasks || []).filter(t => t.attorney === attorneyName);
}

function createTask(caseId, attorneyName, taskType, message, dueDate){
  const task = {
    id: 't' + Date.now(),
    caseId: caseId,
    matter: caseId,
    attorney: attorneyName,
    type: taskType,
    status: 'pending',
    createdAt: new Date().toISOString().split('T')[0],
    dueDate: dueDate || null,
    message: message
  };
  st({tasks: [...(S.tasks || []), task]});
  alert('✓ Task created for ' + attorneyName);
}

function completeTask(taskId, response) {
  const tasks = (S.tasks || []).map(t => {
    if (t.id === taskId) {
      return {...t, status: 'completed', response: response, completedAt: new Date().toISOString().split('T')[0]};
    }
    return t;
  });
  st({tasks: tasks});
  alert('✓ Task completed and response sent to claims team');
}

/* ── CLICK-TO-SORT FOR EVERY TABLE ───────────────────────────
   Click any column header to sort that table by the column
   (click again to reverse). Works on all tables in the app, and the
   chosen sort is remembered while you move around the screen. */
window._tblSort = window._tblSort || {};
function _tblSig(t){ return Array.from(t.querySelectorAll('thead th')).map(h=>h.textContent.replace(/\s*[▲▼]\s*$/,'').trim()).join('|'); }
function _sortVal(td){
  if (!td) return {n:null,s:''};
  const raw = (td.getAttribute('data-sort') != null ? td.getAttribute('data-sort') : td.textContent).trim();
  const m = raw.replace(/[$,%\s]/g,'').match(/^(-?\d+(?:\.\d+)?)([KMB])?$/i);
  if (m) { const mult = {K:1e3,M:1e6,B:1e9}[(m[2]||'').toUpperCase()] || 1; return {n:parseFloat(m[1])*mult, s:raw.toLowerCase()}; }
  if (/^\d{4}-\d{2}-\d{2}/.test(raw) || /^\d{1,2}\/\d{1,2}\/\d{2,4}$/.test(raw)) { const t = Date.parse(raw); if (!isNaN(t)) return {n:t, s:raw.toLowerCase()}; }
  const lead = raw.match(/^(-?\d+(?:\.\d+)?)/);
  return {n:(raw==='—'||raw==='-'||raw==='')?null:(lead && raw.length<=8 ? parseFloat(lead[1]) : null), s:raw.toLowerCase()};
}
function _sortTable(t, col, dir){
  const tb = t.tBodies[0]; if (!tb) return;
  const rows = Array.from(tb.rows).filter(r => !Array.from(r.cells).some(c => c.colSpan > 1));
  if (rows.length < 2) return;
  const vals = rows.map(r => ({r, v:_sortVal(r.cells[col])}));
  const numeric = vals.every(x => x.v.n !== null || x.v.s === '' || x.v.s === '—' || x.v.s === '-');
  vals.sort((a,b) => {
    let c;
    if (numeric) { const an = a.v.n===null ? -Infinity : a.v.n, bn = b.v.n===null ? -Infinity : b.v.n; c = an===bn ? 0 : (an<bn?-1:1); }
    else c = a.v.s.localeCompare(b.v.s, undefined, {numeric:true});
    return dir==='desc' ? -c : c;
  });
  vals.forEach(x => tb.appendChild(x.r));
  t.querySelectorAll('thead th').forEach((h,i) => {
    const old = h.querySelector('.sort-arrow'); if (old) old.remove();
    if (i === col) { const sp = document.createElement('span'); sp.className='sort-arrow'; sp.textContent = dir==='desc' ? ' ▼' : ' ▲'; h.appendChild(sp); }
  });
}
function applyTableSort(){
  document.querySelectorAll('#ct table').forEach(t => {
    const ths = t.querySelectorAll('thead th'); if (!ths.length || !t.tBodies[0]) return;
    ths.forEach(h => { if (!h.getAttribute('onclick')) h.classList.add('sortable'); });
    const st0 = window._tblSort[_tblSig(t)];
    if (st0) _sortTable(t, st0.col, st0.dir);
  });
}
document.addEventListener('click', function(e){
  const th = e.target.closest && e.target.closest('#ct thead th');
  if (!th || th.getAttribute('onclick') || e.target.closest('button,a,input,select')) return;
  const t = th.closest('table'); if (!t || !t.tBodies[0]) return;
  const col = Array.from(th.parentElement.children).indexOf(th);
  const sig = _tblSig(t), cur = window._tblSort[sig];
  const dir = (cur && cur.col === col && cur.dir === 'asc') ? 'desc' : 'asc';
  window._tblSort[sig] = {col, dir};
  _sortTable(t, col, dir);
});

function completeLoginSession(data){
  authToken = data.token;
  S.currentUser = { id: data.user.id, name: data.user.name, email: data.user.email, persona: data.user.persona, orgId: data.user.orgId, role: data.user.role, totpEnabled: !!data.user.totpEnabled, platformAdmin: !!data.user.platformAdmin, emailVerified: !!data.user.emailVerified };
  S.isAuthenticated = true;
  S.loginLoading = false;
  S.showWelcome = true;
  S.show2FAPrompt = false;
  S._pending2FAToken = '';
  S.role = data.user.persona === 'defense' ? 'attorney' : 'tpa';
  window._loginEmail = ''; window._loginPassword = ''; window._2faCode = '';
}

async function attemptLogin(){
  const email = (window._loginEmail || '').trim();
  const password = window._loginPassword || '';
  const persona = window._loginPersona || 'carrier';
  if (!email || !email.includes('@')) { st({loginError:'Enter a valid email address.'}); return; }
  if (!password) { st({loginError:'Enter a password.'}); return; }
  st({loginError:'', loginLoading:true});

  if (supabaseClient) {
    // Supabase Auth path — only used if window.CCP_SUPABASE_URL is
    // set. Not the current backend (server.js/Neon), kept only in
    // case that direction is revisited later.
    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
    if (error) { st({loginError: error.message, loginLoading:false}); return; }
    await loadUserContextAfterAuth(data.session);
    window._loginEmail = ''; window._loginPassword = '';
    return;
  }

  if (API_BASE) {
    // Real backend path — server.js, actual credential verification.
    try {
      const data = await apiFetch('/api/auth/login', { method:'POST', body: JSON.stringify({ email, password }) });
      if (data.twoFactorRequired) {
        // Password was correct, but the account has 2FA on — one more step.
        st({loginLoading:false, show2FAPrompt:true, _pending2FAToken:data.pendingToken, loginError:''});
        return;
      }
      completeLoginSession(data);
      await Promise.all([loadCasesFromApi(), loadMyFeatures()]);
      render();
    } catch (e) {
      st({loginError: e.message, loginLoading:false});
    }
    return;
  }

  // Demo-mode path — no backend configured, accepts any well-formed credentials.
  setTimeout(() => {
    const namePart = email.split('@')[0].replace(/[._]+/g,' ').trim();
    const name = namePart.replace(/\b\w/g, ch => ch.toUpperCase()) || 'Demo User';
    S.currentUser = { name, email, persona };
    S.isAuthenticated = true;
    S.loginLoading = false;
    S.showWelcome = true;
    S.role = persona === 'defense' ? 'attorney' : 'tpa';
    window._loginEmail = ''; window._loginPassword = '';
    render();
  }, 450);
}

async function attempt2FALogin(){
  const code = (window._2faCode || '').trim();
  if (!code) { st({loginError:'Enter the 6-digit code from your authenticator app.'}); return; }
  st({loginError:'', loginLoading:true});
  try {
    const data = await apiFetch('/api/auth/2fa/login-verify', {
      method:'POST', body: JSON.stringify({ pendingToken: S._pending2FAToken, code })
    });
    completeLoginSession(data);
    await Promise.all([loadCasesFromApi(), loadMyFeatures()]);
    render();
  } catch (e) {
    st({loginError: e.message, loginLoading:false});
  }
}

async function attemptRegister(){
  const email = (window._loginEmail || '').trim();
  const password = window._loginPassword || '';
  const persona = window._loginPersona || 'carrier';
  const orgName = (window._regOrgName || '').trim();
  const name = (window._regName || '').trim();
  if (!orgName) { st({loginError:'Enter an organization name.'}); return; }
  if (!email || !email.includes('@')) { st({loginError:'Enter a valid email address.'}); return; }
  if (!password || password.length < 8) { st({loginError:'Password must be at least 8 characters.'}); return; }
  st({loginError:'', loginLoading:true});
  try {
    const data = await apiFetch('/api/auth/register', { method:'POST', body: JSON.stringify({ email, password, name, orgName, persona }) });
    completeLoginSession(data);
    await Promise.all([loadCasesFromApi(), loadMyFeatures()]);
    render();
  } catch (e) {
    st({loginError: e.message, loginLoading:false});
  }
}

function logout(){
  if (supabaseClient) supabaseClient.auth.signOut();
  if (_impersonationTimer) { clearInterval(_impersonationTimer); _impersonationTimer = null; }
  S.impersonation = null;
  authToken = null;
  S.isAuthenticated = false;
  S.currentUser = null;
  S.showUserMenu = false;
  S.role = 'litigation';

/* ══════════════════════════════════════════════════════════════════════
   AI ATTORNEY ASSIGNMENT - Premium Feature
   Gold/Silver/Bronze recommendations for case assignments
   ══════════════════════════════════════════════════════════════════════ */

function getTop3Recommendations(caseObj) {
  // ATTY is a plain list of attorney NAMES (strings). An earlier version of
  // this function read a.name / a.experience off each entry, which are
  // undefined on a string — so every recommendation showed "undefined".
  const scores = ATTY.map(name => {
    let score = 0;
    const attorneysCases = CASES.filter(c => c.attorney === name);
    const similarCases = attorneysCases.filter(c => c.type === caseObj.type);
    const openCases = attorneysCases.filter(c => c.status !== 'Closed');

    // 1. Specialization — experience with this matter type (30 pts max)
    score += Math.min(similarCases.length * 10, 30);

    // 2. Track record on closed matters (30 pts max; neutral 15 when no history yet)
    const closedCases = attorneysCases.filter(c => c.status === 'Closed');
    if (closedCases.length > 0) {
      const wins = closedCases.filter(c => (c.exposure?.settlementAmount || 0) < ((c.value || 0) * 0.35)).length;
      score += (wins / closedCases.length) * 30;
    } else {
      score += 15;
    }

    // 3. Workload availability (30 pts max) — fewer open matters scores higher
    if (openCases.length < 4) score += 30;
    else if (openCases.length < 8) score += 20;
    else if (openCases.length < 12) score += 10;

    // 4. Value alignment — handles matters of similar size (10 pts max)
    const avgCaseValue = attorneysCases.length > 0
      ? attorneysCases.reduce((sum, c) => sum + (c.value || 0), 0) / attorneysCases.length
      : 0;
    const valueDiff = Math.abs((caseObj.value || 0) - avgCaseValue);
    if (attorneysCases.length > 0 && valueDiff < 500000) score += 10;
    else if (attorneysCases.length > 0 && valueDiff < 1000000) score += 5;

    return {
      name,
      experience: openCases.length + ' open · ' + similarCases.length + ' similar',
      score: Math.min(100, Math.round(score))
    };
  });
  return scores.sort((x, y) => y.score - x.score).slice(0, 3);
}

/* ── NEEDS ATTENTION ─────────────────────────────────────────
   One place that watches the whole portfolio and surfaces what needs a
   human today: deadlines, money, stale work, workload and approvals.
   Built from data the app already tracks; thresholds are named here so
   they're easy to change. Red = act now, amber = watch, blue = good news. */
/* Early-warning thresholds — set a little ahead of the point of real trouble so people hear
   about it while there is still time to act. (Deadlines fire earlier; activity/spend fire sooner.) */
const ATTN = { SOL_DAYS:120, TRIAL_DAYS:45, STALE_DAYS:21, BURN_PCT:0.60, RESERVE_PCT:0.85, OVERLOAD_OPEN:9 };
function caseLastActivity(c){
  let best = c.filed ? new Date(c.filed).getTime() : 0;
  (c.updates||[]).forEach(u => { const t = new Date(u.date).getTime(); if (!isNaN(t) && t > best) best = t; });
  return best;
}

function demandToday(){ return new Date().toLocaleDateString('en-CA', {timeZone:'America/New_York'}); }
function demandDaysBetween(a, b){ const x = Date.parse(a+'T00:00:00Z'), y = Date.parse(b+'T00:00:00Z'); return (isFinite(x) && isFinite(y)) ? Math.round((y-x)/864e5) : null; }
function demandEff(d){ return (d.extendedDeadline || d.deadline || '').slice(0,10); }
function demandsOf(c){ return Array.isArray(c.timeLimitDemands) ? c.timeLimitDemands : []; }
/* ── Hour-level deadlines. A demand has a date, a time of day and a time zone. If the letter gives no
   time we assume 5:00 PM Eastern and say so on screen, so the clock is never kinder than the letter. ── */
const DEMAND_TZ = [['America/New_York','ET'],['America/Chicago','CT'],['America/Denver','MT'],['America/Los_Angeles','PT']];
function demandTzAbbr(tz){ const m = DEMAND_TZ.find(x => x[0] === tz); return m ? m[1] : 'ET'; }
function demandTzOffsetMs(utcMs, tz){
  const f = new Intl.DateTimeFormat('en-US', {timeZone:tz, hourCycle:'h23', year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit'});
  const p = {}; f.formatToParts(new Date(utcMs)).forEach(x => { p[x.type] = x.value; });
  return Date.UTC(+p.year, +p.month-1, +p.day, +p.hour, +p.minute, +p.second) - Math.floor(utcMs/1000)*1000;
}
function demandInstant(dateStr, hm, tz){
  const dm = /^(\d{4})-(\d{2})-(\d{2})/.exec(dateStr || ''), tm = /^(\d{1,2}):(\d{2})/.exec(hm || '');
  if (!dm || !tm) return NaN;
  const base = Date.UTC(+dm[1], +dm[2]-1, +dm[3], +tm[1], +tm[2]);
  let t = base; for (let i = 0; i < 3; i++) t = base - demandTzOffsetMs(t, tz || 'America/New_York');
  return t;
}
function demandHM(d){
  if (d.deadlineHM && /^\d{1,2}:\d{2}$/.test(d.deadlineHM)) return {hm:d.deadlineHM, stated:true};
  const m = /(\d{1,2})(?::(\d{2}))?\s*(am|pm)/i.exec(d.deadlineTime || '');
  if (m) { let h = (+m[1]) % 12; if (/pm/i.test(m[3])) h += 12; return {hm:String(h).padStart(2,'0')+':'+(m[2]||'00'), stated:true}; }
  return {hm:'17:00', stated:false};
}
function demandDeadlineMs(d){ return demandInstant(demandEff(d), demandHM(d).hm, d.tz); }
function demandHours(d){ const ms = demandDeadlineMs(d); return isFinite(ms) ? (ms - Date.now())/36e5 : null; }
function demandTimeLabel(d){
  const t = demandHM(d), [h, m] = t.hm.split(':').map(Number);
  return ((h%12)||12)+':'+String(m).padStart(2,'0')+' '+(h>=12?'PM':'AM')+' '+demandTzAbbr(d.tz)+(t.stated ? '' : ' (no time in the letter, assumed)');
}
function demandCountdown(hrs){
  const a = Math.abs(hrs), h = Math.floor(a), m = Math.floor((a-h)*60);
  const txt = a >= 48 ? Math.floor(a/24)+' days '+Math.floor(a%24)+'h' : h+'h '+String(m).padStart(2,'0')+'m';
  return hrs < 0 ? txt+' PAST DEADLINE' : txt+' left';
}
function demandLeftFromHours(hrs){ return hrs < 0 ? -Math.max(1, Math.ceil(-hrs/24)) : Math.floor(hrs/24); }
/* Every OPEN demand across the open caseload, most urgent first. */
function openDemandRows(scope){
  const today = demandToday(), rows = [];
  (scope || CASES).forEach(c => {
    if (c.status === 'Closed') return;
    demandsOf(c).forEach(d => {
      if (!d || d.status !== 'open') return;
      const hrs = demandHours(d);
      if (hrs === null) return;
      rows.push({c, d, left:demandLeftFromHours(hrs), hrs});
    });
  });
  return rows.sort((a,b) => a.hrs - b.hrs);
}
function demandWhen(left){
  return left < 0 ? Math.abs(left)+' day'+(Math.abs(left)===1?'':'s')+' PAST DEADLINE' : left === 0 ? 'DUE TODAY' : left === 1 ? 'Due tomorrow' : 'Due in '+left+' days';
}
function demandTone(left){
  return left < 0 ? {bg:'#7F1D1D', fg:'#fff', bd:'#7F1D1D', label:'Past deadline'}
       : left <= 3 ? {bg:'#FEE2E2', fg:'#991B1B', bd:'#FCA5A5', label:'Critical'}
       : left <= DEMAND_WARN_DAYS ? {bg:'#FEF3C7', fg:'#92400E', bd:'#FCD34D', label:'Due soon'}
       : {bg:'#ECFDF5', fg:'#065F46', bd:'#A7F3D0', label:'On track'};
}
function demandCounts(){
  const rows = openDemandRows();
  return {all:rows.length, late:rows.filter(r=>r.left<0).length, crit:rows.filter(r=>r.left>=0 && r.left<=3).length, soon:rows.filter(r=>r.left>3 && r.left<=DEMAND_WARN_DAYS).length, rows};
}
function demandStateOf(c){
  const s = stateFromJurisdiction(c.court && c.court.jurisdiction);

/* Plain-language checks of a demand against its state's rule. Flags for a human, never a legal conclusion. */
function demandChecks(d){
  const out = [], r = STATE_RULES[d.state];

  const given = (d.receivedDate && d.deadline) ? demandDaysBetween(d.receivedDate, d.deadline) : null;
  let min = r.minDays;
  if (r.abbr === 'CA' && d.method === 'Regular mail') min = 33;
  if (min && given !== null && given < min) out.push({sev:'warn', t:'This demand gives '+given+' day'+(given===1?'':'s')+' from the date recorded as received. '+d.state+' sets a minimum of '+min+' days from '+r.minFrom+'. It may not meet the statute. Send it to counsel today, and do not assume the deadline can be ignored.'});
  if (r.abbr === 'GA' && d.method && !['Certified mail','Overnight courier','Hand delivery'].includes(d.method)) out.push({sev:'warn', t:'Georgia expects delivery by certified mail or another method with proof of delivery. This one came by '+d.method.toLowerCase()+'. Ask counsel whether it qualifies, and still treat the deadline as live.'});
  if (r.abbr === 'MO' && d.method && d.method !== 'Certified mail') out.push({sev:'warn', t:'Missouri requires certified mail. Ask counsel whether this demand qualifies.'});
  if (r.safeHarborDays && d.receivedDate) {
    const sh = new Date(Date.parse(d.receivedDate+'T00:00:00Z') + r.safeHarborDays*864e5).toISOString().slice(0,10);

  }
  if (Number(d.policyLimits) > 0 && Number(d.demandAmount) > 0 && Number(d.demandAmount) <= Number(d.policyLimits)) out.push({sev:'info', t:'The demand is within policy limits, which is the situation in which an unreasonable refusal creates excess-judgment exposure.'});

}
function demandExposureFlag(c, d){

}

/* ── Backup claims person: every matter with an open time-limit demand or a statute of limitations
   inside 120 days needs a second person tracking it, so the date is not riding on one person. ── */

  const sol = c.keyDates && c.keyDates.sol ? Date.parse(String(c.keyDates.sol).slice(0,10)+'T00:00:00Z') : NaN;

/* ── Acknowledgment: each person on the matter confirms "I have seen this demand". The matter is fully
   acknowledged when the primary AND the backup have both done it. ── */
function demandAcks(d){ return Array.isArray(d.acks) ? d.acks : []; }
function demandAckedBy(d, name){ return !!name && demandAcks(d).some(a => a.by === name); }
function demandFullyAcked(c, d){
  const prim = claimsPrimary(c), bk = claimsBackup(c);
  const needP = !!prim, needB = !backupMissing(c);
  if (!needP && !needB) return demandAcks(d).length > 0;
  return (!needP || demandAckedBy(d, prim)) && (!needB || demandAckedBy(d, bk));
}
function ackDemand(caseId, id){
  const {c, d} = demandFind(caseId, id); if (!c || !d) return;
  const me = demandMe() || 'User';
  if (demandAckedBy(d, me)) return;
  const role = claimsPrimary(c) === me ? 'primary' : (claimsBackup(c) === me ? 'backup' : 'other');
  d.acks = demandAcks(d).concat([{by:me, role, byId:(S.currentUser && S.currentUser.id) || null, at:new Date().toISOString()}]);
  demandLog(d, 'Acknowledged by '+me+(role==='other'?'':' ('+role+')')+'.');
  demandCaseNote(c, 'Time-limit demand acknowledged by '+me+'.');
  sc(c); render();
}
function demandAckLineV(c, d){
  const prim = claimsPrimary(c), bk = claimsBackup(c), me = demandMe();
  const chip = (label, name) => {
    const a = demandAcks(d).find(x => x.by === name);
    return a ? '<span style="color:#166534;font-weight:700;">✔ '+label+' '+esc(name)+' <span style="font-weight:500;color:var(--dim);">'+esc(new Date(a.at).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit',timeZone:'America/New_York'}))+' ET</span></span>'
             : '<span style="color:#B91C1C;font-weight:700;">✘ '+label+' '+esc(name)+' has not acknowledged</span>';
  };
  const parts = [];
  if (prim) parts.push(chip('Adjuster', prim));
  if (!backupMissing(c)) parts.push(chip('Backup adjuster', bk));
  let h = '<div style="font-size:12px;margin-top:5px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;">'+(parts.join('') ? parts.join('<span style="color:var(--dim);">·</span>') : '<span style="color:#B91C1C;font-weight:700;">No adjuster is assigned to acknowledge this</span>');
  if (me && !demandAckedBy(d, me)) h += '<button class="btn btn-out" style="padding:3px 10px;font-size:11.5px;border-color:#15803D;color:#166534;font-weight:800;" onclick="ackDemand(\''+esc(c.id)+'\',\''+esc(d.id)+'\')">✔ I have seen this</button>';
  return h + '</div>';
}

/* ── Escalation ladder ──
   If a demand is not acknowledged by 72 hours out, a manager is notified; at 48 hours a director; at 24 hours
   the VP / Chief Claims. Only the first rung is skipped when everyone has acknowledged. Responding to the demand
   ends the ladder. Rungs, hours and people are set by an owner or admin. Emails go out only when email alerts are on. */
const DEMAND_LADDER_DEFAULT = [
  {hours:72, label:'Manager', userIds:[], roles:['admin','owner'], unlessAcked:true},
  {hours:48, label:'Director', userIds:[], roles:['admin','owner'], unlessAcked:false},
  {hours:24, label:'VP / Chief Claims', userIds:[], roles:['owner'], unlessAcked:false}];
function demandLadder(){ return (S.demandEmails && Array.isArray(S.demandEmails.ladder) && S.demandEmails.ladder.length) ? S.demandEmails.ladder : DEMAND_LADDER_DEFAULT; }
function demandRungWho(rung){
  const people = (S.demandEmails && S.demandEmails.people) || [];
  const picked = (rung.userIds||[]).map(id => (people.find(x => x.id === id)||{}).name).filter(Boolean);
  if (picked.length) return picked.join(', ');
  return (rung.roles||[]).map(r => r === 'owner' ? 'owners' : 'admins').join(' and ');
}
function demandLadderStatus(c, d){
  const hrs = demandHours(d); if (hrs === null) return [];
  const sent = (S.demandEmails && S.demandEmails.sent && S.demandEmails.sent[d.id]) || {};
  const acked = demandFullyAcked(c, d);
  const rungs = demandLadder().slice().sort((a,b) => b.hours - a.hours);

      else { state = 'due'; note = (S.demandEmails && S.demandEmails.enabled) ? 'notifying' : 'would notify (email alerts are off)'; }
    }
    return {rung:r, state, note};
  });

/* Whole-file CSV parser (handles quoted commas, quotes and line breaks inside cells). */
function parseCsvText(text){
  const rows = []; let row = [], cur = '', q = false;
  text = String(text||'').replace(/^﻿/, '');
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"' && text[i+1] === '"') { cur += '"'; i++; } else if (ch === '"') q = false; else cur += ch; }
    else if (ch === '"') q = true;
    else if (ch === ',') { row.push(cur); cur = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i+1] === '\n') i++; row.push(cur); cur = ''; if (row.some(v => v.trim() !== '')) rows.push(row); row = []; }
    else cur += ch;
  }
  row.push(cur); if (row.some(v => v.trim() !== '')) rows.push(row);
  return rows;
}
function counselParse(text){
  const rows = parseCsvText(text);
  if (rows.length < 2) throw new Error('The file needs a header row and at least one attorney.');
  const heads = rows[0].map(h => h.trim().toLowerCase().replace(/[_\s]+/g,' '));
  const map = {}, unknown = [];
  heads.forEach((h, i) => { const k = Object.keys(COUNSEL_HEADERS).find(key => COUNSEL_HEADERS[key].includes(h)); if (k && map[k] === undefined) map[k] = i; else if (h) unknown.push(rows[0][i].trim()); });
  if (map.name === undefined && !(map.firstName !== undefined && map.lastName !== undefined)) throw new Error('Could not find a Name column. The first row must be column names, like Name, Firm, Email, States.');
  const recs = rows.slice(1).map(r => { const o = {}; Object.keys(map).forEach(k => { o[k] = (r[map[k]] || '').trim(); }); return o; });
  return {recs, unknown};
}

function counselSimImport(recs, commit, markMissing){

  recs.forEach((rec, i) => { const n = counselNormClient(rec); if (n.error) { errors.push({row:i+2, name:(rec.name||rec.lastName||'').slice(0,60), reason:n.error}); return; } const k = key(n.row); if (good.has(k)) dup++; good.set(k, n.row); });
  const list = counselAll(), find = r => list.find(x => (r.externalId && x.externalId && x.externalId.toLowerCase() === r.externalId.toLowerCase()) || (r.email && x.email && x.email.toLowerCase() === r.email) || (x.name.toLowerCase() === r.name.toLowerCase() && (x.firm||'').toLowerCase() === (r.firm||'').toLowerCase()));

  good.forEach(r => { const hit = find(r); if (hit) { updated++; touched.add(hit.id); if (commit) Object.assign(hit, r); } else { created++; if (commit) { const row = Object.assign({id:'demo-ac-'+Date.now()+'-'+created}, r); list.push(row); touched.add(row.id); } } });

}

  h += '<div style="font-size:12.5px;color:var(--muted);margin-bottom:10px;max-width:780px;">The rules that decide how dangerous a demand is, and the laws that drive verdict size. Georgia is shown first.</div>';

function attentionData(scopeCases, opts){
  opts = opts || {};
  const now = Date.now(), day = 864e5;
  const open = (scopeCases || CASES).filter(c => c.status !== 'Closed');
  const items = [];
  const add = (o) => { if (o.cases ? o.cases.length : o.count) items.push(Object.assign({count:o.cases?o.cases.length:0}, o)); };
  const dLabel = d => d < 0 ? Math.abs(d)+'d past due' : d === 0 ? 'today' : 'in '+d+'d';
  const first = (arr, fn) => arr.slice(0,2).map(fn).join(' · ') + (arr.length > 2 ? ' · +' + (arr.length-2) + ' more' : '');

  // 0. Time-limit demands — an unanswered one can turn a defensible claim into an excess verdict
  { const dc = demandCounts(); const scoped = new Set(open.map(c=>c.id)); const rows = dc.rows.filter(r => scoped.has(r.c.id) && r.left <= DEMAND_WARN_DAYS);
    if (rows.length) { const late = rows.filter(r=>r.left<0).length;
      items.push({key:'demands', sev:'red', icon:'⏱', title: late ? 'Time-limit demand PAST DEADLINE' : 'Time-limit demands due soon', count:rows.length, cases:null,
        detail: rows.slice(0,2).map(r => esc(r.c.client)+' '+demandWhen(r.left).toLowerCase()).join(' · ')+(rows.length>2?' · +'+(rows.length-2)+' more':''),
        go:"st({role:'demands',caseId:null,showWelcome:false})"}); } }

  { const nb = open.filter(c => caseNeedsBackup(c) && backupMissing(c));
    if (nb.length) items.push({key:'nobackup', sev:'red', icon:'👥', title:'Time-critical matters with no backup adjuster', count:nb.length, cases:nb,
      detail: first(nb, c => esc(c.client))}); }

  // 1. Statute of limitations — the one missed date that becomes a claim against you
  const sol = open.filter(c => c.keyDates && c.keyDates.sol && new Date(c.keyDates.sol).getTime() <= now + ATTN.SOL_DAYS*day)
                  .sort((a,b) => new Date(a.keyDates.sol) - new Date(b.keyDates.sol));
  add({key:'sol', sev:'red', icon:'⏰', title:'Statute of limitations within '+ATTN.SOL_DAYS+' days', cases:sol,
       detail: first(sol, c => esc(c.client)+' '+dLabel(Math.ceil((new Date(c.keyDates.sol)-now)/day)))});

  // 2. Under-reserved — reserve below likely exposure
  const under = open.filter(c => (c.exposure && c.exposure.likelyExposure > 0) && ((c.insurance && c.insurance.reserveAmount) || 0) < c.exposure.likelyExposure*ATTN.RESERVE_PCT);
  const gap = under.reduce((t,c) => t + (c.exposure.likelyExposure - ((c.insurance&&c.insurance.reserveAmount)||0)), 0);
  add({key:'reserve', sev:'red', icon:'🛡️', title:'Reserves below likely exposure', cases:under, detail:'Combined shortfall about '+fM(gap)+' across '+under.length+' matter'+(under.length!==1?'s':'')});

  // 3. Overdue tasks
  const today = new Date().toISOString().slice(0,10);
  let overdueTasks = 0;
  const overdue = open.filter(c => { const n = (c.tasks||[]).filter(t => !t.done && t.due && t.due < today).length; overdueTasks += n; return n > 0; });
  add({key:'tasks', sev:'red', icon:'✅', title:'Overdue tasks', cases:overdue, detail: overdueTasks+' task'+(overdueTasks!==1?'s':'')+' past due on '+overdue.length+' matter'+(overdue.length!==1?'s':'')});

  // 4. Trial coming up
  const trial = open.filter(c => c.keyDates && c.keyDates.trialDate && new Date(c.keyDates.trialDate).getTime() >= now - day && new Date(c.keyDates.trialDate).getTime() <= now + ATTN.TRIAL_DAYS*day)
                    .sort((a,b) => new Date(a.keyDates.trialDate) - new Date(b.keyDates.trialDate));
  add({key:'trial', sev:'amber', icon:'⚖️', title:'Trial in the next '+ATTN.TRIAL_DAYS+' days', cases:trial,
       detail: first(trial, c => esc(c.client)+' '+dLabel(Math.ceil((new Date(c.keyDates.trialDate)-now)/day)))});

  // 5. Reserve burn
  const burn = open.filter(c => ((c.insurance&&c.insurance.reserveAmount)||0) > 0 && ((c.billing&&c.billing.totalBilled)||0) / c.insurance.reserveAmount > ATTN.BURN_PCT);
  add({key:'burn', sev:'amber', icon:'🔥', title:'Spend above '+Math.round(ATTN.BURN_PCT*100)+'% of reserve', cases:burn, detail:'Billed amounts are approaching the reserve on these matters'});

  // 6. Stale
  const stale = open.filter(c => caseLastActivity(c) && now - caseLastActivity(c) > ATTN.STALE_DAYS*day).sort((a,b) => caseLastActivity(a) - caseLastActivity(b));
  add({key:'stale', sev:'amber', icon:'💤', title:'No activity in '+ATTN.STALE_DAYS+'+ days', cases:stale,
       detail: stale.length ? 'Quietest: '+esc(stale[0].client)+' ('+Math.floor((now-caseLastActivity(stale[0]))/day)+' days)' : ''});

  // 7. Missing next step
  const nostep = open.filter(c => !c.nextStep);
  add({key:'nostep', sev:'amber', icon:'🧭', title:'No next step recorded', cases:nostep, detail:'Each of these matters has no plan on file'});

  if (!opts.personal) {
    // 8. Attorney overload
    const byAtty = {};
    open.forEach(c => { const a = (c.attorney||'').trim(); if (a && a !== 'Unassigned') (byAtty[a] = byAtty[a] || []).push(c); });
    const loaded = Object.keys(byAtty).filter(a => byAtty[a].length >= ATTN.OVERLOAD_OPEN).sort((a,b) => byAtty[b].length - byAtty[a].length);
    if (loaded.length) items.push({key:'overload', sev:'amber', icon:'📈', title:'Attorneys at '+ATTN.OVERLOAD_OPEN+'+ open matters', count:loaded.length, cases:null,
       detail: loaded.slice(0,2).map(a => esc(a)+' ('+byAtty[a].length+')').join(' · '), go:"st({role:'scorecard',caseId:null,scorecardDetail:null,showWelcome:false})"});

    // 9. Payables awaiting approval (people who can approve only)
    if (canSeeAssignAlert()) {
      const waiting = (typeof PAYABLES !== 'undefined' ? PAYABLES : []).filter(p => p.status === 'Submitted');
      const late = (typeof PAYABLES !== 'undefined' ? PAYABLES : []).filter(p => p.status === 'Approved' && p.dueDate && p.dueDate < today);
      const n = waiting.length + late.length;
      if (n) items.push({key:'payables', sev:'amber', icon:'💳', title:'Payables need action', count:n, cases:null,
        detail: waiting.length+' awaiting approval ('+fM(waiting.reduce((t,p)=>t+(p.amount||0),0))+')'+(late.length?' · '+late.length+' overdue to pay':''), go:"st({role:'payables',caseId:null,showWelcome:false})"});
    }

    // 10. Ready to close
    const ready = open.filter(c => c.closing && c.closing.dispositionType && closingReadiness(c).label === 'Ready to Close');
    add({key:'ready', sev:'blue', icon:'🏁', title:'Ready to close', cases:ready, detail:'All closing steps are done — hand these off to claims'});
  }
  const rank = {red:0, amber:1, blue:2};
  items.sort((a,b) => rank[a.sev] - rank[b.sev] || (a.key==='demands'?-1:b.key==='demands'?1:0) || b.count - a.count);
  return items;
}

/* ══════════════════════════════════════════════════════════════════════
   DRILL-DOWN VIEWS - Click any dashboard element to see detailed breakdowns
   ══════════════════════════════════════════════════════════════════════ */

function drillDownV() {
  const type = S.drillType;
  const value = S.drillValue;
  const label = S.drillLabel || 'Cases';
  
  let filteredCases = CASES;
  
  // Filter based on what was clicked
  switch(type) {
    case 'open':
      filteredCases = CASES.filter(c => c.status !== 'Closed');
      break;
    case 'mediation':
      const next90 = new Date(Date.now() + 90*864e5);
      filteredCases = CASES.filter(c => c.keyDates.mediationDate && new Date(c.keyDates.mediationDate) <= next90 && new Date(c.keyDates.mediationDate) >= new Date());
      break;
    case 'trial':
      const next90Trial = new Date(Date.now() + 90*864e5);
      filteredCases = CASES.filter(c => c.keyDates.trialDate && new Date(c.keyDates.trialDate) <= next90Trial && new Date(c.keyDates.trialDate) >= new Date());
      break;
    case 'reserves':
      filteredCases = CASES.filter(c => c.insurance.reserveAmount > 0).sort((a,b) => b.insurance.reserveAmount - a.insurance.reserveAmount);
      break;
    case 'cci':
      filteredCases = CASES.filter(c => c.status !== 'Closed');
      break;
    case 'reserve-risk':
      // Cases where reserve is inadequate (reserve < 70% of exposure)
      filteredCases = CASES.filter(c => c.exposure.likelyExposure && (c.insurance.reserveAmount/c.exposure.likelyExposure) < 0.7);
      break;
    case 'sol-risk':
      // Cases with SOL within 180 days
      filteredCases = CASES.filter(c => c.keyDates.sol && new Date(c.keyDates.sol) < new Date(Date.now() + 180*864e5));
      break;
    case 'no-step':
      // Cases missing next step
      filteredCases = CASES.filter(c => !c.nextStep);
      break;
    case 'trial-candidates':
      // Cases marked as trial candidates
      filteredCases = CASES.filter(c => c.potentialTrialCandidate);
      break;
    /* ── Enterprise dashboard drill-downs — parametrized by drillValue ── */
    case 'carrier-exposure':
      filteredCases = CASES.filter(c => (c.insurance.carrier || 'Self-Insured') === value).sort((a,b)=>(b.exposure.likelyExposure||b.value)-(a.exposure.likelyExposure||a.value));
      break;
    case 'state-exposure':
      filteredCases = CASES.filter(c => (stateFromJurisdiction(c.court && c.court.jurisdiction) || 'Not Set') === value).sort((a,b)=>(b.exposure.likelyExposure||b.value)-(a.exposure.likelyExposure||a.value));
      break;
    case 'probability-of-loss':
      filteredCases = CASES.filter(c => c.status !== 'Closed' && (c.probabilityOfLoss||'Reasonably Possible') === value);
      break;
    case 'root-cause':
      filteredCases = CASES.filter(c => (c.rootCause||'Other') === value);
      break;
    case 'matter-type-spend':
      filteredCases = CASES.filter(c => c.type === value).sort((a,b)=>(b.billing.totalBilled||0)-(a.billing.totalBilled||0));
      break;
    case 'material-matters':
      filteredCases = CASES.filter(c => c.status !== 'Closed' && (c.exposure.likelyExposure||c.value||0) > 10000000).sort((a,b)=>(b.exposure.likelyExposure||b.value)-(a.exposure.likelyExposure||a.value));
      break;
    case 'cycle-time-type':
      filteredCases = CASES.filter(c => c.status === 'Closed' && c.type === value);
      break;
    case 'afa-matters':
      filteredCases = CASES.filter(c => c.billing.type && c.billing.type !== 'Hourly');
      break;
    default:
      if (type && type.indexOf('attn-') === 0) {
        const mine = value === 'mine';
        const it = attentionData(mine ? myAttnCases() : null, {personal: mine}).find(x => x.key === type.slice(5));
        filteredCases = (it && it.cases) || [];
      }
  }
  
  let h = '<div style="padding:20px;max-width:1200px;margin:0 auto;">';

  // Show as table
