  const readiness = closingReadiness(c);

  let h = '<div class="grid-3">';
  h += '<div class="kpi"><div class="kpi-bar" style="background:'+readiness.color+'"></div><div class="kpi-l">Closing Readiness</div><div class="kpi-v" style="color:'+readiness.color+';font-size:17px;">'+readiness.label+'</div></div>';
  h += '<div class="kpi"><div class="kpi-l">Open Liens</div><div class="kpi-v" style="color:'+((c.liens||[]).filter(l=>l.status!=='Resolved'&&l.status!=='Waived').length>0?'var(--red)':'var(--green)')+';">'+(c.liens||[]).filter(l=>l.status!=='Resolved'&&l.status!=='Waived').length+'</div></div>';
  h += '<div class="kpi"><div class="kpi-l">Pending Authority</div><div class="kpi-v" style="color:'+((c.authorityRequests||[]).filter(a=>a.status==='Pending').length>0?'var(--gold)':'var(--green)')+';">'+(c.authorityRequests||[]).filter(a=>a.status==='Pending').length+'</div></div>';
  h += '</div>';

  if (readiness.blockers.length > 0) {
    h += '<div class="alert-warn" style="margin-bottom:14px;"><strong>Blocking closure:</strong> '+readiness.blockers.map(esc).join(' · ')+'</div>';
  } else if (cl.dispositionType) {
    h += '<div class="alert-good" style="margin-bottom:14px;">All closing items complete — ready to hand off to claims.</div>';
  }

  /* Disposition */
  h += '<div class="section-band">Disposition</div>';
  h += '<div class="grid-3">';
  h += '<div>'+sel('Disposition Type', 'ucl(\'dispositionType\',this.value)', ['','Settlement','Voluntary Dismissal','Involuntary Dismissal','Summary Judgment — Defense','Summary Judgment — Plaintiff','Verdict — Defense','Verdict — Plaintiff','Arbitration Award','Withdrawn','Other'], cl.dispositionType)+'</div>';
  h += '<div>'+inp('Disposition Date', cl.dispositionDate, 'ucl(\'dispositionDate\',this.value)','date')+'</div>';
  h += '<div>'+inp('Final Indemnity Paid', cl.finalIndemnityPaid, 'ucl(\'finalIndemnityPaid\',parseFloat(this.value)||0)','number')+'</div>';
  h += '</div>';

  /* Release & dismissal */
  h += '<div class="section-band">Release &amp; Dismissal</div>';
  h += '<div class="grid-3">';
  h += '<div>'+sel('Release Status', 'ucl(\'releaseStatus\',this.value)', ['Not Started','Sent to Plaintiff','Executed'], cl.releaseStatus)+'</div>';
  h += '<div>'+inp('Release Date', cl.releaseDate, 'ucl(\'releaseDate\',this.value)','date')+'</div>';
  h += '<div>'+sel('Dismissal Status', 'ucl(\'dismissalStatus\',this.value)', ['Not Filed','Filed','Entered by Court'], cl.dismissalStatus)+'</div>';
  h += '</div>';
  h += '<div class="grid-3">';
  h += '<div>'+inp('Dismissal Date', cl.dismissalDate, 'ucl(\'dismissalDate\',this.value)','date')+'</div>';
  h += '<div style="display:flex;align-items:flex-end;padding-bottom:11px;gap:8px;"><input type="checkbox" id="satFiled" '+(cl.satisfactionFiled?'checked':'')+' onchange="ucl(\'satisfactionFiled\',this.checked)" style="width:16px;height:16px;cursor:pointer;"/><label for="satFiled" style="font-size:11.5px;color:var(--ink);cursor:pointer;">Satisfaction of judgment filed</label></div>';
  h += '</div>';

  /* Excess carrier */
  h += '<div class="section-band">Excess / Umbrella Carrier Notice</div>';
  h += '<div class="grid-3">';
  h += '<div>'+sel('Applicable?', 'ucl(\'excessCarrierApplicable\',this.value)', ['No','Yes'], cl.excessCarrierApplicable)+'</div>';
  h += '<div>'+sel('Notice Status', 'ucl(\'excessCarrierNotified\',this.value)', ['N/A','Pending','Notified'], cl.excessCarrierNotified)+'</div>';
  h += '<div>'+inp('Notice Date', cl.excessCarrierNoticeDate, 'ucl(\'excessCarrierNoticeDate\',this.value)','date')+'</div>';
  h += '</div>';

  /* Liens & subrogation */
  h += '<div class="section-band">Liens &amp; Subrogation ('+(c.liens||[]).length+')</div>';
  h += '<div style="font-size:11px;color:var(--muted);margin-bottom:9px;">Medicare/Medicaid conditional payments, ERISA, hospital, and other liens must be resolved or waived before claims can disburse settlement funds.</div>';
  h += '<div style="display:grid;grid-template-columns:1fr 1.5fr 1fr 1fr 1fr auto;gap:7px;align-items:end;margin-bottom:14px;">';
  h += '<div>'+sel('Type','window._lnT=this.value', ['Medicare','Medicaid','ERISA','Hospital','Attorney','Other'], S._lnT||'Medicare')+'</div>';
  h += '<div>'+inp('Lienholder','','window._lnH=this.value','text','e.g. CMS / MSPRC')+'</div>';
  h += '<div>'+inp('Amount Asserted','','window._lnA=this.value','number')+'</div>';
  h += '<div>'+inp('Amount Resolved For','','window._lnR=this.value','number')+'</div>';
  h += '<div>'+sel('Status','window._lnS=this.value', ['Open','Negotiating','Resolved','Waived'], S._lnS||'Open')+'</div>';
  h += '<button class="btn btn-pri" onclick="addLien()">+ Add</button></div>';
  if ((c.liens||[]).length === 0) {
    h += '<div style="padding:14px;text-align:center;color:var(--muted);font-size:11px;">No liens on file.</div>';
  } else {
    h += '<table><thead><tr><th>Type</th><th>Lienholder</th><th>Asserted</th><th>Resolved For</th><th>Status</th><th></th></tr></thead><tbody>';
    c.liens.forEach((l,i) => {
      const stCol = l.status==='Resolved'||l.status==='Waived' ? 'var(--green)' : l.status==='Negotiating' ? 'var(--gold)' : 'var(--red)';
      h += '<tr><td style="font-weight:600;">'+esc(l.type)+'</td><td>'+esc(l.holder)+'</td><td>'+fM(l.amountAsserted)+'</td><td>'+fM(l.amountResolved)+'</td>';
      h += '<td><span class="tag" style="background:'+stCol+'18;color:'+stCol+';font-weight:700;">'+esc(l.status)+'</span></td>';
      h += '<td><button class="btn btn-ghost" style="font-size:10px;padding:3px 7px;color:var(--red);" onclick="removeLien('+i+')">Remove</button></td></tr>';
    });
    h += '</tbody></table>';
  }

  /* Settlement authority requests */
  h += '<div class="section-band">Settlement Authority Requests ('+(c.authorityRequests||[]).length+')</div>';
  h += '<div style="font-size:11px;color:var(--muted);margin-bottom:9px;">A formal ask to claims for authority to settle — separate from the informal offer/demand log on the Settlement tab.</div>';
  h += '<div style="display:grid;grid-template-columns:1fr 1fr 2fr auto;gap:7px;align-items:end;margin-bottom:14px;">';
  h += '<div>'+inp('Date','','window._arD=this.value','date')+'</div>';
  h += '<div>'+inp('Amount Requested','','window._arA=this.value','number')+'</div>';
  h += '<div>'+inp('Justification','','window._arJ=this.value','text','Why this number, litigation risk, etc.')+'</div>';
  h += '<button class="btn btn-pri" onclick="addAuthReq()">+ Request</button></div>';
  if ((c.authorityRequests||[]).length === 0) {
    h += '<div style="padding:14px;text-align:center;color:var(--muted);font-size:11px;">No authority requests logged.</div>';
  } else {
    h += '<table><thead><tr><th>Date</th><th>Requested</th><th>Justification</th><th>Status</th><th>Action</th></tr></thead><tbody>';
    c.authorityRequests.forEach((a,i) => {
      const stCol = a.status==='Approved' ? 'var(--green)' : a.status==='Denied' ? 'var(--red)' : 'var(--gold)';
      h += '<tr><td>'+esc(a.date)+'</td><td style="font-weight:700;color:var(--gold);">'+fM(a.amountRequested)+'</td><td style="font-size:11px;color:var(--muted);">'+esc(a.justification||'')+'</td>';
      h += '<td><span class="tag" style="background:'+stCol+'18;color:'+stCol+';font-weight:700;">'+esc(a.status)+'</span></td>';
      h += '<td>';
      if (a.status === 'Pending') {
        h += '<button class="btn btn-ghost" style="font-size:10px;padding:3px 7px;color:var(--green);" onclick="setAuthReqStatus('+i+',\'Approved\')">Approve</button> ';
        h += '<button class="btn btn-ghost" style="font-size:10px;padding:3px 7px;color:var(--red);" onclick="setAuthReqStatus('+i+',\'Denied\')">Deny</button>';
      } else { h += '<span style="font-size:10px;color:var(--dim);">'+(a.approvedDate?esc(a.approvedDate):'—')+'</span>'; }
      h += '</td></tr>';
    });
    h += '</tbody></table>';
  }

  /* Payee / disbursement */
  h += '<div class="section-band">Payee / Disbursement Info</div>';
  h += '<div class="grid-3">';
  h += '<div>'+inp('Payee Name', cl.payee.name, 'uclNested(\'payee\',\'name\',this.value)')+'</div>';
  h += '<div>'+inp('Tax ID / SSN (last 4)', cl.payee.taxId, 'uclNested(\'payee\',\'taxId\',this.value)')+'</div>';
  h += '<div style="display:flex;align-items:flex-end;padding-bottom:11px;gap:8px;"><input type="checkbox" id="w9OnFile" '+(cl.payee.w9OnFile?'checked':'')+' onchange="uclNested(\'payee\',\'w9OnFile\',this.checked)" style="width:16px;height:16px;cursor:pointer;"/><label for="w9OnFile" style="font-size:11.5px;color:var(--ink);cursor:pointer;">W9 on file</label></div>';
  h += '</div>';
  h += '<div>'+inp('Payee Mailing Address', cl.payee.address, 'uclNested(\'payee\',\'address\',this.value)')+'</div>';

  /* Final invoice + notes */
  h += '<div class="section-band">Final Billing &amp; Notes</div>';
  h += '<div style="display:flex;align-items:center;gap:9px;margin-bottom:11px;padding:10px 12px;background:var(--surf);border-radius:6px;">';
  h += '<input type="checkbox" id="finInv" '+(cl.finalInvoiceSubmitted?'checked':'')+' onchange="ucl(\'finalInvoiceSubmitted\',this.checked)" style="width:16px;height:16px;cursor:pointer;"/>';
  h += '<label for="finInv" style="font-size:12px;color:var(--ink);font-weight:500;cursor:pointer;">Final invoice submitted to claims</label>';
  h += '<span style="flex:1;"></span>';
  h += '<input type="date" value="'+esc(cl.finalInvoiceDate)+'" onchange="ucl(\'finalInvoiceDate\',this.value)" style="width:auto;"/>';
  h += '</div>';
  h += '<div>'+ta('Closing Notes', cl.closingNotes, 'ucl(\'closingNotes\',this.value)', 'Anything else claims should know before closing the file')+'</div>';

  /* Generate handoff summary */
  h += '<div class="section-band">Claims Handoff Summary</div>';
  h += '<div style="font-size:11px;color:var(--muted);margin-bottom:9px;">Compiles everything above into one summary you can copy or download and send to the claims examiner.</div>';
  h += '<div style="display:flex;gap:8px;margin-bottom:11px;">';
  h += '<button class="btn btn-pri" onclick="genClosingSummary()">Generate Summary</button>';
  if (S.closingSummary) {
    h += '<button class="btn btn-out" onclick="copyClosingSummary()">Copy to Clipboard</button>';
    h += '<button class="btn btn-out" onclick="downloadClosingSummary()">Download .txt</button>';
  }
  h += '</div>';
  if (S.closingSummary) {
    h += '<div class="card" style="background:var(--surf2);"><pre style="white-space:pre-wrap;font-family:inherit;font-size:11.5px;line-height:1.7;color:var(--ink);margin:0;">'+esc(S.closingSummary)+'</pre></div>';
  }

  return h;
}

  h += '<div class="kpi"><div class="kpi-l">Total Paid</div><div class="kpi-v" style="color:var(--green);">'+fV(c.billing.totalPaid)+'</div></div>';
  h += '<div class="kpi"><div class="kpi-l">Budget</div><div class="kpi-v" style="color:var(--gold);">'+fV(c.billing.budget)+'</div></div>';

  h += '<div class="section-band">Billing Arrangement</div>';
  h += '<div class="grid-3">';

  h += '<div>'+sel('UTBMS Code','window._teC=this.value', LCODES, S._teC||LCODES[0])+'</div>';
  h += '<div>'+inp('Hours','','window._teH=this.value','number')+'</div>';
  h += '<div>'+inp('Rate','','window._teR=this.value','number')+'</div>';
  h += '<button class="btn btn-pri" onclick="addTE()">+ Time</button></div>';
  h += '<div>'+ta('Description','','window._teX=this.value','LEDES-compliant narrative')+'</div>';

  h += '<div class="section-band">Time Entries ('+(c.billing.timeEntries||[]).length+')</div>';
  if ((c.billing.timeEntries||[]).length === 0) {
    h += '<div style="padding:14px;text-align:center;color:var(--muted);font-size:11px;">No time logged yet.</div>';

    h += '<table><thead><tr><th>Date</th><th>Atty</th><th>Code</th><th>Hours</th><th>Rate</th><th>Total</th><th>Description</th></tr></thead><tbody>';
    c.billing.timeEntries.slice().reverse().slice(0,15).forEach(t => {

    });

  }

  h += '<div class="section-band">Bill To — Who Pays This Invoice</div>';
  const btOpts = billToOptionsFor(c);
  h += '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;align-items:end;margin-bottom:6px;">';
  h += '<div class="fld"><label class="lbl">Recipient</label><select onchange="st({invBillToType:this.value})" class="inp">'+
    btOpts.map(o => '<option value="'+esc(o.key)+'"'+(S.invBillToType===o.key?' selected':'')+'>'+esc(o.label)+'</option>').join('')+
    '</select></div>';
  if (S.invBillToType === 'custom') {
    h += inp('Recipient Name', S.invBillToCustomName, 'st({invBillToCustomName:this.value})');
    h += inp('Recipient Email', S.invBillToCustomEmail, 'st({invBillToCustomEmail:this.value})', 'email');
  } else {
    const preview = billToResolve(c, S.invBillToType);
    h += '<div class="fld"><label class="lbl">Contact</label><div class="inp" style="background:var(--surf2);color:var(--muted);">'+esc(preview.name||'—')+'</div></div>';
    h += '<div class="fld"><label class="lbl">Email on file</label><div class="inp" style="background:var(--surf2);color:var(--muted);">'+esc(preview.email||'Not on file — add one below')+'</div></div>';
  }
  h += '</div>';

  h += '<div style="display:flex;gap:8px;margin-top:14px;"><button class="btn btn-out" onclick="genInv()">Generate Invoice</button><button class="btn btn-out" onclick="exportLEDES()">Export LEDES 1998B</button></div>';

  if ((c.billing.invoices||[]).length > 0) {
    h += '<div class="section-band">Invoices Sent ('+c.billing.invoices.length+')</div>';
    h += '<table><thead><tr><th>Invoice #</th><th>Date</th><th>Amount</th><th>Bill To</th><th>Status</th><th></th></tr></thead><tbody>';
    c.billing.invoices.slice().reverse().forEach(inv => {
      const bt = inv.billTo || {name:'—',email:''};
      const mailLink = bt.email ? 'mailto:'+encodeURIComponent(bt.email)+'?subject='+encodeURIComponent('Invoice '+inv.number+' — '+(c.matterNo||c.id))+'&body='+encodeURIComponent('Please find invoice '+inv.number+' for '+fM(inv.amount)+' attached.') : '';
      h += '<tr><td style="font-weight:700;color:var(--pri2);">'+esc(inv.number)+'</td><td>'+esc(inv.date)+'</td>';
      h += '<td style="font-weight:700;color:var(--green);">'+fM(inv.amount)+'</td>';
      h += '<td style="font-size:11px;">'+esc(bt.name||'—')+(bt.org?' <span style="color:var(--dim);">('+esc(bt.org)+')</span>':'')+'</td>';
      h += '<td><span class="tag">'+esc(inv.status||'Sent')+'</span></td>';
      h += '<td>'+(mailLink?'<a href="'+mailLink+'" class="muted-link" style="font-size:11px;">Email →</a>':'<span style="font-size:11px;color:var(--dim);">no email on file</span>')+'</td>';
      h += '</tr>';
    });
    h += '</tbody></table>';
  }

  return h;
}

  return h;

/* ── TAB: AI ───────────────────────────────────────────── */

/* ── SENTINEL SUITE (premium AI modules, per matter) ───────────────
   Settle / Strategy / Horizon run against the open matter's real data
   through the server (the API key never touches the browser). Watch
   is the portfolio-wide scan. Each module is gated by the org's plan
   (S.myFeatures); a locked module shows what it does and who to call.
   The public sample demo has no login, so it shows clearly-labelled

/* AI Smart Attorney Assignment - Shows 3 tiered options */
async function aiAssignBestAttorney() {
  if (!S.aiExtracted) return;
  
  st({ aiAssignLoading: true, showAttorneySelector: true });
  
  try {
    const d = S.aiExtracted;
    const attorneyList = ATTY;

    // Real, authenticated call to the actual backend — apiFetch adds
    // the Bearer token and the API_BASE prefix, unlike the old plain
    // fetch("/api/recommend-attorney") this replaced, which was a
    // leftover from a Vercel-Edge-Function-era build that had no
    // separate auth step. Against the real server.js, that old call
    // would 401 every time. This route is also plan-gated server-side
    // (requireFeature('sentinel_match')) — a 403 here means it's not
    // included on this org's plan, not a real failure, so it gets a
    // clearer message below instead of the generic one.
    let recommendations;
    if (authToken) {
      recommendations = await apiFetch('/api/recommend-attorney', {
        method: 'POST',
        body: JSON.stringify({
          caseDetails: {
            client: d.client,
            type: d.type,
            priority: d.priority,
            value: d.value,
            summary: d.summary
          },
          attorneys: attorneyList
        })
      });
    } else {
      // Public demo (nobody signed in): the original same-origin call to
      // this site's own /api/recommend-attorney, as it worked before.
      // If that's unavailable, rank with the built-in workload/experience
      // scoring (same as the Assign Cases screen) so the demo still works.
      try {
        const response = await fetch('/api/recommend-attorney', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ caseDetails: { client: d.client, type: d.type, priority: d.priority, value: d.value, summary: d.summary }, attorneys: attorneyList })
        });
        if (!response.ok) throw new Error('same-origin recommend failed: ' + response.status);
        recommendations = await response.json();
      } catch (err) {
        console.warn('Same-origin recommend-attorney unavailable, using built-in scoring:', err.message);
        const top = getTop3Recommendations({ type: d.type, value: d.value || 0 });
        const tiers = ['gold', 'silver', 'bronze'];
        recommendations = {};
        top.forEach((a, i) => {
          recommendations[tiers[i]] = { attorney: a.name, reasoning: a.name + ' scores ' + a.score + '/100 for this matter (' + a.experience + ') on matter-type experience, current workload, and track record.' };
        });
      }
    }

    // Validate attorneys exist
    const validateAtty = (name) => ATTY.includes(name) ? name : (ATTY[0] || 'Unassigned');

    S.attorneyRecommendations = {
      gold: { attorney: validateAtty(recommendations.gold.attorney), reasoning: recommendations.gold.reasoning },
      silver: { attorney: validateAtty(recommendations.silver.attorney), reasoning: recommendations.silver.reasoning },
      bronze: { attorney: validateAtty(recommendations.bronze.attorney), reasoning: recommendations.bronze.reasoning }
    };

    console.log('✅ Attorney recommendations:', S.attorneyRecommendations);

    // Refresh UI to show selector
    st({ aiAssignLoading: false });
    render();

  } catch (error) {
    console.error('Attorney recommendation failed:', error);
    st({ aiAssignLoading: false, showAttorneySelector: false });
    alert(error.message || 'Failed to recommend attorneys. Please assign manually.');
  }
}

/* Assigns a matter to an attorney for real: saves it, links it to the
   attorney's login (so it appears on THEIR dashboard), logs it on the
   matter, and emails them. Returns a plain-English result line. Used by
   both Sentinel Match flows (the Assign Cases screen and Sentinel Intake). */
async function assignCaseToAttorney(caseObj, attorneyName, opts) {
  opts = opts || {};
  caseObj.attorney = attorneyName;
  if (!API_BASE || !authToken) return 'Assigned to ' + attorneyName + '.';
  try {
    if (caseObj._persisting) await caseObj._persisting;   // brand-new matter: wait until it has a real id
    const r = await apiFetch('/api/cases/' + caseObj.id + '/assign', {
      method: 'POST',
      body: JSON.stringify({ attorneyName, reason: opts.reason || null, source: opts.source || 'manual' })
    });
    // Bring the server's record of the assignment (activity entry, linked user) back locally.
    caseObj.assignedAttorneyUserId = r.case.assignedAttorneyUserId;
    caseObj.updates = r.case.updates || caseObj.updates;
    caseObj.assignment = r.case.assignment;
    if (r.notified) return 'Assigned to ' + attorneyName + ' — they\'ve been emailed and the matter is now on their dashboard.';
    if (r.notifyNote === 'no_login') return 'Assigned to ' + attorneyName + ' and saved. They don\'t have a login in this account yet, so nobody was notified — invite them from Team so they can sign in and work it.';
    if (r.notifyNote === 'email_not_configured') return 'Assigned to ' + attorneyName + ' and it\'s on their dashboard, but email isn\'t set up on this server yet, so no notification was sent.';
    return 'Assigned to ' + attorneyName + ' and it\'s on their dashboard, but the notification email failed to send.';
  } catch (e) {
    return 'Could not save the assignment to the server: ' + e.message;
  }
}

/* SAMPLE-MODE claim extraction — used only when nobody is signed in (the
   public ?demo=1 link). Pulls the obvious fields out of pasted text with
   simple pattern matching so the Sentinel Intake flow can be shown end to
   end without exposing a live AI key to the public. A signed-in account
   uses the real Claude extraction instead. */
function sampleExtractClaim(text) {
  const t = String(text || '');
  const flat = t.replace(/\s+/g, ' ').trim();
  const carriers = ['Liberty Mutual','State Farm','Travelers','Zurich','Hartford','Chubb','AIG','Progressive','Allstate','Nationwide','GEICO','CNA','Farmers'];
  const carrier = carriers.find(c => new RegExp('\\b' + c + '\\b', 'i').test(flat)) || '';
  const claimNo = (flat.match(/\bCLM[-\s]?[\w-]{4,}/i) || flat.match(/claim\s*(?:no\.?|number|#)?\s*[:#]?\s*([A-Z0-9][\w-]{4,})/i) || [])[0] || '';
  let client = '';
  let m = flat.match(/(?:[Ii]nsured|[Cc]lient|[Dd]efendant)\s*[:\-]?\s*([A-Z][A-Za-z0-9&.'-]*(?:\s+[A-Z&][A-Za-z0-9&.'-]*){0,4})/);
  if (m) client = m[1];
  if (!client) { m = flat.match(/\b(?:Re|RE|Subject)\s*:\s*([A-Z][A-Za-z0-9&.'-]*(?:\s+[A-Z&][A-Za-z0-9&.'-]*){0,3}?)\s*(?:[-\u2013\u2014,:]|$)/); if (m) client = m[1]; }
  if (!client) { m = flat.match(/\b([A-Z][A-Za-z0-9&.'-]*(?:\s+[A-Z][A-Za-z0-9&.'-]*){0,3}\s+(?:Corp|Corporation|Inc|LLC|Co|Company|Group|Holdings|Services|Industries|Logistics|Trucking|Transport|Freight|Partners|Enterprises))\b/); if (m) client = m[1]; }
  client = client.replace(/^(?:Insured|Client|Defendant)\s+/i, '').replace(/\s+(Claim|Auto|Date|Policy|Loss)$/i, '').trim();
  const amounts = [];
  const amtRe = /\$\s?([\d][\d,]*(?:\.\d+)?)\s*(k|m|million|thousand)?/gi;
  let a; while ((a = amtRe.exec(flat))) {
    let n = parseFloat(a[1].replace(/,/g, '')); const u = (a[2] || '').toLowerCase();
    if (u === 'k' || u === 'thousand') n *= 1e3; if (u === 'm' || u === 'million') n *= 1e6;
    amounts.push(Math.round(n));
  }
  const value = amounts.length ? Math.max(...amounts) : 0;
  const resM = flat.match(/reserve[^$]{0,25}\$\s?([\d,]+)/i);
  const reserve = resM ? parseInt(resM[1].replace(/,/g, ''), 10) : 0;
  let filed = '';
  const iso = flat.match(/\b(20\d{2})-(\d{2})-(\d{2})\b/);
  const us = flat.match(/\b(\d{1,2})\/(\d{1,2})\/(20\d{2})\b/);
  if (iso) filed = iso[0]; else if (us) filed = us[3] + '-' + us[1].padStart(2,'0') + '-' + us[2].padStart(2,'0');
  const l = flat.toLowerCase();
  const type = /product|defect(?:ive)? (?:part|product)|recall/.test(l) ? 'Product Liability'
    : /employ|harass|wrongful term|discriminat|wage/.test(l) ? 'Employment'
    : /construction|contractor|roof|scaffold/.test(l) ? 'Construction Defect'
    : /fire|water damage|property damage|hail|flood/.test(l) ? 'Property Damage'
    : /auto|vehicle|collision|truck|slip|fall|injur|premises|accident/.test(l) ? 'Personal Injury'
    : /breach|contract|commercial/.test(l) ? 'Commercial Litigation' : 'Insurance Defense';
  const priority = (value >= 1000000 || /fatal|death|catastroph|wrongful death/.test(l)) ? 'High' : (value && value < 100000 ? 'Low' : 'Medium');
  return {
    client, type, status: 'Active', priority, attorney: 'Unassigned', carrier, claimNo,
    aob: /assignment of benefits|\bAOB\b/i.test(flat) ? 'Yes' : 'No',
    catastrophe: /catastroph|hurricane|tornado|wildfire/.test(l) ? 'Yes' : 'No',
    coverageType: /auto|vehicle|collision|truck/.test(l) ? 'Commercial Auto' : 'General Liability',
    filed, value, reserve,
    summary: flat.slice(0, 220) + (flat.length > 220 ? '…' : '')
  };
}

/* Process claim text with Claude API */
async function aiProcessClaimIntake() {
  const claimText = document.getElementById('aiClaimText')?.value || S.aiClaimText;
  
  if (!claimText.trim()) {
    st({ aiError: 'Please paste claim information to extract data' });
    return;
  }
  
  st({ aiProcessing: true, aiError: '' });
  
  try {
    // Calls the real backend (POST /api/extract-claim), which calls
    // Claude with the securely-stored API key. Replaces a raw,
    // unauthenticated fetch() left over from the pre-real-backend
    // prototype — it carried no login token, so it 401'd for every
    // real signed-in customer. apiFetch() attaches the Bearer token
    // like every other authenticated call in this app. Available on
    // every plan, not gated behind an add-on — this is basic case
    // intake, not a proprietary Sentinel analysis.
    let extracted;
    S.aiSampleFallback = false;
    if (authToken) {
      // Signed in: the real, authenticated backend (plan-aware, audited).
      extracted = await apiFetch('/api/extract-claim', { method: 'POST', body: JSON.stringify({ claimText: claimText }) });
    } else {
      // Public demo (nobody signed in): the original same-origin call to
      // this site's own /api function, exactly as it worked before the
      // signed-in backend path was added. Only if THAT fails do we fall
      // back to built-in sample extraction so the demo never dead-ends.
      try {
        const response = await fetch('/api/extract-claim', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ claimText: claimText })
        });
        if (!response.ok) throw new Error('same-origin extract failed: ' + response.status);
        extracted = await response.json();
      } catch (err) {
        console.warn('Same-origin extract-claim unavailable, using built-in sample extraction:', err.message);
        extracted = sampleExtractClaim(claimText);
        S.aiSampleFallback = true;
      }
    }

    // Validate required fields
    if (!extracted.client) {
      throw new Error('Could not extract client name from claim details');
    }
    
    // Convert strings to proper types
    extracted.value = parseInt(extracted.value) || 0;
    extracted.reserve = parseInt(extracted.reserve) || 0;
    
    // Set defaults for empty fields
    if (!extracted.type) extracted.type = 'Insurance Defense';
    if (!extracted.status) extracted.status = 'Active';
    if (!extracted.priority) extracted.priority = 'Medium';
    if (!extracted.attorney) extracted.attorney = 'Unassigned';
    if (!extracted.carrier) extracted.carrier = 'AIG';
    if (!extracted.aob) extracted.aob = 'No';
    if (!extracted.catastrophe) extracted.catastrophe = 'No';
    if (!extracted.coverageType) extracted.coverageType = 'General Liability';
    if (!extracted.filed) extracted.filed = td();
    
    console.log('✅ Extracted claim data:', extracted);
    
    // Move to review step
    st({ 
      aiProcessing: false, 
      aiIntakeStep: 2,
      aiExtracted: extracted 
    });
    
  } catch (error) {
    console.error('AI extraction failed:', error);
    st({ 
      aiProcessing: false,
      aiError: 'Error: ' + (error.message || 'Check console for details')
    });
  }
}

/* Create case from AI-extracted data */
function submitAiExtractedCase() {
  if (!S.aiExtracted) return;
  
  const d = S.aiExtracted;
  
  try {
    // Create new case ID
    const newCaseId = 'CC-' + String(CASES.length + 1).padStart(3, '0');
    
    // Get attorney object
    const attorneyName = d.attorney;
    
    // Create case using mkC
    const newCase = mkC(
      newCaseId,
      d.client,
      d.type,
      d.status,
      d.priority,
      attorneyName,
      d.filed,
      '',
      d.value,
      0,
      d.claimNo,
      d.carrier,
      d.reserve,
      ''
    );
    
    // Add extra fields from AI
    newCase.aob = d.aob;
    newCase.catastrophe = d.catastrophe;
    newCase.coverageType = d.coverageType;
    newCase.orgId = S.currentOrg;
    
    // Add initial AI-generated notes
    if (d.summary) {
      newCase.updates.unshift({
        date: td(),
        author: 'AI Intake',
        type: 'AI Analysis',
        text: d.summary
      });
    }
    
    // Add to CASES (and save it to the server)
    CASES.push(newCase);
    persistNewCase(newCase);
    
    console.log('✅ Case created from AI intake:', newCaseId, d.client);
    
    // Log audit trail
    logAuditTrail('case_created_ai_intake', newCaseId, null, newCase);
    
    // Show success and close
    st({ 
      aiIntakeStep: 3
    });
    
  } catch (error) {
    console.error('Error creating case:', error);
    st({
      aiError: 'Error creating case: ' + error.message
    });
  }
}

/* Auto-classifies a document's type from its title when the user
   hasn't explicitly picked one from the dropdown — genuine
   automation, honestly scoped: this is keyword matching on the
   title text, not OCR or real content analysis of an uploaded
   file (this repository is a document LOG, not file storage, so
   there's no file content to read). Falls back to 'Other' rather
   than guessing wrong with false confidence. */
function inferDocType(title){
  const t = (title||'').toLowerCase();
  const rules = [
    [/medical|hospital|physician|radiology|mri|xray|x-ray|treatment record/, 'Medical Record'],
    [/deposition|depo\b/, 'Deposition'],
    [/expert.*(report|disclosure)|report.*expert/, 'Expert Report'],
    [/motion/, 'Motion'],
    [/\border\b|ruling/, 'Order'],
    [/brief|memorandum/, 'Brief'],
    [/pleading|complaint|answer\b/, 'Pleading'],
    [/contract\b/, 'Contract'],
    [/agreement|release/, 'Agreement'],
    [/invoice|bill\b/, 'Invoice'],
    [/coverage letter/, 'Coverage Letter'],
    [/reservation of rights|\brfr\b/, 'Reservation of Rights'],
    [/correspondence|letter|email/, 'Correspondence'],
    [/photo|estimate|police|incident report/, 'Evidence'],
  ];
  for (const [pattern, type] of rules) if (pattern.test(t)) return type;
  return null;
}

/* ── AI INTEGRATION (Claude API) ───────────────────────── */
async function callClaude(prompt, sys){
  try {
    const r = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        model:'claude-sonnet-4-20250514',
        max_tokens:1200,
        system: sys || 'You are an expert insurance defense litigation analyst. Provide concise, actionable insights formatted in clear paragraphs. Avoid bullet point overuse.',
        messages:[{role:'user', content:prompt}]
      })
    });
    const d = await r.json();
    return d.content.filter(b => b.type === 'text').map(b => b.text).join('\n');
  } catch(e) {
    return 'AI request failed: ' + e.message + '\n\nNote: This prototype calls the Anthropic API directly. In production, route via your secure backend.';
  }
}

// Calls the real backend (POST /api/ai/case-assistant/:caseId), which
// builds the matter context server-side from caseSummaryForAI and
// calls Claude with the securely-stored API key. This replaces an
// older version that built a big context string client-side and
// called https://api.anthropic.com directly from the browser with no
// key attached — that call could never actually succeed (browsers
// can't call Anthropic's API directly like that), which is why it
// always failed with "Failed to fetch".
async function runAI(prompt){
  const c = gc(); if (!c || !prompt) return;
  st({aiLoad:true, aiText:''});
  try {
    const data = await apiFetch('/api/ai/case-assistant/' + c.id, {
      method:'POST',
      body: JSON.stringify({ prompt })
    });
    st({aiLoad:false, aiText:data.analysis});
  } catch (e) {
    st({aiLoad:false, aiText:'AI request failed: ' + e.message});
  }
}

// Calls the real backend (POST /api/ai/report-summary), which builds
// the system prompt server-side and calls Claude with the securely
// -stored API key. Replaces an older version that called callClaude()
// — the direct-to-api.anthropic.com browser call that always failed
// with "Failed to fetch" — same bug the AI Assistant had, fixed the

async function genRptAI(rptId){
  if (S.myFeatures && !S.myFeatures.ai_assistant) { alert('AI Insights isn\'t included on your current plan. Contact your account team to add it.'); return; }
  let snap = S.viewingSavedId ? getSavedReport(S.viewingSavedId) : null;
  if (!snap) { snap = saveReportSnapshot(rptId); }
  if (!snap) return;
  st({showReportPreview:true, reportId:rptId, viewingSavedId:snap.id, aiLoad:true});
  try {
    const sampleRows = snap.rows.slice(0, 20).map(r => snap.cols.map((c,i) => c+': '+r[i]).join(', '));
    const data = await apiFetch('/api/ai/report-summary', {
      method:'POST',
      body: JSON.stringify({ reportName: snap.name, rowCount: snap.rowCount, sampleRows })
    });
    snap.aiSummary = data.analysis;
    st({aiLoad:false, aiText:data.analysis});
  } catch (e) {
    st({aiLoad:false, aiText:'AI request failed: ' + e.message});
  }
}

  const q = (window._rptQ || '').trim();
  if (!q) { alert('Please describe the report'); return; }
  st({rptLoad:true});
  try {
    const data = await apiFetch('/api/ai/portfolio-query', {
      method:'POST',
      body: JSON.stringify({ query: q })
    });
    st({rptLoad:false, rptResult:data.analysis});
  } catch (e) {
    st({rptLoad:false, rptResult:'AI request failed: ' + e.message});
  }
}

/* ── DEMO DATA RANDOMIZATION ───────────────────────────────
   Runs ONCE per page load, only when there's no real backend
   connected (!API_BASE) — this is a hard safety gate. If a real
   server.js is wired up, CASES gets replaced with actual customer
   data after login (loadCasesFromApi), and randomizing seed data
   before that is harmless but this function must NEVER run against
   real data, hence the explicit guard at the call site below rather
   than relying on demo-mode UI cues alone.

   Scope, deliberately: names, dollar figures, and dates get
   randomized (the things a viewer would visually recognize as
   "the same demo every time"). Judge names, docket numbers, and
   hand-written case notes are left alone — rewriting those well
   would need real narrative generation, not simple randomization,
   and touching them risks internal inconsistencies for little
   visible benefit. */
const RANDO_FIRST = ['James','Michael','Sarah','Jennifer','David','Lisa','Robert','Maria','John','Patricia','Daniel','Karen','Christopher','Nancy','Matthew','Emily','Andrew','Rachel','Joshua','Michelle','Kevin','Amanda','Brian','Stephanie','Jason','Laura','Ryan','Rebecca','Justin','Samantha'];
const RANDO_LAST = ['Chen','Ortega','Park','Santos','Goldberg','Whitfield','Bell','Nair','Delgado','Kim','Nowak','Ruiz','Marsh','Sullivan','Bennett','Cortez','Fitzgerald','Hoffman','Reyes','Blackwood','Donovan','Ferreira','Hutchins','Larkin','Mercer','Okonkwo','Pruitt','Vance','Whitmore','Zimmerman'];
const RANDO_CO_PREFIX = ['Meridian','Coastal','Summit','Harbor','Sterling','Ashford','Beacon','Redwood','Highland','Vanguard','Cornerstone','Lighthouse','Granite','Pinnacle','Hearthstone','Ironwood','Northgate','Fairview','Westbrook','Brightwater'];
const RANDO_CO_SUFFIX = ['Industries','Holdings','Group','Partners','Corp','LLC','Enterprises','Realty','Logistics','Manufacturing','Properties','Ventures','Solutions','Capital','Systems'];
const RANDO_CARRIERS = ['Meridian Mutual','Continental Assurance','Pinnacle Insurance Group','Guardian National','Heartland Casualty','Beacon Hill Insurance','Sentinel Mutual','Anchor Point Insurance','Summit Assurance','Coastal Underwriters'];

function randoPick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function randoUniqueNames(count, firstPool, lastPool){
  const used = new Set(); const out = [];
  let guard = 0;
  while (out.length < count && guard < count*50) {
    guard++;
    const name = randoPick(firstPool) + ' ' + randoPick(lastPool);
    if (!used.has(name)) { used.add(name); out.push(name); }
  }
  return out;
}
function randoShiftDateStr(dstr, shiftDays){
  if (!dstr || typeof dstr !== 'string' || !/^\d{4}-\d{2}-\d{2}/.test(dstr)) return dstr;
  const d = new Date(dstr);
  if (isNaN(d.getTime())) return dstr;
  d.setDate(d.getDate() + shiftDays);
  return d.toISOString().slice(0,10);
}
function randomizeDemoData(){
  // Attorneys — new unique names, same 5 brand colors just remapped.
  const oldNames = ATTY.slice();
  const oldColors = oldNames.map(a => ATTY_COLOR[a]);
  const newNames = randoUniqueNames(oldNames.length, RANDO_FIRST, RANDO_LAST);
  const nameMap = {};
  oldNames.forEach((old,i) => { nameMap[old] = newNames[i]; });

  ATTY.length = 0; ATTY.push(...newNames);
  Object.keys(ATTY_COLOR).forEach(k => delete ATTY_COLOR[k]);
  newNames.forEach((name,i) => { ATTY_COLOR[name] = oldColors[i]; });

  const usedClients = new Set();
  CASES.forEach(c => {
    // Attorney reassignment (preserves the original workload distribution)
    c.attorney = nameMap[c.attorney] || randoPick(newNames);
    if (c.backupAttorney) c.backupAttorney = nameMap[c.backupAttorney] || c.backupAttorney;

    // Client name — mostly company-style (matches this dataset's
    // mostly-commercial matter mix), occasionally a person's name.
    let newClient = Math.random() < 0.8
      ? randoPick(RANDO_CO_PREFIX) + ' ' + randoPick(RANDO_CO_SUFFIX)
      : randoPick(RANDO_FIRST) + ' ' + randoPick(RANDO_LAST);
    let guard = 0;
    while (usedClients.has(newClient) && guard++ < 20) {
      newClient = randoPick(RANDO_CO_PREFIX) + ' ' + randoPick(RANDO_CO_SUFFIX);
    }
    usedClients.add(newClient);
    c.client = newClient;

    // Carrier / adjuster
    if (c.insurance) {
      if (c.insurance.carrier) c.insurance.carrier = randoPick(RANDO_CARRIERS);
      if (c.insurance.adjuster) c.insurance.adjuster = randoPick(ADJUSTER_POOL);
    }

    // Dollar figures — jittered 0.6x-1.4x, keeps realistic relative
    // scale (a $5M exposure case stays roughly a $3-7M case) while
    // no longer showing the exact same numbers every time.
    const jitter = () => 0.6 + Math.random()*0.8;
    const scaleTo1k = v => Math.round(v * jitter() / 1000) * 1000;
    if (c.value) c.value = scaleTo1k(c.value);
    if (c.insurance?.reserveAmount) c.insurance.reserveAmount = scaleTo1k(c.insurance.reserveAmount);
    if (c.exposure) {
      ['demandAmount','offerAmount','reserveAmount','likelyExposure','worstCase','bestCase','settlementAmount'].forEach(k => {
        if (c.exposure[k]) c.exposure[k] = scaleTo1k(c.exposure[k]);
      });
    }
    if (c.closing?.finalIndemnityPaid) c.closing.finalIndemnityPaid = scaleTo1k(c.closing.finalIndemnityPaid);
    if (c.billing) {
      if (c.billing.totalBilled) c.billing.totalBilled = scaleTo1k(c.billing.totalBilled);
      if (c.billing.totalPaid) c.billing.totalPaid = scaleTo1k(c.billing.totalPaid);
    }

    // Dates — shift the WHOLE timeline for this case by one random
    // offset, so filed/deadline/SOL/trial/mediation all move together
    // and stay internally consistent (SOL still after filed, etc.)
    // rather than each field randomizing independently.
    const shiftDays = Math.floor(Math.random()*120) - 60;
    c.filed = randoShiftDateStr(c.filed, shiftDays);
    c.deadline = randoShiftDateStr(c.deadline, shiftDays);
    if (c.keyDates) {
      Object.keys(c.keyDates).forEach(k => {
        if (typeof c.keyDates[k] === 'string') c.keyDates[k] = randoShiftDateStr(c.keyDates[k], shiftDays);
      });
    }
    if (c.court?.filingDate) c.court.filingDate = randoShiftDateStr(c.court.filingDate, shiftDays);
    if (c.closing?.dispositionDate) c.closing.dispositionDate = randoShiftDateStr(c.closing.dispositionDate, shiftDays);

    // Activity log authorship follows the attorney rename so the
    // update history still reads as written by the "same" person.
    if (Array.isArray(c.updates)) {
      c.updates.forEach(u => { if (nameMap[u.author]) u.author = nameMap[u.author]; });
    }
    // Same for task assignees and billing time-entry authorship —
    // both reference attorneys by name, same rename needs to reach them.
    if (Array.isArray(c.tasks)) {
      c.tasks.forEach(t => { if (nameMap[t.assignee]) t.assignee = nameMap[t.assignee]; });
    }
    if (Array.isArray(c.billing?.timeEntries)) {
      c.billing.timeEntries.forEach(te => { if (nameMap[te.atty]) te.atty = nameMap[te.atty]; });
    }
  });

  // Default form/selector values that referenced an old attorney by
  // name need to point at a still-valid one, or dropdowns silently
  // fall back to whichever option happens to render first.
  if (nameMap[S.scoreSel]) S.scoreSel = nameMap[S.scoreSel];
  if (nameMap[S.addForm?.attorney]) S.addForm.attorney = nameMap[S.addForm.attorney];
}

/* ── INITIALIZE ────────────────────────────────────────── */
if (!API_BASE) randomizeDemoData(); // hard gate — never runs against a real connected backend

// One-time check: if this page load came from a "?verifyToken=..."
// email link, confirm it against the backend immediately, whether
// or not the person happens to be logged in right now.
if (API_BASE && S._verifyTokenFromUrl) {
  fetch(API_BASE + '/api/auth/verify-email?token=' + encodeURIComponent(S._verifyTokenFromUrl))
    .then(r => r.json().then(data => ({ ok: r.ok, data })))
    .then(({ ok, data }) => {
      S.verifyEmailResult = { success: ok, message: ok ? (data.message || 'Email verified.') : (data.error || 'Verification failed.') };
      if (ok && S.currentUser) S.currentUser.emailVerified = true;
      render();
    })
    .catch(() => {
      S.verifyEmailResult = { success: false, message: 'Could not reach the server to verify your email.' };
      render();
    });
}
render();

</script>
