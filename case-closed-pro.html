<div id="app"></div>
<script>
/* ============================================================
   CASE CLOSED PRO v2 — Carrier-Grade Litigation Intelligence
   Single-file SaaS prototype. Insurance defense focus.
   ============================================================ */

/* ── CONSTANTS ─────────────────────────────────────────────── */
const SM = {
  Active:{b:'#DBEAFE',t:'#1D4ED8'},
  Discovery:{b:'#FEF3C7',t:'#92400E'},
  Closing:{b:'#D1FAE5',t:'#065F46'},
  Review:{b:'#EDE9FE',t:'#5B21B6'},
  Closed:{b:'#F1F5F9',t:'#64748B'},
  Trial:{b:'#FEE2E2',t:'#991B1B'},
  Mediation:{b:'#E0E7FF',t:'#3730A3'},
  Pleadings:{b:'#FCE7F3',t:'#9D174D'},
  Appeal:{b:'#F3E8FF',t:'#6D28D9'}
};
const PC = {High:'#DC2626', Medium:'#D97706', Low:'#059669'};
const ATTY = ['Sarah Chen','James Ortega','David Park','Maria Santos','Rachel Goldberg'];
const ATTY_COLOR = {'Sarah Chen':'#1F4E8C','James Ortega':'#1A5C2A','David Park':'#5C1A1A','Maria Santos':'#3A1A5C','Rachel Goldberg':'#6B4226'};

/* ── SCORECARD ENGINE (LES — Litigation Effectiveness Score) ──
   Everything below computes real numbers from actual CASES data
   wherever that data exists (matter mix, billing, reserves, task
   completion). Where the app has no real source yet — adjuster
   relationships, mentor pairing, 12-month history, goal targets —
   values are generated by a SEEDED deterministic function, not
   Math.random(): the same attorney always produces the same
   numbers on every render, they just don't come from real records
   yet. That distinction is called out explicitly in the UI rather
   than presented as if everything were equally real. */

// djb2-style string hash → deterministic "random" numbers per (attorney, key)
function seededRand(seedStr, min, max){
  let hash = 5381;
  for (let i = 0; i < seedStr.length; i++) hash = ((hash << 5) + hash + seedStr.charCodeAt(i)) | 0;
  // Avalanche finisher (murmur-style) — without this, seeds that
  // differ by only a trailing digit (e.g. 'x0' vs 'x1' vs 'x2') hash
  // to nearly identical values and collide into the same bucket when
  // floored, which is exactly the kind of near-seed pattern this file
  // uses constantly (attorney+key+index). Confirmed via direct testing
  // that omitting this causes real collisions, not a hypothetical one.
  hash ^= hash >>> 16; hash = Math.imul(hash, 0x85ebca6b);
  hash ^= hash >>> 13; hash = Math.imul(hash, 0xc2b2ae35);
  hash ^= hash >>> 16;
  const normalized = (Math.abs(hash) % 10000) / 10000;
  return min + normalized * (max - min);
}
function seededInt(seedStr, min, max){ return Math.round(seededRand(seedStr, min, max)); }
function seededPick(seedStr, arr){ return arr[Math.floor(seededRand(seedStr, 0, arr.length - 0.001))]; }
// Deterministic Fisher-Yates shuffle, seeded per-attorney — used
// anywhere multiple DISTINCT items need to be picked (e.g. 3
// different preferred adjusters), since independent seededPick calls
// can still collide by chance even with good hash distribution.
function seededShuffle(seedStr, arr){
  const copy = arr.slice();
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(seededRand(seedStr+'_shuf_'+i, 0, i + 0.999));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

const ADJUSTER_POOL = ['Karen Whitfield','Marcus Bell','Priya Nair','Tom Delgado','Rachel Kim','Steve Nowak','Angela Ruiz','Devon Marsh'];

// LES formula — six weighted factors, all documented and visible in
// the UI's methodology note rather than a black box.
const LES_WEIGHTS = { throughput: 0.15, adjusterSat: 0.20, cciAvg: 0.20, reserveAccuracy: 0.15, cycleTime: 0.15, partnerRating: 0.15 };
function lesGrade(score){
  if (score >= 95) return 'A+'; if (score >= 90) return 'A'; if (score >= 85) return 'A-';
  if (score >= 80) return 'B+'; if (score >= 75) return 'B'; if (score >= 70) return 'B-';
  if (score >= 65) return 'C+'; if (score >= 60) return 'C'; return 'D';
}
function lesGradeColor(score){
  return score >= 85 ? 'var(--green)' : score >= 70 ? '#B45309' : 'var(--red)';
}
// Points needed to reach the next grade band up, and that band's name.
function nextMilestone(score){
  const bands = [60,65,70,75,80,85,90,95,100];
  for (const b of bands) if (score < b) return { pointsNeeded: Math.ceil(b - score), nextGrade: lesGrade(b) };
  return { pointsNeeded: 0, nextGrade: lesGrade(score) };
}

function attorneyScorecard(a){
  const aCases = CASES.filter(c => c.attorney === a);
  const aClosed = aCases.filter(c => c.status === 'Closed');
  const aOpen = aCases.filter(c => c.status !== 'Closed');

  // --- Real, data-driven metrics ---
  const taskRate = (() => {
    const all = aCases.flatMap(c => c.tasks||[]);
    return all.length ? Math.round((all.filter(t => t.done).length / all.length) * 100) : seededInt(a+'task',72,92);
  })();
  const cciAvg = aOpen.length ? Math.round(aOpen.reduce((s,c)=>s+cci(c),0)/aOpen.length) : seededInt(a+'cci',45,65);

  // Matter type breakdown — #7, fully real
  const typeCounts = {};
  aCases.forEach(c => { typeCounts[c.type] = (typeCounts[c.type]||0) + 1; });
  const matterMix = Object.entries(typeCounts)
    .map(([type,count]) => ({ type, count, pct: Math.round(count/Math.max(1,aCases.length)*100) }))
    .sort((x,y) => y.count - x.count);

  // Reserve accuracy — #8, real where data exists, seeded fallback otherwise
  const reserveSamples = aClosed
    .filter(c => c.insurance.reserveAmount > 0 && c.closing.finalIndemnityPaid > 0)
    .map(c => 100 - Math.min(100, Math.abs(c.insurance.reserveAmount - c.closing.finalIndemnityPaid) / c.insurance.reserveAmount * 100));
  const reserveAccuracy = reserveSamples.length
    ? Math.round(reserveSamples.reduce((s,v)=>s+v,0)/reserveSamples.length)
    : seededInt(a+'reserve',88,98);

  // Billing metrics — #9, real aggregates
  const totalBilled = aCases.reduce((s,c)=>s+(c.billing.totalBilled||0),0);
  const totalPaid = aCases.reduce((s,c)=>s+(c.billing.totalPaid||0),0);
  const realizationRate = totalBilled > 0 ? Math.round(totalPaid/totalBilled*100) : seededInt(a+'real',88,97);
  const revenuePerMatter = aCases.length ? Math.round(totalBilled/aCases.length) : 0;
  const billingRate = aCases.find(c=>c.billing.hourlyRate)?.billing.hourlyRate || seededInt(a+'rate',375,550);
  const profitMargin = seededInt(a+'margin',58,74); // no cost-basis tracked yet — clearly an estimate, not derived

  // Adjuster relationships — #10, #11: no real adjuster-assignment
  // data exists yet, so this is seeded but stable per attorney.
  // Shuffled (not independently picked) so the 3 names are always
  // distinct, never the same adjuster three times.
  const adjusterSat = Math.round(seededRand(a+'adjsat',3.7,4.9)*10)/10;
  const preferredAdjusters = seededShuffle(a+'adjshuf', ADJUSTER_POOL).slice(0,3).map((name,i) => ({
    name, requests: seededInt(a+'adjreq'+i, 3, 14)
  })).sort((x,y)=>y.requests-x.requests);

  // Case outcome distribution — #2: dispositionType isn't populated
  // in seed data, so this is a stable seeded split scaled to real
  // closed-case count.
  const winPct = seededInt(a+'win',15,35);
  const settlePct = seededInt(a+'settle',50,72);
  const dismissPct = Math.max(0, 100 - winPct - settlePct);

  // Cycle time — days from filed to today (open) or a seeded proxy for closed
  const cycleTimes = aClosed.map(c => seededInt(c.id+'cycle',95,240));
  const avgCycleTime = cycleTimes.length ? Math.round(cycleTimes.reduce((s,v)=>s+v,0)/cycleTimes.length) : seededInt(a+'cycle',140,210);
  const cycleTimeScore = Math.max(0, Math.min(100, Math.round(100 - (avgCycleTime-90)/2))); // faster = higher score

  const partnerRating = RATINGS[a] || 85;

  // --- LES composite (the algorithm) ---
  const les = Math.round(
    taskRate * LES_WEIGHTS.throughput +
    (adjusterSat/5*100) * LES_WEIGHTS.adjusterSat +
    cciAvg * LES_WEIGHTS.cciAvg +
    reserveAccuracy * LES_WEIGHTS.reserveAccuracy +
    cycleTimeScore * LES_WEIGHTS.cycleTime +
    partnerRating * LES_WEIGHTS.partnerRating
  );

  // 12-month trend — #1, seeded random walk converging to the real current LES
  const trend = [];
  let walk = les - seededInt(a+'trendstart',4,14);
  for (let m = 0; m < 12; m++) {
    walk += seededRand(a+'trend'+m, -3, 4);
    trend.push(Math.max(40, Math.min(100, Math.round(walk))));
  }
  trend[11] = les; // always end exactly on today's real computed score

  // Specialization badges — #3, auto-detected from real matter mix + real performance
  const badges = [];
  if (matterMix[0] && matterMix[0].pct >= 40) badges.push({ icon:'🏆', label: matterMix[0].type+' Specialist' });
  if (settlePct >= 65) badges.push({ icon:'🤝', label:'Settlement Specialist' });
  if (reserveAccuracy >= 95) badges.push({ icon:'🎯', label:'Reserve Accuracy Expert' });
  if (les >= 90) badges.push({ icon:'⭐', label:'Elite Performer' });
  if (adjusterSat >= 4.6) badges.push({ icon:'😊', label:'Adjuster Favorite' });

  // Risk indicators — #4, derived from trend direction + real workload + seeded satisfaction
  const risks = [];
  const trendDelta = trend[11] - Math.round(trend.slice(0,3).reduce((s,v)=>s+v,0)/3);
  if (trendDelta <= -6) risks.push({ level:'warn', label:'Performance declining', detail: trendDelta+' LES points over the last quarter' });
  const firmAvgOpen = ATTY.reduce((s,x)=>s+CASES.filter(c=>c.attorney===x && c.status!=='Closed').length,0) / ATTY.length;
  if (aOpen.length > firmAvgOpen * 1.4) risks.push({ level:'warn', label:'Heavy workload', detail: aOpen.length+' active matters vs. '+Math.round(firmAvgOpen)+' firm average' });
  if (adjusterSat < 3.8) risks.push({ level:'bad', label:'Low adjuster satisfaction', detail: adjusterSat+'/5 average rating' });

  // Goals — #5, seeded reasonable targets vs real/computed actuals.
  // "New matters this quarter" is measured against the dataset's OWN
  // most recent filed date, not the real wall clock — the seed data
  // is a fixed snapshot from a past date, so comparing against
  // today's actual date would always show zero regardless of when
  // this demo is viewed. Anchoring to the data's own timeline keeps
  // the metric meaningful indefinitely.
  const latestFiledMs = Math.max(...CASES.map(c => new Date(c.filed).getTime()).filter(t => !isNaN(t)));
  const goals = [
    { label:'LES Target', target: Math.min(100, les + seededInt(a+'gl1',5,12)), actual: les, unit:'' },
    { label:'Settlement Rate', target: 65, actual: settlePct, unit:'%' },
    { label:'Avg. Resolution Time', target: 180, actual: avgCycleTime, unit:' days', lowerIsBetter:true },
    { label:'New Matters (Qtr)', target: seededInt(a+'gl4',6,10), actual: aCases.filter(c=>{ const f=new Date(c.filed).getTime(); return !isNaN(f) && (latestFiledMs-f)/(1000*60*60*24) <= 90; }).length, unit:'' }
  ];

  return {
    name: a, cases: aCases, open: aOpen, closed: aClosed,
    taskRate, cciAvg, adjusterSat, reserveAccuracy, realizationRate, revenuePerMatter, billingRate, profitMargin,
    totalBilled, totalPaid, matterMix, preferredAdjusters, winPct, settlePct, dismissPct,
    avgCycleTime, cycleTimeScore, partnerRating, les, trend, badges, risks, goals
  };
}

// Firm-wide averages — #13's comparison baseline. Computed once from
// every attorney's real scorecard, not a separate synthetic number.
function firmAverages(){
  const all = ATTY.map(a => attorneyScorecard(a));
  const avg = key => Math.round(all.reduce((s,x)=>s+x[key],0)/all.length);
  return { les: avg('les'), settlePct: avg('settlePct'), avgCycleTime: avg('avgCycleTime'), all };
}

// Mentor/mentee pairing — #12. Deterministic: top half of the firm
// by LES mentors the bottom half, paired by rank (highest↔lowest,
// 2nd↔2nd-to-last, ...). Real ranking logic, not random pairing.
function mentorNetwork(){
  const ranked = ATTY.map(a => ({ name:a, les: attorneyScorecard(a).les })).sort((x,y)=>y.les-x.les);
  const n = ranked.length, half = Math.floor(n/2);
  const pairs = {};
  for (let i = 0; i < half; i++) {
    const mentor = ranked[i].name, mentee = ranked[n-1-i].name;
    pairs[mentor] = pairs[mentor] || { mentors:[], mentees:[] };
    pairs[mentee] = pairs[mentee] || { mentors:[], mentees:[] };
    pairs[mentor].mentees.push(mentee);
    pairs[mentee].mentors.push(mentor);
  }
  ranked.forEach(r => { if (!pairs[r.name]) pairs[r.name] = { mentors:[], mentees:[] }; });
  return pairs;
}

const cci = c => {
  /* Proprietary weighted score, 0-100 */
  let score = 50;
  if(c.favorability) score += (c.favorability - 3) * 8;
  if(c.exposure && c.exposure.likelyExposure && c.insurance.reserveAmount) {
    const ratio = c.insurance.reserveAmount / c.exposure.likelyExposure;
    if(ratio >= 1) score += 8;
    else if(ratio >= 0.8) score += 4;
    else score -= 6;
  }
  if(c.status === 'Closed') score += 5;
  if(c.priority === 'High') score -= 5;
  if(c.keyDates && c.keyDates.sol && new Date(c.keyDates.sol) < new Date(Date.now() + 180*864e5)) score -= 8;
  if(c.tasks && c.tasks.filter(t=>!t.done).length > 5) score -= 4;
  if(c.nextStep) score += 3;
  return Math.max(0, Math.min(100, Math.round(score)));
};
const cciColor = s => s >= 70 ? '#047857' : s >= 50 ? '#B45309' : '#B91C1C';

/* ── CLOSING READINESS ──────────────────────────────────────
   What still stands between "settled/resolved" and "file closed
   in the claims system." Used on the dashboard and in the Closing
   tab so nothing gets missed at handoff. */
function closingBlockers(c){
  const cl = c.closing || {};
  const blockers = [];
  const openLiens = (c.liens||[]).filter(l => l.status !== 'Resolved' && l.status !== 'Waived');
  if (openLiens.length > 0) blockers.push(openLiens.length + ' unresolved lien' + (openLiens.length>1?'s':''));
  if (!cl.dispositionType) blockers.push('No disposition recorded');
  if (cl.releaseStatus !== 'Executed' && ['Settlement','Voluntary Dismissal','Arbitration Award'].includes(cl.dispositionType)) blockers.push('Release not executed');
  if (cl.dismissalStatus === 'Not Filed' && cl.dispositionType) blockers.push('Dismissal not filed');
  if (cl.excessCarrierApplicable === 'Yes' && cl.excessCarrierNotified !== 'Notified') blockers.push('Excess carrier not notified');
  if (!cl.finalInvoiceSubmitted) blockers.push('Final invoice not submitted');
  if (cl.payee && cl.dispositionType === 'Settlement' && !cl.payee.w9OnFile) blockers.push('W9 not on file for payee');
  const pendingAuth = (c.authorityRequests||[]).filter(a => a.status === 'Pending');
  if (pendingAuth.length > 0) blockers.push(pendingAuth.length + ' authority request pending');
  return blockers;
}
function closingReadiness(c){
  const blockers = closingBlockers(c);
  if (!c.closing || !c.closing.dispositionType) return {label:'Not Started', color:'var(--muted)', blockers};
  if (blockers.length === 0) return {label:'Ready to Close', color:'var(--green)', blockers};
  return {label:blockers.length+' Blocker'+(blockers.length>1?'s':''), color:'var(--red)', blockers};
}

/* Who does a legal-fee invoice actually get sent to? Never the platform's
   own subscription price (that lives entirely under Plan & Billing) —
   always a real payer on the matter: the carrier's claims adjuster (the
   normal payer in insurance defense work), the client directly, or a
   one-off custom contact (co-counsel, a TPA, etc). */
function billToOptionsFor(c){
  const opts = [];
  if (c.insurance && (c.insurance.carrier || c.insurance.adjuster)) {
    opts.push({
      key:'carrier',
      label:'Carrier / Claims Adjuster'+(c.insurance.carrier?' — '+c.insurance.carrier:''),
      name:(c.insurance.adjuster || c.insurance.carrier || 'Claims Department'),
      org:c.insurance.carrier||'',
      email:c.insurance.adjusterEmail||''
    });
  }
  opts.push({key:'client', label:'Client — '+(c.client||'—'), name:c.client||'', org:c.client||'', email:''});
  opts.push({key:'custom', label:'Custom recipient…', name:'', org:'', email:''});
  return opts;
}
function billToResolve(c, type){
  const opts = billToOptionsFor(c);
  if (type === 'custom') {
    return {type:'custom', name:S.invBillToCustomName||'(unnamed)', org:'', email:S.invBillToCustomEmail||''};
  }
  const found = opts.find(o => o.key === type) || opts[0];
  return {type:found.key, name:found.name, org:found.org, email:found.email};
}

function addDaysStr(dateStr, days){
  const d = new Date(dateStr || '2024-01-01');

/* Every time a report is generated, freeze a snapshot of it — this is

function saveReportSnapshot(rptId){
  const {tmpl, rows, cols} = buildReportData(rptId);
  if (!tmpl) return null;

  const snap = {
    id: 'SR-' + REPORT_SEQ,
    reportId: rptId,

    cat: tmpl.cat,
    icon: tmpl.icon,
    color: tmpl.color,

    generatedDate: td(),
    rowCount: rows.length,
    cols, rows,
    aiSummary: ''
  };
  SAVED_REPORTS.unshift(snap);
  return snap;
}

}

/* ── BACKEND INTEGRATION ───────────────────────────────────
   Set window.CCP_API_BASE before this script runs (e.g. in a
   separate script block above this one, or by editing the line
   below) to point this app at the real server.js instead of
   running in pure in-memory demo mode. Example: add a small
   script block earlier in <head> that sets
     window.CCP_API_BASE = 'https://your-api.onrender.com';
   Leave it unset/empty and the app behaves exactly as the demo
   prototype always has — nothing about existing behavior changes
   unless you opt in. */
const API_BASE = (window.CCP_API_BASE || '').replace(/\/$/, '');
let authToken = null; // held in memory only — see README for the
                       // httpOnly-cookie upgrade path before real launch

async function apiFetch(path, opts = {}) {
  if (!API_BASE) throw new Error('API_BASE not configured');
  const headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
  if (authToken) headers.Authorization = 'Bearer ' + authToken;
  const r = await fetch(API_BASE + path, Object.assign({}, opts, { headers }));
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || ('Request failed: ' + r.status));
  return data;
}

/* ── ERROR REPORTING ────────────────────────────────────────
   A lightweight, self-hosted stand-in for a real error-monitoring
   service (Sentry, etc). Only reports when a real backend is
   connected — there's nowhere useful to send these from pure demo
   mode, and it would just be noise. Best-effort: a failure to REPORT
   an error must never itself throw or interrupt anything. */
function reportClientError(message, stack){
  if (!API_BASE) return;
  try {
    fetch(API_BASE + '/api/errors', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: String(message).slice(0,2000), stack: stack ? String(stack).slice(0,5000) : null, url: window.location.href })
    }).catch(() => {}); // fire-and-forget, genuinely don't care if this fails
  } catch (e) { /* never let error reporting itself throw */ }
}
window.addEventListener('error', (e) => {
  reportClientError(e.message, e.error?.stack);
});
window.addEventListener('unhandledrejection', (e) => {
  reportClientError('Unhandled promise rejection: ' + (e.reason?.message || e.reason), e.reason?.stack);
});

/* Replaces the seeded demo CASES with the signed-in org's real
   matters. Called right after a successful real login. Failure is
   non-fatal — falls back to whatever demo data was already loaded
   rather than leaving the user with a blank app. */
async function loadCasesFromApi() {
  try {
    const { cases } = await apiFetch('/api/cases');
    if (Array.isArray(cases) && cases.length >= 0) {
      CASES.length = 0;
      cases.forEach(c => CASES.push(c));
    }
  } catch (e) {
    console.error('Failed to load cases from API, keeping local data:', e.message);
  }
}

/* Best-effort background sync — the UI updates instantly from the
   local CASES array (unchanged from the prototype's behavior), and
   this fires the same change at the server without blocking or
   re-rendering on the network round trip. If it fails, the change
   still exists locally but a real launch needs a retry/conflict
   story here (see README) before this is fully trustworthy. */
function syncCaseToApi(c) {
  if (!API_BASE || !authToken) return;
  const { id, matterNo, client, type, status, litigationStage, attorney, value, ...rest } = c;
  const { insurance, ...data } = rest;
  apiFetch('/api/cases/' + id, {
    method: 'PATCH',
    body: JSON.stringify({
      matterNo, client, type, status, litigationStage, attorney, value,
      carrier: insurance?.carrier, claimNo: insurance?.claimNo, reserveAmount: insurance?.reserveAmount,
      data
    })
  }).catch(e => console.error('Background sync failed for', id, ':', e.message));
}

/* Deadline notifications: SOL Watch used to be a static list buried on
   one page. This pulls every real deadline already in the data model —
   SOL dates, trial dates, mediation dates, next-step due dates, open
   task due dates — across the whole portfolio into one sorted feed,
   overdue items first, so nothing needs a human to remember to go look
   for it on the right tab. */
function getDeadlineAlerts(){
  const now = Date.now();
  const alerts = [];
  const daysUntil = d => Math.ceil((new Date(d) - now) / 864e5);
  CASES.filter(c => c.status !== 'Closed').forEach(c => {
    const label = c.matterNo || c.id;
    if (c.keyDates.sol) {
      const d = daysUntil(c.keyDates.sol);
      if (d <= 180) alerts.push({caseId:c.id, matterNo:label, client:c.client, kind:'SOL', tab:'dates', date:c.keyDates.sol, days:d, text:'Statute of limitations'});
    }
    if (c.keyDates.trialDate) {
      const d = daysUntil(c.keyDates.trialDate);
      if (d <= 90) alerts.push({caseId:c.id, matterNo:label, client:c.client, kind:'Trial', tab:'dates', date:c.keyDates.trialDate, days:d, text:'Trial date'});
    }
    if (c.keyDates.mediationDate) {
      const d = daysUntil(c.keyDates.mediationDate);
      if (d <= 90) alerts.push({caseId:c.id, matterNo:label, client:c.client, kind:'Mediation', tab:'dates', date:c.keyDates.mediationDate, days:d, text:'Mediation date'});
    }
    if (c.nextStep && c.nextStepDue) {
      const d = daysUntil(c.nextStepDue);
      if (d <= 30) alerts.push({caseId:c.id, matterNo:label, client:c.client, kind:'Next Step', tab:'overview', date:c.nextStepDue, days:d, text:c.nextStep});
    }
    (c.tasks||[]).forEach(t => {
      if (t.done || !t.due) return;
      const d = daysUntil(t.due);
      if (d <= 14) alerts.push({caseId:c.id, matterNo:label, client:c.client, kind:'Task', tab:'tasks', date:t.due, days:d, text:t.title});
    });
  });
  return alerts.sort((a,b) => a.days - b.days);
}

/* Global search: find a matter from anywhere in the app by matter #,
   client, attorney, carrier, or claim #, instead of needing to already
   be on the right tab first. */
function globalSearchMatches(q){
  if (!q || q.trim().length < 1) return [];
  const needle = q.trim().toLowerCase();
  return CASES.filter(c => {
    const hay = [c.matterNo, c.id, c.client, c.attorney, c.type,
      c.insurance && c.insurance.carrier, c.insurance && c.insurance.claimNo]
      .filter(Boolean).join(' ').toLowerCase();
    return hay.includes(needle);
  }).slice(0, 8);
}
function globalSearchBox(){
  const q = S.globalSearchQuery || '';
  const matches = globalSearchMatches(q);
  let h = '<div class="gsearch-wrap">';
  h += '<input class="gsearch-input" type="text" placeholder="Search matter #, client, attorney, carrier…" value="'+escAttr(q)+'" '+
    'oninput="st({globalSearchQuery:this.value})" '+
    'onkeydown="if(event.key===\'Escape\'){st({globalSearchQuery:\'\'});this.blur();} else if(event.key===\'Enter\'){const m=globalSearchMatches(this.value); if(m.length) jumpFromSearch(m[0].id);}"/>';
  if (q.trim().length > 0) {
    h += '<div class="gsearch-dropdown">';
    if (matches.length === 0) {

}

function completeLoginSession(data){
  authToken = data.token;
  S.currentUser = { name: data.user.name, email: data.user.email, persona: data.user.persona, orgId: data.user.orgId, role: data.user.role, totpEnabled: !!data.user.totpEnabled, platformAdmin: !!data.user.platformAdmin, emailVerified: !!data.user.emailVerified };
  S.isAuthenticated = true;
  S.loginLoading = false;
  S.showWelcome = true;
  S.show2FAPrompt = false;
  S._pending2FAToken = '';
  S.role = data.user.persona === 'defense' ? 'attorney' : 'tpa';
  window._loginEmail = ''; window._loginPassword = ''; window._2faCode = '';
}

async function attemptLogin(){
  const email = (window._loginEmail || '').trim();
  const password = window._loginPassword || '';
  const persona = window._loginPersona || 'carrier';
  if (!email || !email.includes('@')) { st({loginError:'Enter a valid email address.'}); return; }
  if (!password) { st({loginError:'Enter a password.'}); return; }
  st({loginError:'', loginLoading:true});

  if (API_BASE) {
    // Real backend path — actual credential verification against server.js.
    try {
      const data = await apiFetch('/api/auth/login', { method:'POST', body: JSON.stringify({ email, password }) });
      if (data.twoFactorRequired) {
        // Password was correct, but the account has 2FA on — one more step.
        st({loginLoading:false, show2FAPrompt:true, _pending2FAToken:data.pendingToken, loginError:''});
        return;
      }
      completeLoginSession(data);
      await loadCasesFromApi();
      render();
    } catch (e) {
      st({loginError: e.message, loginLoading:false});
    }
    return;
  }

  // Demo-mode path — no backend configured, accepts any well-formed credentials.
  setTimeout(() => {
    const namePart = email.split('@')[0].replace(/[._]+/g,' ').trim();
    const name = namePart.replace(/\b\w/g, ch => ch.toUpperCase()) || 'Demo User';
    S.currentUser = { name, email, persona };
    S.isAuthenticated = true;
    S.loginLoading = false;
    S.showWelcome = true;
    S.role = persona === 'defense' ? 'attorney' : 'tpa';
    window._loginEmail = ''; window._loginPassword = '';
    render();
  }, 450);
}

async function attempt2FALogin(){
  const code = (window._2faCode || '').trim();
  if (!code) { st({loginError:'Enter the 6-digit code from your authenticator app.'}); return; }
  st({loginError:'', loginLoading:true});
  try {
    const data = await apiFetch('/api/auth/2fa/login-verify', {
      method:'POST', body: JSON.stringify({ pendingToken: S._pending2FAToken, code })
    });
    completeLoginSession(data);
    await loadCasesFromApi();
    render();
  } catch (e) {
    st({loginError: e.message, loginLoading:false});
  }
}

async function attemptRegister(){
  const email = (window._loginEmail || '').trim();
  const password = window._loginPassword || '';
  const persona = window._loginPersona || 'carrier';
  const orgName = (window._regOrgName || '').trim();
  const name = (window._regName || '').trim();
  if (!orgName) { st({loginError:'Enter an organization name.'}); return; }
  if (!email || !email.includes('@')) { st({loginError:'Enter a valid email address.'}); return; }

  st({loginError:'', loginLoading:true});
  try {
    const data = await apiFetch('/api/auth/register', { method:'POST', body: JSON.stringify({ email, password, name, orgName, persona }) });
    completeLoginSession(data);
    await loadCasesFromApi();
    render();
  } catch (e) {
    st({loginError: e.message, loginLoading:false});
  }
}

    h += '<button class="btn btn-out" style="padding:12px 22px;" onclick="st({showWelcome:false,role:\'litigation\'})">Skip — Show Me the Dashboard</button>';
    h += '</div>';
  } else {
    h += '<p style="font-size:13.5px;color:var(--muted);line-height:1.7;max-width:460px;margin:0 auto 26px;">Matters your carrier clients assign you will appear in My Cases automatically. Nothing to import — no cost to your firm, ever.</p>';
    h += '<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">';
    h += '<button class="btn btn-pri" style="padding:12px 22px;" onclick="st({showWelcome:false,role:\'attorney\'})">Go to My Cases</button>';
    h += '</div>';
  }
  h += '</div></div>';
  return h;
}

/* ── LITIGATION DASHBOARD (Carrier-grade) ──── */
function litigationDashV(){
  const open = CASES.filter(c => c.status !== 'Closed');
  const closed = CASES.filter(c => c.status === 'Closed');
  const totRes = CASES.reduce((s,c) => s + (c.insurance.reserveAmount||0), 0);
  const totBl = CASES.reduce((s,c) => s + (c.billing.totalBilled||0), 0);
  const totPd = CASES.reduce((s,c) => s + (c.billing.totalPaid||0), 0);

  /* Top opposing law firms (open cases) */
  const lawFirmCounts = {};
  open.forEach(c => {
    const f = c.opposing.counselFirm || 'Unassigned';
    lawFirmCounts[f] = (lawFirmCounts[f] || 0) + 1;
  });
  const topLawFirms = Object.entries(lawFirmCounts).sort((a,b) => b[1]-a[1]).slice(0,8);
  const lawFirmTotal = topLawFirms.reduce((s,[,n]) => s+n, 0);

  /* Top plaintiff firms by avg settlement */
  const plaintiffStats = {};
  CASES.forEach(c => {
    const f = c.opposing.counselFirm;
    if (!f) return;
    if (!plaintiffStats[f]) plaintiffStats[f] = {firm:f, total:0, count:0};
    const settle = c.settlements && c.settlements.length ? c.settlements[0].offer : 0;
    if (settle > 0) {
      plaintiffStats[f].total += settle;
      plaintiffStats[f].count++;
    }
  });
  const topPlaintiff = Object.values(plaintiffStats).filter(p => p.count > 0)
    .map(p => ({...p, avg: Math.round(p.total/p.count)}))
    .sort((a,b) => b.avg-a.avg).slice(0,5);
  const maxAvg = topPlaintiff.length ? Math.max(...topPlaintiff.map(p=>p.avg)) : 1;

  /* Upcoming mediation & trial */
  const next90 = new Date(Date.now() + 90*864e5);
  const upcomingMed = CASES.filter(c => c.keyDates.mediationDate && new Date(c.keyDates.mediationDate) <= next90 && new Date(c.keyDates.mediationDate) >= new Date()).length;
  const upcomingTrial = CASES.filter(c => c.keyDates.trialDate && new Date(c.keyDates.trialDate) <= next90 && new Date(c.keyDates.trialDate) >= new Date()).length;

  /* Closed case data */
  const closedFees = closed.length ? Math.round(closed.reduce((s,c) => s + (c.billing.totalBilled||0), 0) / closed.length) : 0;
  const closedSettle = closed.length ? Math.round(closed.reduce((s,c) => s + (c.exposure.settlementAmount||0), 0) / closed.length) : 0;
  const closedDur = closed.length ? Math.round(closed.reduce((s,c) => s + daysOpen(c), 0) / closed.length) : 0;

  /* Settlement standouts: aggregate counts */
  const allSettlements = CASES.flatMap(c => c.settlements || []);
  const totalDemands = allSettlements.length;
  const totalOffers = allSettlements.filter(s => s.offer > 0).length;

  /* Total Litigation by month - synthetic 6mo */
  const months = ['Nov','Dec','Jan','Feb','Mar','Apr'];
  const totalSeries = [9, 11, 13, 15, 14, 12];
  const aobSeries = [1, 2, 3, 2, 4, 3];
  const maxLine = Math.max(...totalSeries) + 2;

  /* Case counts by stage */
  const stageCounts = {};
  LIT_STAGES.forEach(s => { stageCounts[s] = 0; });
  CASES.forEach(c => { 
    const s = c.litigationStage || 'Pre-Suit';
    stageCounts[s] = (stageCounts[s] || 0) + 1;
  });

  /* CCI distribution */
  const indexes = open.map(c => cci(c));
  const avgIdx = indexes.length ? Math.round(indexes.reduce((s,n)=>s+n,0) / indexes.length) : 0;

  /* Risk flags for the dashboard */
  const reserveRisk = open.filter(c => c.exposure.likelyExposure && (c.insurance.reserveAmount/c.exposure.likelyExposure) < 0.7).length;
  const solRisk = open.filter(c => c.keyDates.sol && new Date(c.keyDates.sol) < new Date(Date.now() + 180*864e5)).length;
  const noNextStep = open.filter(c => !c.nextStep).length;

  h += '<div>';
  h += '<div class="serif" style="font-size:26px;font-weight:700;color:var(--ink);letter-spacing:-.6px;line-height:1.1;">Litigation Dashboard</div>';
  h += '<div class="subhead">Portfolio across '+CASES.length+' matters · '+open.length+' active · '+fM(totRes)+' in reserves · CCI avg '+avgIdx+'</div>';
  h += '</div>';
  h += '<div style="display:flex;gap:8px;">';
  h += '<select onchange="st({fAt:this.value})" class="inp" style="width:auto;min-width:130px;">'+['All',...ATTY].map(a=>'<option'+(S.fAt===a?' selected':'')+'>'+a+'</option>').join('')+'</select>';
  h += '<select onchange="st({fCarrier:this.value})" class="inp" style="width:auto;min-width:130px;">'+['All',...CARRIERS.slice(0,8)].map(c=>'<option'+(S.fCarrier===c?' selected':'')+'>'+c+'</option>').join('')+'</select>';
  h += '</div>';

  /* Hero KPI strip */

    const x1 = 70 + r1*Math.cos(a1), y1 = 70 + r1*Math.sin(a1);

    donutPaths += '<path d="M '+x1+' '+y1+' A '+r1+' '+r1+' 0 '+large+' 1 '+x2+' '+y2+' L '+x3+' '+y3+' A '+r2+' '+r2+' 0 '+large+' 0 '+x4+' '+y4+' Z" fill="'+donutColors[i%donutColors.length]+'"/>';

       '<text x="70" y="68" text-anchor="middle" font-size="22" font-weight="700" fill="var(--ink)" font-family="Fraunces">'+lawFirmTotal+'</text>'+

  h += '<div style="flex:1;min-width:0;">';
  topLawFirms.forEach(([f,n], i) => {

  /* Upcoming Mediation & Trials big numbers */

  h += '<div style="text-align:center;padding:18px 12px;background:#EDE9FE;border-radius:9px;"><div class="serif" style="font-size:42px;font-weight:700;color:#5B21B6;line-height:1;">'+upcomingMed+'</div><div style="font-size:10px;color:#5B21B6;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;margin-top:6px;">Set for Mediation</div></div>';

    h += '<div style="color:var(--dim);font-size:12px;padding:14px;text-align:center;">No settlement data yet.</div>';
  } else {
    topPlaintiff.forEach((p, i) => {
      const w = (p.avg / maxAvg) * 100;
      h += '<div style="margin-bottom:11px;">';

      h += '<span style="font-size:11.5px;color:var(--ink);font-weight:600;">'+esc(p.firm)+'</span>';
      h += '<span style="font-size:11.5px;color:var(--pri2);font-weight:700;font-family:var(--serif);">'+fM(p.avg)+'</span>';
      h += '</div>';
      h += '<div style="background:var(--surf3);border-radius:4px;height:9px;overflow:hidden;"><div style="width:'+w+'%;height:100%;background:linear-gradient(90deg,var(--pri),var(--pri2));border-radius:4px;"></div></div>';

  h += '</div>';
  h += '</div>';

  /* Row 2: Total Litigation chart | Closed Case Data | Settlement Standouts */
  h += '<div style="display:grid;grid-template-columns:1.4fr 1.1fr 1fr;gap:14px;margin-bottom:14px;order:7;">';

  /* Total Litigation chart */
  h += '<div class="card">';
  h += '<div class="sh"><span>Total Litigation Volume</span><span style="color:var(--dim);font-weight:500;">Last 6 months · AOB vs Total</span></div>';

  for (let g = 0; g < 5; g++) {
    h += '<line x1="40" y1="'+(20 + g*30)+'" x2="395" y2="'+(20 + g*30)+'" stroke="var(--surf3)" stroke-width="1"/>';
    h += '<text x="35" y="'+(24 + g*30)+'" text-anchor="end" font-size="9" fill="var(--dim)">'+(maxLine - g*Math.ceil(maxLine/4))+'</text>';

  flags.forEach(f => {
    h += '<div style="display:flex;align-items:center;justify-content:space-between;padding:9px 10px;border-bottom:1px solid var(--surf3);">';
    h += '<div style="display:flex;align-items:center;gap:9px;"><span style="display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:'+f.c+';color:#fff;font-size:11px;font-weight:700;">'+f.icon+'</span>';
    h += '<span style="font-size:11.5px;color:var(--ink);">'+f.l+'</span></div>';
    h += '<span class="serif" style="font-size:18px;font-weight:700;color:'+f.c+';">'+f.v+'</span>';
    h += '</div>';
  });
  h += '</div>';

  /* Stage pipeline */
  h += '<div class="card">';
  h += '<div class="sh"><span>Litigation Pipeline by Stage</span></div>';
  Object.entries(stageCounts).filter(([,n])=>n>0).forEach(([s,n]) => {
    const pct = (n / CASES.length) * 100;
    h += '<div class="bar-row"><span style="font-size:11px;color:var(--ink);min-width:120px;font-weight:500;">'+s+'</span>';
    h += '<div class="bar-bg"><div class="bar-fill" style="width:'+pct+'%;background:linear-gradient(90deg,var(--pri),var(--pri2));"></div></div>';
    h += '<span style="font-size:11px;color:var(--muted);font-weight:600;min-width:18px;text-align:right;">'+n+'</span></div>';
  });
  h += '</div>';

  /* CCI Distribution */
  h += '<div class="card">';
  h += '<div class="sh"><span>CCI Distribution</span></div>';
  const buckets = [
    {l:'Strong (70+)', n:indexes.filter(x=>x>=70).length, c:'#047857'},
    {l:'Even (50-69)', n:indexes.filter(x=>x>=50 && x<70).length, c:'#B45309'},
    {l:'Adverse (<50)', n:indexes.filter(x=>x<50).length, c:'#B91C1C'}
  ];
  const totalIdx = buckets.reduce((s,b)=>s+b.n,0) || 1;
  h += '<div style="text-align:center;padding:10px 0;"><div class="serif" style="font-size:36px;font-weight:700;color:'+cciColor(avgIdx)+';line-height:1;">'+avgIdx+'</div>';
  h += '<div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1.3px;font-weight:700;margin-top:4px;">Avg · '+cciLabel(avgIdx)+'</div></div>';
  h += '<div style="display:flex;height:10px;border-radius:5px;overflow:hidden;margin-bottom:10px;">';
  buckets.forEach(b => {
    h += '<div style="width:'+(b.n/totalIdx*100)+'%;background:'+b.c+';" title="'+b.l+'"></div>';
  });
  h += '</div>';
  buckets.forEach(b => {
    h += '<div style="display:flex;align-items:center;gap:7px;padding:3px 0;font-size:11px;"><div style="width:9px;height:9px;border-radius:2px;background:'+b.c+';"></div>';
    h += '<span style="flex:1;color:var(--ink);">'+b.l+'</span><span style="color:var(--muted);font-weight:600;">'+b.n+'</span></div>';
  });
  h += '</div>';
  h += '</div>';

  /* Open Matters Table */
  h += '<div class="card" style="order:8;">';
  h += '<div class="sh"><span>All Open Matters — '+open.length+' active</span><span style="display:flex;gap:8px;"><span class="muted-link" onclick="st({role:\'reports\'})">Generate Report →</span></span></div>';
  h += '<div style="overflow-x:auto;"><table>';
  h += '<thead><tr><th>Matter #</th><th>Client</th><th>Type</th><th>Carrier</th><th>Stage</th><th>Track</th><th>Fav</th><th>CCI</th><th>Reserve</th><th>Exposure</th><th>SOL</th><th>Atty</th></tr></thead><tbody>';
  open.forEach(c => {
    const idx = cci(c);
    h += '<tr class="row-link" onclick="stCase(\''+c.id+'\')">';
    h += '<td style="color:var(--pri2);font-weight:700;">'+esc(c.matterNo || c.id)+'</td>';
    h += '<td style="font-weight:600;">'+esc(c.client)+'</td>';
    h += '<td style="font-size:11px;color:var(--muted);">'+esc(c.type)+'</td>';
    h += '<td style="font-size:11px;color:var(--gold);">'+esc(c.insurance.carrier||'—')+'</td>';
    h += '<td style="font-size:11px;">'+esc(c.litigationStage||'—')+'</td>';
    h += '<td style="font-size:11px;color:var(--muted);">'+esc(c.strategicTrack||'—')+'</td>';
    h += '<td>'+fav(c.favorability||3)+'</td>';
    h += '<td><span class="cci-pill" style="background:'+cciColor(idx)+'22;color:'+cciColor(idx)+';">'+idx+'</span></td>';
    h += '<td style="color:var(--gold);">'+fM(c.insurance.reserveAmount||0)+'</td>';
    h += '<td style="color:var(--red);">'+fV(c.exposure.likelyExposure||c.value)+'</td>';
    const solCol = c.keyDates.sol && new Date(c.keyDates.sol) < new Date(Date.now()+180*864e5) ? 'var(--red)' : 'var(--muted)';
    h += '<td style="font-size:10px;color:'+solCol+';">'+(c.keyDates.sol||'—')+'</td>';
    h += '<td style="font-size:11px;">'+esc(c.attorney)+'</td>';
    h += '</tr>';
  });
  h += '</tbody></table></div>';
  h += '</div>';

  h += '</div>';
  return h;
}

/* ── ATTORNEY / MY CASES VIEW ────────────────────────────── */
function attyV(){
  const myCases = S.filterAtty === 'all' ? CASES : CASES.filter(c => c.attorney === S.filterAtty);

  let h = '<div class="wrap">';
  h += '<div class="hero">';
  h += '<div class="hero-l"><div class="hero-eyebrow">My Cases</div>';
  h += '<h1 class="hero-title">'+(S.filterAtty==='all'?'Firm Caseload':S.filterAtty)+'</h1>';
  h += '<p class="hero-sub">'+open.length+' active matters · '+fM(totVal)+' aggregate value · '+fM(totRes)+' total reserves</p></div></div>';

  h += '<div class="kpi-grid">';
  h += '<div class="kpi"><div class="kpi-l">Open Matters</div><div class="kpi-v">'+open.length+'</div></div>';
  h += '<div class="kpi"><div class="kpi-l">Total Value</div><div class="kpi-v">'+fV(totVal)+'</div></div>';
  h += '<div class="kpi"><div class="kpi-l">Carrier Reserves</div><div class="kpi-v" style="color:var(--gold);">'+fV(totRes)+'</div></div>';
  h += '<div class="kpi"><div class="kpi-l">Upcoming Events</div><div class="kpi-v">'+upcoming+'</div></div>';
  h += '</div>';

  /* Filters */
  h += '<div class="card" style="padding:11px 14px;margin-bottom:14px;">';
  h += '<div style="display:flex;flex-wrap:wrap;gap:14px;align-items:center;">';
  h += '<div style="display:flex;gap:6px;align-items:center;"><span style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1.2px;font-weight:700;">Attorney:</span>';
  h += '<button class="pill '+(S.filterAtty==='all'?'on':'')+'" onclick="st({filterAtty:\'all\'})">All</button>';
  ATTY.forEach(a => {
    h += '<button class="pill '+(S.filterAtty===a?'on':'')+'" onclick="st({filterAtty:\''+a+'\'})">'+a.split(' ')[0]+'</button>';
  });
  h += '</div>';
  h += '<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;"><span style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1.2px;font-weight:700;">Stage:</span>';
  h += '<button class="pill '+(S.filterStat==='all'?'on':'')+'" onclick="st({filterStat:\'all\'})">All</button>';
  STATS.forEach(st => {
    const ct = myCases.filter(c => c.status === st).length;
    if (ct > 0) h += '<button class="pill '+(S.filterStat===st?'on':'')+'" onclick="st({filterStat:\''+st+'\'})">'+st+' ('+ct+')</button>';
  });
  h += '</div></div></div>';

  h += '<div class="case-grid">';
  filtered.forEach(c => h += caseCard(c));
  h += '</div>';
  h += '</div>';
  return h;

function caseCard(c){
  const idx = cci(c);

  let h = '<div class="case-card" onclick="stCase(\''+c.id+'\')">';
  h += '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px;">';
  h += '<div style="flex:1;min-width:0;">';
  h += '<div style="display:flex;align-items:center;gap:7px;margin-bottom:4px;flex-wrap:wrap;">';
  h += '<span style="font-size:10px;color:var(--pri2);font-weight:700;letter-spacing:1px;">'+esc(c.matterNo||c.id)+'</span>';
  h += pill(c.status);
  if (c.aob === 'Yes') h += '<span class="tag tag-warn">AOB</span>';
  if (c.catastrophe === 'Yes') h += '<span class="tag tag-danger">CAT</span>';
  if (c.potentialTrialCandidate) h += '<span class="tag tag-info">Trial Candidate</span>';
  if (c.closing && c.closing.dispositionType && c.status !== 'Closed') {
    const readiness = closingReadiness(c);
    h += '<span class="tag" style="background:'+readiness.color+'18;color:'+readiness.color+';font-weight:700;">'+readiness.label+'</span>';
  }
  h += '</div>';
  h += '<div class="serif" style="font-size:17px;font-weight:700;color:var(--ink);line-height:1.2;letter-spacing:-.3px;">'+esc(c.client)+'</div>';
  h += '<div style="font-size:11.5px;color:var(--muted);margin-top:3px;">'+esc(c.type)+' · '+esc(c.attorney)+'</div>';
  h += '</div>';
  h += '<span class="cci-pill" style="background:'+cciColor(idx)+'22;color:'+cciColor(idx)+';flex-shrink:0;">CCI '+idx+'</span>';
  h += '</div>';

  h += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0;padding:10px;background:var(--surf);border-radius:6px;">';
  h += '<div><div style="font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;font-weight:700;">Carrier</div><div style="font-size:12px;color:var(--gold);font-weight:600;">'+esc(c.insurance.carrier||'—')+'</div></div>';
  h += '<div><div style="font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;font-weight:700;">Reserve</div><div style="font-size:12px;color:var(--ink);font-weight:600;">'+fV(c.insurance.reserveAmount)+'</div></div>';
  h += '<div><div style="font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;font-weight:700;">Stage</div><div style="font-size:12px;color:var(--ink);font-weight:500;">'+esc(c.litigationStage||'—')+'</div></div>';
  h += '<div><div style="font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;font-weight:700;">Favorability</div>'+fav(c.favorability||3)+'</div>';
  h += '</div>';

  h += '<div style="display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted);">';
  h += '<span>'+days+' days open</span>';
  h += '<span>'+esc(c.strategicTrack||'—')+'</span>';
  h += '</div>';

  /* Progress bar */
  h += '<div style="margin-top:10px;background:var(--surf3);height:5px;border-radius:3px;overflow:hidden;">';
  h += '<div style="width:'+c.progress+'%;height:100%;background:linear-gradient(90deg,var(--pri),var(--pri2));"></div></div>';
  h += '</div>';
  return h;
}

/* ── TPA / CARRIER VIEW ────────────────────────────────── */
function tpaV(){
  const carriers = {};
  CASES.forEach(c => {
    const ca = c.insurance.carrier || 'Self-Insured';
    if (!carriers[ca]) carriers[ca] = {cases:[], reserve:0, billed:0, paid:0};
    carriers[ca].cases.push(c);
    carriers[ca].reserve += c.insurance.reserveAmount || 0;
    carriers[ca].billed += c.billing.totalBilled || 0;
    carriers[ca].paid += c.billing.totalPaid || 0;
  });
  const carrierList = Object.entries(carriers).sort((a,b) => b[1].reserve - a[1].reserve);
  const totalCases = CASES.length;
  const totalReserves = Object.values(carriers).reduce((s,c) => s + c.reserve, 0);

  let h = '<div class="wrap">';
  h += '<div class="hero">';
  h += '<div class="hero-l"><div class="hero-eyebrow">Carrier / TPA Portfolio</div>';
  h += '<h1 class="hero-title">Carrier Oversight</h1>';
  h += '<p class="hero-sub">'+carrierList.length+' carriers · '+totalCases+' matters · '+fM(totalReserves)+' aggregate reserves</p></div></div>';

  h += '<div class="kpi-grid">';
  h += '<div class="kpi"><div class="kpi-l">Carriers</div><div class="kpi-v">'+carrierList.length+'</div></div>';
  h += '<div class="kpi"><div class="kpi-l">Total Reserves</div><div class="kpi-v" style="color:var(--gold);">'+fV(totalReserves)+'</div></div>';
  h += '<div class="kpi"><div class="kpi-l">Billed YTD</div><div class="kpi-v">'+fV(Object.values(carriers).reduce((s,c)=>s+c.billed,0))+'</div></div>';
  h += '<div class="kpi"><div class="kpi-l">AOB Matters</div><div class="kpi-v" style="color:var(--red);">'+CASES.filter(c=>c.aob==='Yes').length+'</div></div>';
  h += '</div>';

  /* Reserve Adequacy Table */
  h += '<div class="card">';
  h += '<div class="sh"><span>Carrier Portfolio — Reserve Adequacy</span></div>';
  h += '<div style="overflow-x:auto;"><table>';
  h += '<thead><tr><th>Carrier</th><th>Matters</th><th>Total Reserves</th><th>Billed</th><th>Paid</th><th>Burn %</th><th>Avg CCI</th><th>Risk</th></tr></thead><tbody>';
  carrierList.forEach(([name, data]) => {
    const burn = data.reserve ? Math.round((data.billed/data.reserve)*100) : 0;
    const avgIdx = Math.round(data.cases.reduce((s,c)=>s+cci(c),0)/data.cases.length);
    const burnCol = burn > 70 ? 'var(--red)' : burn > 50 ? 'var(--gold)' : 'var(--green)';
    const risk = burn > 70 || avgIdx < 50 ? '⚠ Review' : burn > 50 ? '◐ Monitor' : '✓ Healthy';
    const riskCol = risk.includes('Review') ? 'var(--red)' : risk.includes('Monitor') ? 'var(--gold)' : 'var(--green)';
    h += '<tr>';
    h += '<td style="font-weight:700;color:var(--gold);">'+esc(name)+'</td>';
    h += '<td style="font-weight:600;">'+data.cases.length+'</td>';
    h += '<td>'+fV(data.reserve)+'</td>';
    h += '<td>'+fV(data.billed)+'</td>';
    h += '<td>'+fV(data.paid)+'</td>';
    h += '<td style="color:'+burnCol+';font-weight:700;">'+burn+'%</td>';
    h += '<td><span class="cci-pill" style="background:'+cciColor(avgIdx)+'22;color:'+cciColor(avgIdx)+';">'+avgIdx+'</span></td>';
    h += '<td style="color:'+riskCol+';font-weight:600;font-size:11px;">'+risk+'</td>';
    h += '</tr>';
  });
  h += '</tbody></table></div></div>';

  /* SOL Tracker */
  h += '<div class="card">';
  h += '<div class="sh"><span>SOL Watch — Statute of Limitations Alerts</span></div>';
  const solCases = CASES.filter(c => c.keyDates.sol).sort((a,b) => new Date(a.keyDates.sol) - new Date(b.keyDates.sol));
  if (solCases.length === 0) {
    h += '<div style="padding:18px;color:var(--muted);font-size:12px;text-align:center;">No SOL dates tracked yet.</div>';
  } else {
    h += '<div style="overflow-x:auto;"><table>';
    h += '<thead><tr><th>Matter</th><th>Client</th><th>Carrier</th><th>SOL Date</th><th>Days</th><th>Status</th></tr></thead><tbody>';
    solCases.slice(0,15).forEach(c => {
      const days = Math.ceil((new Date(c.keyDates.sol) - Date.now())/864e5);
      const col = days < 90 ? 'var(--red)' : days < 180 ? 'var(--gold)' : 'var(--muted)';
      h += '<tr class="row-link" onclick="stCase(\''+c.id+'\')">';
      h += '<td style="font-weight:700;color:var(--pri2);">'+esc(c.matterNo||c.id)+'</td>';
      h += '<td>'+esc(c.client)+'</td>';
      h += '<td style="color:var(--gold);">'+esc(c.insurance.carrier||'—')+'</td>';
      h += '<td>'+esc(c.keyDates.sol)+'</td>';
      h += '<td style="color:'+col+';font-weight:700;">'+(days>0?days+'d':'EXPIRED')+'</td>';
      h += '<td><span class="pill">'+esc(c.keyDates.solStatus||'Active')+'</span></td>';
      h += '</tr>';
    });
    h += '</tbody></table></div>';
  }
  h += '</div>';

  /* Adjuster Dashboard */
  h += '<div class="card">';
  h += '<div class="sh"><span>Adjuster Activity — Recent Updates</span></div>';
  const recentUpdates = [];
  CASES.forEach(c => {
    (c.updates||[]).slice(-2).forEach(u => recentUpdates.push({...u, case:c}));
  });
  recentUpdates.sort((a,b) => new Date(b.date) - new Date(a.date)).slice(0,8).forEach(u => {
    h += '<div class="activity-item" onclick="stCase(\''+u.case.id+'\')">';
    h += '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:4px;">';
    h += '<div><span style="color:var(--pri2);font-weight:700;font-size:11px;">'+esc(u.case.matterNo||u.case.id)+'</span> · <span style="font-weight:600;font-size:12px;">'+esc(u.case.client)+'</span></div>';
    h += '<span style="font-size:10px;color:var(--dim);">'+esc(u.date)+'</span></div>';
    h += '<div style="font-size:11px;color:var(--muted);"><strong style="color:var(--ink);">'+esc(u.type)+':</strong> '+esc(u.text)+'</div>';
    h += '</div>';
  });
  h += '</div>';

  h += '</div>';
  return h;
}

/* ── PARTNER VIEW ──────────────────────────────────────── */
function partV(){
  const open = CASES.filter(c => c.status !== 'Closed');
  const totRev = CASES.reduce((s,c) => s + (c.billing.totalBilled||0), 0);
  const totColl = CASES.reduce((s,c) => s + (c.billing.totalPaid||0), 0);
  const collDisplay = fCollRate(totColl, totRev);

  let h = '<div class="wrap">';
  h += '<div class="hero">';
  h += '<div class="hero-l"><div class="hero-eyebrow">Partner View · Firm Operations</div>';
  h += '<h1 class="hero-title">Practice Performance</h1>';
  h += '<p class="hero-sub">'+open.length+' active matters · '+fM(totRev)+' billed · '+collDisplay.text+' collected</p></div></div>';

  h += '<div class="kpi-grid">';
  h += '<div class="kpi"><div class="kpi-l">Active Matters</div><div class="kpi-v">'+open.length+'</div></div>';
  h += '<div class="kpi"><div class="kpi-l">Revenue YTD</div><div class="kpi-v" style="color:var(--green);">'+fV(totRev)+'</div></div>';
  h += '<div class="kpi"><div class="kpi-l">Collected</div><div class="kpi-v">'+fV(totColl)+'</div></div>';
  h += '<div class="kpi"><div class="kpi-l">Collection Rate</div><div class="kpi-v">'+collDisplay.text+'</div></div>';
  h += '</div>';

  /* Attorney performance */
  h += '<div class="card">';
  h += '<div class="sh"><span>Attorney Performance</span></div>';
  h += '<div style="overflow-x:auto;"><table>';
  h += '<thead><tr><th>Attorney</th><th>Active</th><th>Closed</th><th>Win Rate</th><th>Billed</th><th>Avg CCI</th><th>Workload</th></tr></thead><tbody>';
  ATTY.forEach(a => {
    const aCases = CASES.filter(c => c.attorney === a);
    const aOpen = aCases.filter(c => c.status !== 'Closed');
    const aClosed = aCases.filter(c => c.status === 'Closed');
    const aBilled = aCases.reduce((s,c) => s + (c.billing.totalBilled||0), 0);
    const aIdx = aOpen.length ? Math.round(aOpen.reduce((s,c)=>s+cci(c),0)/aOpen.length) : 50;
    const wins = aClosed.filter(c => (c.exposure.settlementAmount || 0) < (c.exposure.demandAmount || c.value));
    const winRate = aClosed.length ? Math.round((wins.length/aClosed.length)*100) : 0;
    const wlPct = Math.min(100, aOpen.length * 12);
    h += '<tr>';
    h += '<td style="font-weight:700;color:'+(ATTY_COLOR[a]||'var(--ink)')+';">'+esc(a)+'</td>';
    h += '<td>'+aOpen.length+'</td>';
    h += '<td>'+aClosed.length+'</td>';
    h += '<td style="color:'+(aClosed.length?'var(--green)':'var(--dim)')+';font-weight:600;">'+(aClosed.length?winRate+'%':'—')+'</td>';
    h += '<td>'+fV(aBilled)+'</td>';
    h += '<td><span class="cci-pill" style="background:'+cciColor(aIdx)+'22;color:'+cciColor(aIdx)+';">'+aIdx+'</span></td>';
    h += '<td><div style="background:var(--surf3);height:6px;border-radius:3px;overflow:hidden;width:80px;"><div style="width:'+wlPct+'%;height:100%;background:'+(wlPct>80?'var(--red)':wlPct>60?'var(--gold)':'var(--green)')+';"></div></div></td>';
    h += '</tr>';
  });
  h += '</tbody></table></div></div>';

  /* Practice mix */
  h += '<div class="grid-2">';
  h += '<div class="card"><div class="sh"><span>Practice Area Mix</span></div>';
  const practiceMix = {};
  CASES.forEach(c => practiceMix[c.type] = (practiceMix[c.type]||0) + 1);
  Object.entries(practiceMix).sort((a,b)=>b[1]-a[1]).slice(0,8).forEach(([t,n]) => {
    h += '<div class="bar-row"><span style="font-size:11px;color:var(--ink);min-width:130px;font-weight:500;">'+esc(t)+'</span>';
    h += '<div class="bar-bg"><div class="bar-fill" style="width:'+(n/CASES.length*100)+'%;background:linear-gradient(90deg,var(--pri),var(--pri2));"></div></div>';
    h += '<span style="font-size:11px;color:var(--muted);font-weight:600;min-width:18px;text-align:right;">'+n+'</span></div>';
  });
  h += '</div>';

  h += '<div class="card"><div class="sh"><span>Status Distribution</span></div>';
  STATS.forEach(s => {
    const n = CASES.filter(c => c.status === s).length;
    if (n > 0) {
      h += '<div class="bar-row"><span style="font-size:11px;color:var(--ink);min-width:90px;font-weight:500;">'+esc(s)+'</span>';
      h += '<div class="bar-bg"><div class="bar-fill" style="width:'+(n/CASES.length*100)+'%;background:'+SM[s]+';"></div></div>';
      h += '<span style="font-size:11px;color:var(--muted);font-weight:600;min-width:18px;text-align:right;">'+n+'</span></div>';
    }
  });
  h += '</div>';
  h += '</div>';

  h += '</div>';
  return h;
}

/* ── 1. FIRM AT A GLANCE ──────────────────────────────────── */
function execGlanceV(){
  const totVal = CASES.reduce((s,c) => s + c.value, 0);
  const totRev = CASES.reduce((s,c) => s + (c.billing.totalBilled||0), 0);
  const totRes = CASES.reduce((s,c) => s + (c.insurance.reserveAmount||0), 0);
  const open = CASES.filter(c => c.status !== 'Closed').length;
  const closed = CASES.filter(c => c.status === 'Closed');
  const wins = closed.filter(c => (c.exposure.settlementAmount || 0) < (c.exposure.demandAmount || c.value));
  const winRate = closed.length ? Math.round(wins.length/closed.length*100) : 0;

  let h = '<div class="kpi-grid">';
  h += '<div class="kpi"><div class="kpi-l">Portfolio Value</div><div class="kpi-v">'+fV(totVal)+'</div></div>';
  h += '<div class="kpi"><div class="kpi-l">Revenue</div><div class="kpi-v" style="color:var(--green);">'+fV(totRev)+'</div></div>';
  h += '<div class="kpi"><div class="kpi-l">Total Matters</div><div class="kpi-v">'+CASES.length+'</div></div>';
  h += '<div class="kpi"><div class="kpi-l">Open</div><div class="kpi-v">'+open+'</div></div>';
  h += '<div class="kpi"><div class="kpi-l">Win Rate</div><div class="kpi-v" style="color:var(--green);">'+winRate+'%</div></div>';
  h += '<div class="kpi"><div class="kpi-l">Reserves</div><div class="kpi-v" style="color:var(--gold);">'+fV(totRes)+'</div></div>';
  h += '</div>';

  h += '<div class="grid-2">';
  // New-matters-filed trend — uses c.filed, which is populated on
  // every case, unlike billing.totalBilled (real in this seed data
  // on only 1 of 15 cases — too sparse to ever show a meaningful
  // revenue-by-month line, so this tracks real filing volume instead).
  h += '<div class="card"><div class="sh"><span>New Matters Filed</span><span style="color:var(--dim);font-weight:500;">Last 12 months</span></div>';
  const filedDates = CASES.map(c=>new Date(c.filed).getTime()).filter(t=>!isNaN(t));
  const nowRef = new Date(Math.max(...filedDates));
  const months = []; for (let i=11;i>=0;i--){ const d=new Date(nowRef.getFullYear(),nowRef.getMonth()-i,1); months.push(d); }
  const monthlyFilings = months.map(d => CASES.filter(c=>{ const f=new Date(c.filed); return !isNaN(f) && f.getFullYear()===d.getFullYear() && f.getMonth()===d.getMonth(); }).length);
  const maxFilings = Math.max(...monthlyFilings, 1);
  h += '<svg viewBox="0 0 400 140" style="width:100%;height:150px;">';
  let path = '';
  monthlyFilings.forEach((v,i) => { const x=20+i*(360/11); const y=120-(v/maxFilings)*100; path += (i===0?'M':'L')+x+' '+y; });
  h += '<path d="'+path+'" stroke="var(--pri2)" stroke-width="2.5" fill="none"/>';
  monthlyFilings.forEach((v,i) => { const x=20+i*(360/11); const y=120-(v/maxFilings)*100; h += '<circle cx="'+x+'" cy="'+y+'" r="3" fill="var(--pri2)"/><text x="'+x+'" y="'+(y-8)+'" text-anchor="middle" font-size="9" fill="var(--muted)">'+(v||'')+'</text>'; });
  h += '</svg>';
  h += '<div style="display:flex;justify-content:space-between;font-size:9.5px;color:var(--dim);"><span>'+months[0].toLocaleDateString('en-US',{month:'short',year:'2-digit'})+'</span><span>'+months[11].toLocaleDateString('en-US',{month:'short',year:'2-digit'})+'</span></div></div>';

  h += '<div class="card"><div class="sh"><span>Cases by Status</span></div>';
  const statusCounts = {};
  CASES.forEach(c => { statusCounts[c.status] = (statusCounts[c.status]||0)+1; });
  const statusColors = {Active:'var(--pri2)', Closed:'var(--green)', Trial:'var(--red)', Discovery:'var(--gold)', Settlement:'#6D28D9'};
  Object.entries(statusCounts).sort((a,b)=>b[1]-a[1]).forEach(([s,ct]) => {
    const pct = Math.round(ct/CASES.length*100);
    h += '<div style="margin-bottom:8px;"><div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:2px;"><span style="color:var(--muted);">'+esc(s)+'</span><span style="font-weight:700;">'+ct+' ('+pct+'%)</span></div>';
    h += '<div style="background:var(--surf3);height:6px;border-radius:3px;overflow:hidden;"><div style="width:'+pct+'%;height:100%;background:'+(statusColors[s]||'var(--pri2)')+';"></div></div></div>';
  });
  h += '</div></div>';

  h += '<div class="card"><div class="sh"><span>Top Performers</span><span style="color:var(--dim);font-weight:500;">By LES</span></div>';
  const ranked = ATTY.map(a => attorneyScorecard(a)).sort((x,y)=>y.les-x.les).slice(0,3);
  h += '<div class="grid-3" style="margin-bottom:0;">';
  ranked.forEach((sc,i) => {
    h += '<div style="text-align:center;padding:14px;background:var(--surf2);border-radius:9px;cursor:pointer;" onclick="st({role:\'scorecard\',scorecardDetail:\''+sc.name+'\'})">';
    h += '<div style="font-size:20px;">'+(i===0?'🥇':i===1?'🥈':'🥉')+'</div>';
    h += '<div style="font-weight:700;font-size:13px;margin-top:4px;">'+esc(sc.name)+'</div>';
    h += '<div class="serif" style="font-size:22px;font-weight:700;color:'+lesGradeColor(sc.les)+';">'+lesGrade(sc.les)+'</div>';
    h += '<div style="font-size:10px;color:var(--muted);">LES '+sc.les+'</div></div>';
  });
  h += '</div></div>';
  return h;
}

/* ── 5. RISK & ALERTS ─────────────────────────────────────── */
function execRiskV(){
  const reserveRisk = CASES.filter(c => c.billing.totalBilled > (c.insurance.reserveAmount||0)*0.7);
  const trial = CASES.filter(c => c.status === 'Trial' || c.potentialTrialCandidate);
  const aging = CASES.filter(c => c.status !== 'Closed' && daysOpen(c) > 730).sort((a,b)=>daysOpen(b)-daysOpen(a));
  const solRisk = CASES.filter(c => c.keyDates.sol && new Date(c.keyDates.sol) < new Date(Date.now()+180*864e5) && c.status!=='Closed');
  const poorReserveAttys = ATTY.map(a=>attorneyScorecard(a)).filter(sc=>sc.reserveAccuracy < 90);

  let h = '<div class="kpi-grid">';
  h += '<div class="kpi"><div class="kpi-l">Trial Candidates</div><div class="kpi-v" style="color:var(--red);">'+trial.length+'</div></div>';
  h += '<div class="kpi"><div class="kpi-l">Reserve Burn &gt;70%</div><div class="kpi-v" style="color:var(--red);">'+reserveRisk.length+'</div></div>';
  h += '<div class="kpi"><div class="kpi-l">SOL &lt;180 Days</div><div class="kpi-v" style="color:var(--gold);">'+solRisk.length+'</div></div>';
  h += '<div class="kpi"><div class="kpi-l">Aged 24+ Months</div><div class="kpi-v" style="color:var(--red);">'+aging.length+'</div></div>';
  h += '</div>';

  h += '<div class="card"><div class="sh"><span>⚠ Critical Alerts — Trial Dates &amp; High Stakes</span></div>';
  const watch = CASES.filter(c => c.status !== 'Closed' && (c.priority === 'High' || c.value > 1e6 || c.potentialTrialCandidate)).sort((a,b) => b.value - a.value);
  if (watch.length) {
    h += '<div style="overflow-x:auto;"><table><thead><tr><th>Matter</th><th>Client</th><th>Attorney</th><th>Exposure</th><th>CCI</th></tr></thead><tbody>';
    watch.slice(0,10).forEach(c => {
      h += '<tr class="row-link" onclick="stCase(\''+c.id+'\')"><td style="font-weight:700;color:var(--pri2);">'+esc(c.matterNo||c.id)+'</td><td>'+esc(c.client)+'</td><td>'+esc(c.attorney.split(' ')[0])+'</td><td style="color:var(--red);font-weight:600;">'+fV(c.exposure.likelyExposure||c.value)+'</td><td><span class="cci-pill" style="background:'+cciColor(cci(c))+'22;color:'+cciColor(cci(c))+';">'+cci(c)+'</span></td></tr>';
    });
    h += '</tbody></table></div>';
  } else { h += '<div style="color:var(--muted);font-size:12px;">No high-stakes matters flagged right now.</div>'; }
  h += '</div>';

  h += '<div class="grid-2">';
  h += '<div class="card"><div class="sh"><span>Aging Cases Watchlist</span></div>';
  if (aging.length) {
    aging.slice(0,6).forEach(c => {
      h += '<div class="row-link" onclick="stCase(\''+c.id+'\')" style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--surf2);font-size:12px;"><span>'+esc(c.client)+'</span><span style="font-weight:700;color:var(--red);">'+daysOpen(c)+' days</span></div>';
    });
  } else { h += '<div style="color:var(--green);font-size:12.5px;font-weight:600;">✓ No matters aged past 24 months</div>'; }
  h += '</div>';

  h += '<div class="card"><div class="sh"><span>Reserve Accuracy Issues</span></div>';
  if (poorReserveAttys.length) {
    poorReserveAttys.forEach(sc => {
      h += '<div class="row-link" onclick="st({role:\'scorecard\',scorecardDetail:\''+sc.name+'\'})" style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--surf2);font-size:12px;"><span>'+esc(sc.name)+'</span><span style="font-weight:700;color:var(--gold);">'+sc.reserveAccuracy+'% accuracy</span></div>';
    });
  } else { h += '<div style="color:var(--green);font-size:12.5px;font-weight:600;">✓ All attorneys above 90% reserve accuracy</div>'; }
  h += '</div></div>';
  return h;
}

/* ── 6. DETAILED REPORTS ──────────────────────────────────── */
function execReportsExportCSV(){
  const cols = ['Matter','Client','Type','Attorney','Status','Stage','Value','Reserve','CCI'];
  const rows = CASES.map(c => [c.matterNo||c.id, c.client, c.type, c.attorney, c.status, c.litigationStage||'', c.value, c.insurance.reserveAmount||0, cci(c)]);
  downloadCSV('executive_matter_report_'+td()+'.csv', cols, rows);
}
function execReportsV(){
  let list = CASES.filter(c => !S.execSearch || (c.client+c.attorney+c.type+(c.matterNo||'')).toLowerCase().includes(S.execSearch.toLowerCase()));
  const dir = S.execSortDir === 'asc' ? 1 : -1;
  list = list.slice().sort((a,b) => {
    if (S.execSort === 'value') return (a.value-b.value)*dir;
    if (S.execSort === 'client') return a.client.localeCompare(b.client)*dir;
    if (S.execSort === 'attorney') return a.attorney.localeCompare(b.attorney)*dir;
    if (S.execSort === 'cci') return (cci(a)-cci(b))*dir;
    return 0;
  });

  let h = '<div class="card">';
  h += '<div class="sh"><span>All Matters ('+list.length+')</span>';

function trendSparkline(trend, color, w, hgt){
  w = w || 400; hgt = hgt || 90;
  const min = Math.min(...trend)-3, max = Math.max(...trend)+3;
  let path = '';
  trend.forEach((v,i) => {
    const x = 8 + i*(w-16)/(trend.length-1);
    const y = hgt-10 - (v-min)/(max-min)*(hgt-20);
    path += (i===0?'M':'L')+x+' '+y;
  });
  let h = '<svg viewBox="0 0 '+w+' '+hgt+'" style="width:100%;height:'+hgt+'px;">';
  h += '<path d="'+path+'" stroke="'+color+'" stroke-width="2.5" fill="none"/>';
  trend.forEach((v,i) => {
    const x = 8 + i*(w-16)/(trend.length-1);
    const y = hgt-10 - (v-min)/(max-min)*(hgt-20);
    h += '<circle cx="'+x+'" cy="'+y+'" r="'+(i===trend.length-1?3.5:2)+'" fill="'+color+'"/>';
  });
  h += '</svg>';
  return h;
}

    h += '<td>'+(s.aiSummary ? '<span class="tag" style="background:#EEF1F7;color:var(--pri2);">★ Included</span>' : '<span style="color:var(--dim);font-size:11px;">—</span>')+'</td>';
    h += '<td style="text-align:right;white-space:nowrap;">';
    h += '<button class="btn btn-ghost" style="font-size:10px;padding:4px 8px;" onclick="reopenSavedReport(\''+s.id+'\')">View</button> ';
    h += '<button class="btn btn-ghost" style="font-size:10px;padding:4px 8px;" onclick="downloadCSV(\''+s.name.replace(/[^a-z0-9]/gi,'_')+'_'+s.generatedDate+'.csv\', SAVED_REPORTS.find(x=>x.id===\''+s.id+'\').cols, SAVED_REPORTS.find(x=>x.id===\''+s.id+'\').rows)">CSV</button> ';
    h += '<button class="btn btn-ghost" style="font-size:10px;padding:4px 8px;color:var(--pri2);" onclick="openEmailModal(\''+s.id+'\')">✉ Email</button> ';
    h += '<button class="btn btn-ghost" style="font-size:10px;padding:4px 8px;color:var(--red);" onclick="if(confirm(\'Delete this saved report?\'))deleteSavedReport(\''+s.id+'\')">Delete</button>';
    h += '</td></tr>';
  });
  h += '</tbody></table></div></div>';
  return h;
}

/* Report data builders */
function buildReportData(rptId){
  const tmpl = REPORT_TEMPLATES.find(r => r.id === rptId);
  if (!tmpl) return {rows:[], cols:[]};
  let rows = [], cols = [];
  switch(rptId){
    case 'r1': /* Active Catastrophe */
      cols = ['Matter #','Client','Carrier','Reserve','Stage','Atty'];
      rows = CASES.filter(c => c.catastrophe === 'Yes').map(c => [c.matterNo||c.id, c.client, c.insurance.carrier, fM(c.insurance.reserveAmount), c.litigationStage, c.attorney]);
      break;
    case 'r2': /* AOB Resolution */
      cols = ['Matter #','Client','Carrier','Coverage','Demand','Settlement','Status'];
      rows = CASES.filter(c => c.aob === 'Yes').map(c => [c.matterNo||c.id, c.client, c.insurance.carrier, c.coverageType||'—', fM(c.exposure.demandAmount), fM(c.exposure.settlementAmount), c.status]);
      break;
    case 'r3': /* Aging 12+ */
      cols = ['Matter #','Client','Days Open','Stage','Atty','Reserve'];
      rows = CASES.filter(c => daysOpen(c) >= 365 && c.status !== 'Closed').sort((a,b)=>daysOpen(b)-daysOpen(a)).map(c => [c.matterNo||c.id, c.client, daysOpen(c), c.litigationStage, c.attorney, fM(c.insurance.reserveAmount)]);
      break;
    case 'r4': /* Aging 24+ */
      cols = ['Matter #','Client','Days Open','Stage','Reserve','CCI'];
      rows = CASES.filter(c => daysOpen(c) >= 730 && c.status !== 'Closed').map(c => [c.matterNo||c.id, c.client, daysOpen(c), c.litigationStage, fM(c.insurance.reserveAmount), cci(c)]);
      break;
    case 'r5': /* Budget v Actual */
      cols = ['Matter #','Client','Budget','Billed','Variance','Burn %'];
      rows = CASES.filter(c => c.billing.budget > 0 || c.billing.totalBilled > 0).map(c => {
        const v = c.billing.budget - c.billing.totalBilled;
        const burn = c.billing.budget ? Math.round((c.billing.totalBilled/c.billing.budget)*100) : 0;
        return [c.matterNo||c.id, c.client, fM(c.billing.budget), fM(c.billing.totalBilled), fM(v), burn+'%'];
      });
      break;
    case 'r6': /* Last Settlement Offer */
      cols = ['Matter #','Client','Demand','Last Offer','Gap','Stage'];
      rows = CASES.filter(c => c.exposure.demandAmount > 0 || c.exposure.offerAmount > 0).map(c => [c.matterNo||c.id, c.client, fM(c.exposure.demandAmount), fM(c.exposure.offerAmount), fM(c.exposure.demandAmount - c.exposure.offerAmount), c.litigationStage]);
      break;
    case 'r7': /* Mediation Schedule */
      cols = ['Matter #','Client','Mediation Date','Stage','Atty','Carrier'];
      rows = CASES.filter(c => c.keyDates.mediationDate).map(c => [c.matterNo||c.id, c.client, c.keyDates.mediationDate, c.litigationStage, c.attorney, c.insurance.carrier]);
      break;
    case 'r8': /* Trial Schedule */
      cols = ['Matter #','Client','Trial Date','Atty','Exposure','CCI'];
      rows = CASES.filter(c => c.keyDates.trialDate).map(c => [c.matterNo||c.id, c.client, c.keyDates.trialDate, c.attorney, fM(c.exposure.likelyExposure||c.value), cci(c)]);
      break;
    case 'r9': /* Reserve Adequacy */
      cols = ['Matter #','Client','Reserve','Billed','Burn %','Status'];
      rows = CASES.map(c => {
        const burn = c.insurance.reserveAmount ? Math.round((c.billing.totalBilled/c.insurance.reserveAmount)*100) : 0;
        const stat = burn > 70 ? 'AT RISK' : burn > 50 ? 'MONITOR' : 'HEALTHY';
        return [c.matterNo||c.id, c.client, fM(c.insurance.reserveAmount), fM(c.billing.totalBilled), burn+'%', stat];
      });
      break;
    case 'r10': /* SOL Tracker */
      cols = ['Matter #','Client','SOL Date','Days','Status'];
      rows = CASES.filter(c => c.keyDates.sol).sort((a,b)=>new Date(a.keyDates.sol)-new Date(b.keyDates.sol)).map(c => {
        const days = Math.ceil((new Date(c.keyDates.sol)-Date.now())/864e5);
        return [c.matterNo||c.id, c.client, c.keyDates.sol, days+'d', c.keyDates.solStatus];
      });
      break;
    case 'r11': /* By Carrier */
      cols = ['Carrier','Matters','Total Reserves','Avg CCI'];
      const byCar = {};
      CASES.forEach(c => { const ca = c.insurance.carrier||'Unknown'; byCar[ca] = byCar[ca]||{n:0,r:0,i:[]}; byCar[ca].n++; byCar[ca].r += (c.insurance.reserveAmount||0); byCar[ca].i.push(cci(c)); });
      rows = Object.entries(byCar).sort((a,b)=>b[1].r-a[1].r).map(([n,d]) => [n, d.n, fM(d.r), Math.round(d.i.reduce((s,x)=>s+x,0)/d.i.length)]);
      break;
    case 'r12': /* Closed Matters */
      cols = ['Matter #','Client','Closed','Settlement','Days','Atty'];
      rows = CASES.filter(c => c.status === 'Closed').map(c => [c.matterNo||c.id, c.client, c.deadline, fM(c.exposure.settlementAmount), daysOpen(c), c.attorney]);
      break;
    case 'r13': /* Discovery Status */
      cols = ['Matter #','Client','Discovery Close','Atty','Stage'];
      rows = CASES.filter(c => c.status === 'Discovery' || c.litigationStage === 'Discovery').map(c => [c.matterNo||c.id, c.client, c.keyDates.discoveryClose||'—', c.attorney, c.litigationStage]);
      break;
    case 'r14': /* Expert Disclosures */
      cols = ['Matter #','Client','Expert Close','Experts','Atty'];
      rows = CASES.filter(c => (c.experts||[]).length > 0 || c.keyDates.expertClose).map(c => [c.matterNo||c.id, c.client, c.keyDates.expertClose||'—', (c.experts||[]).length, c.attorney]);
      break;
    case 'r15': /* High-Exposure */
      cols = ['Matter #','Client','Exposure','Reserve','CCI','Atty'];
      rows = CASES.filter(c => (c.exposure.likelyExposure||c.value) > 1e6).sort((a,b)=>(b.exposure.likelyExposure||b.value)-(a.exposure.likelyExposure||a.value)).map(c => [c.matterNo||c.id, c.client, fM(c.exposure.likelyExposure||c.value), fM(c.insurance.reserveAmount), cci(c), c.attorney]);
      break;
    case 'r16': /* Trial Candidates */
      cols = ['Matter #','Client','Stage','Trial Date','Exposure','Atty'];
      rows = CASES.filter(c => c.potentialTrialCandidate).map(c => [c.matterNo||c.id, c.client, c.litigationStage, c.keyDates.trialDate||'—', fM(c.exposure.likelyExposure||c.value), c.attorney]);
      break;
    case 'r17': /* By Plaintiff Firm */
      cols = ['Firm','Matters','Avg Exposure'];
      const byPF = {};
      CASES.forEach(c => { const f = c.opposing.counselFirm||'Unknown'; byPF[f] = byPF[f]||{n:0,e:0}; byPF[f].n++; byPF[f].e += (c.exposure.likelyExposure||c.value); });
      rows = Object.entries(byPF).filter(([n])=>n!=='Unknown'&&n!=='').sort((a,b)=>b[1].n-a[1].n).map(([n,d]) => [n, d.n, fM(d.e/d.n)]);
      break;
    case 'r18': /* Time & Expense */
      cols = ['Matter #','Client','Time Entries','Hours','Expenses','Total'];
      rows = CASES.map(c => {
        const te = c.billing.timeEntries||[]; const ee = c.billing.expenseEntries||[];
        const hrs = te.reduce((s,t)=>s+(t.hours||0),0);
        const exp = ee.reduce((s,e)=>s+(e.amount||0),0);
        return [c.matterNo||c.id, c.client, te.length, hrs.toFixed(1), fM(exp), fM(c.billing.totalBilled)];
      }).filter(r => r[2] > 0 || parseFloat(r[3]) > 0);
      break;
    case 'r19': /* Activity Log */
      cols = ['Date','Matter #','Client','Type','Author','Update'];
      rows = [];
      CASES.forEach(c => (c.updates||[]).forEach(u => rows.push([u.date, c.matterNo||c.id, c.client, u.type, u.author, u.text])));
      rows.sort((a,b) => new Date(b[0])-new Date(a[0])).slice(0,50);
      break;
    case 'r20': /* Open Matters */
      cols = ['Matter #','Client','Type','Status','Stage','Atty','Carrier','Reserve','CCI'];
      rows = CASES.filter(c => c.status !== 'Closed').map(c => [c.matterNo||c.id, c.client, c.type, c.status, c.litigationStage, c.attorney, c.insurance.carrier, fM(c.insurance.reserveAmount), cci(c)]);
      break;
    case 'r21': /* Closing Readiness / Claims Handoff */
      cols = ['Matter #','Client','Disposition','Open Liens','Pending Authority','Release','Dismissal','Readiness','Blockers'];
      rows = CASES.filter(c => c.status !== 'Closed' && (c.status === 'Closing' || (c.closing && c.closing.dispositionType))).map(c => {
        const readiness = closingReadiness(c);
        const openLiens = (c.liens||[]).filter(l => l.status !== 'Resolved' && l.status !== 'Waived').length;
        const pendingAuth = (c.authorityRequests||[]).filter(a => a.status === 'Pending').length;
        return [c.matterNo||c.id, c.client, c.closing.dispositionType||'—', openLiens, pendingAuth, c.closing.releaseStatus, c.closing.dismissalStatus, readiness.label, readiness.blockers.join('; ')||'None'];
      });
      break;
  }
  return {tmpl, rows, cols};
}

  } else {

  }

  h += '</div></div></div>';

}

async function start2FASetup(){
  st({securityLoading:true, securityError:''});
  try {
    const data = await apiFetch('/api/auth/2fa/setup', { method:'POST' });
    st({securityLoading:false, security2FASetup:data});
  } catch (e) {
    st({securityLoading:false, securityError:e.message});
  }

/* ── INVOICE HUB / FIRM-WIDE BILLING ────────────────────── */
function invoiceHubV(){
  /* Aggregate billing data across all cases */
  let totalBilled = 0, totalPaid = 0, totalBudget = 0;
  const allInvoices = [];
  const allTimeEntries = [];
  CASES.forEach(c => {
    totalBilled += (c.billing.totalBilled||0);
    totalPaid += (c.billing.totalPaid||0);
    totalBudget += (c.billing.budget||0);
    (c.billing.invoices||[]).forEach(inv => allInvoices.push({...inv, case:c}));
    (c.billing.timeEntries||[]).forEach(te => allTimeEntries.push({...te, case:c}));
  });
  const outstanding = totalBilled - totalPaid;
  const collRate = totalBilled ? Math.round((totalPaid/totalBilled)*100) : 0;
  const arDisplay = fAR(outstanding);
  const collDisplay = fCollRate(totalPaid, totalBilled);

  /* AR aging buckets */
  const now = Date.now();
  const aging = {current:0, '30':0, '60':0, '90':0, '120':0};
  allInvoices.forEach(inv => {
    if (inv.status === 'Paid') return;
    const d = Math.floor((now - new Date(inv.date))/864e5);
    if (d <= 30) aging.current += inv.amount;
    else if (d <= 60) aging['30'] += inv.amount;
    else if (d <= 90) aging['60'] += inv.amount;
    else if (d <= 120) aging['90'] += inv.amount;
    else aging['120'] += inv.amount;
  });

  /* Top revenue cases */
  const topRev = [...CASES].sort((a,b) => (b.billing.totalBilled||0)-(a.billing.totalBilled||0)).slice(0,10);

  /* Timekeeper aggregation */
  const byAtty = {};
  ATTY.forEach(a => byAtty[a] = {hours:0, billed:0, entries:0, rate:0});
  allTimeEntries.forEach(te => {
    if (!byAtty[te.atty]) byAtty[te.atty] = {hours:0, billed:0, entries:0, rate:0};
    byAtty[te.atty].hours += (te.hours||0);
    byAtty[te.atty].billed += (te.hours||0) * (te.rate||0);
    byAtty[te.atty].entries++;
    byAtty[te.atty].rate = te.rate;
  });

  /* Budget burn flags */
  const overBudget = CASES.filter(c => c.billing.budget > 0 && c.billing.totalBilled > c.billing.budget);
  const nearBudget = CASES.filter(c => c.billing.budget > 0 && c.billing.totalBilled > c.billing.budget*0.8 && c.billing.totalBilled <= c.billing.budget);

  /* UTBMS code distribution */
  const byCode = {};
  allTimeEntries.forEach(te => {
    const code = (te.code||'').split(' - ')[0] || 'Other';
    byCode[code] = (byCode[code]||0) + (te.hours||0)*(te.rate||0);
  });
  const topCodes = Object.entries(byCode).sort((a,b) => b[1]-a[1]).slice(0,8);

  let h = '<div class="wrap">';
  h += '<div class="hero">';
  h += '<div class="hero-l"><div class="hero-eyebrow">Invoice Hub · Firm Billing</div>';
  h += '<h1 class="hero-title">Billing & Revenue Operations</h1>';
  h += '<p class="hero-sub">'+allInvoices.length+' invoices · '+allTimeEntries.length+' time entries · '+collDisplay.text+' collection rate</p></div>';
  h += '<div class="hero-r">';
  h += '<button class="btn btn-out" onclick="exportAllLEDES()">Export LEDES (All)</button>';
  h += '<button class="btn btn-pri" onclick="runBillingAI()">★ AI Billing Review</button>';
  h += '</div></div>';

  /* KPI strip */
  h += '<div class="kpi-grid">';
  h += '<div class="kpi"><div class="kpi-l">Total Billed</div><div class="kpi-v">'+fV(totalBilled)+'</div></div>';
  h += '<div class="kpi"><div class="kpi-l">Collected</div><div class="kpi-v" style="color:var(--green);">'+fV(totalPaid)+'</div></div>';
  h += '<div class="kpi"><div class="kpi-l">Outstanding AR</div><div class="kpi-v" style="color:var(--gold);">'+arDisplay.text+'</div>'+(arDisplay.note?'<div class="kpi-sub" style="color:var(--green);">'+arDisplay.note+'</div>':'')+'</div>';
  h += '<div class="kpi"><div class="kpi-l">Collection Rate</div><div class="kpi-v">'+collDisplay.text+'</div>'+(collDisplay.over?'<div class="kpi-sub" style="color:var(--green);">overpaid</div>':'')+'</div>';
  h += '<div class="kpi"><div class="kpi-l">Budget Allocated</div><div class="kpi-v">'+fV(totalBudget)+'</div></div>';
  h += '<div class="kpi"><div class="kpi-l">Over Budget</div><div class="kpi-v" style="color:var(--red);">'+overBudget.length+'</div></div>';
  h += '</div>';

  /* Row 1: AR Aging + Budget Status */
  h += '<div class="grid-2">';

  /* AR Aging */
  h += '<div class="card">';
  h += '<div class="sh"><span>Accounts Receivable Aging</span></div>';
  const totalAR = Object.values(aging).reduce((s,v)=>s+v, 0) || 1;
