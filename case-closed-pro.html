/* ── TRENDS ────────────────────────────────────────────────
   Historical trend lines for the three headline metrics that,
   elsewhere in the dashboard, only ever show as a live snapshot
   (win rate, cycle time, portfolio CCI) — plus a cross-dimension
   breakdown by case type and carrier that today only exists by
   attorney. Everything here is computed from real, timestamped
   case data (deadline = actual close date for Closed matters) —
   no seeded or fabricated history. Months with zero closes are
   left as gaps in the line rather than plotted as 0%, since a
   month with no data isn't the same as a month with a 0% outcome. */
function execTrendsV(){
  let h = '';
  h += '<div class="section-band">📈 Performance Trends Over Time</div>';

  const closedAll = CASES.filter(c => c.status === 'Closed' && c.deadline && !isNaN(new Date(c.deadline).getTime()));
  if (!closedAll.length) {
    h += '<div class="card"><div style="padding:24px;text-align:center;color:var(--muted);">No closed matters with valid close dates yet — trend lines will populate as matters close.</div></div>';
    return h;
  }

  const closeMs = closedAll.map(c => new Date(c.deadline).getTime());
  const ref = new Date(Math.max(...closeMs));
  const MONTHS_BACK = 12;
  const months = []; for (let i=MONTHS_BACK-1; i>=0; i--) { months.push(new Date(ref.getFullYear(), ref.getMonth()-i, 1)); }
  const buckets = months.map(d => closedAll.filter(c => {
    const cd = new Date(c.deadline);
    return cd.getFullYear()===d.getFullYear() && cd.getMonth()===d.getMonth();
  }));
  const counts = buckets.map(list => list.length);

  const winRates = buckets.map(list => {
    if (!list.length) return null;
    const wins = list.filter(c => (c.exposure.settlementAmount||0) < (c.exposure.demandAmount||c.value)).length;
    return Math.round(wins/list.length*100);
  });
  const cycleTimes = buckets.map(list => list.length ? Math.round(list.reduce((s,c)=>s+daysOpen(c),0)/list.length) : null);
  const cciVals = buckets.map(list => list.length ? Math.round(list.reduce((s,c)=>s+cci(c),0)/list.length) : null);

  h += trendChartCard('Win Rate Trend', 'Share of closed matters won, by month closed', 'var(--green)', months, winRates, counts, v=>v+'%', 0, 100);
  h += trendChartCard('Cycle Time Trend', 'Avg. days to close, by month closed', 'var(--pri2)', months, cycleTimes, counts, v=>v+'d', null, null);
  h += trendChartCard('Portfolio Favorability (CCI) Trend', 'Avg. CCI of matters at time of closing, by month closed', '#7C3AED', months, cciVals, counts, v=>v, 0, 100);

  h += '<div style="font-size:10.5px;color:var(--dim);margin:2px 0 18px;">Based on '+closedAll.length+' closed matters with a recorded close date, over the '+MONTHS_BACK+' months ending '+ref.toLocaleDateString('en-US',{month:'long',year:'numeric'})+'. Months with no closed matters are shown as a gap, not a zero.</div>';

  h += '<div class="section-band">🔎 Breakdown by Case Type &amp; Carrier</div>';
  h += '<div class="grid-2">';
  h += breakdownCard('By Case Type', c => c.type, 'Case Type');
  h += breakdownCard('By Carrier', c => (c.insurance && c.insurance.carrier) || 'Unspecified', 'Carrier');
  h += '</div>';

  return h;
}

/* Generic sparse-friendly SVG line chart used by execTrendsV.
   values[i]===null means "no data that month" and breaks the line
   rather than dropping to zero. fmt formats the value for the chip
   strip under the chart; minV/maxV pin the y-axis (pass null to
   auto-scale to the data). */
function trendChartCard(title, subtitle, color, months, values, counts, fmt, minV, maxV){
  let h = '<div class="card"><div class="sh"><span>'+title+'</span><span style="color:var(--dim);font-weight:500;">'+subtitle+'</span></div>';
  const nums = values.filter(v => v!==null);
  if (!nums.length) {
    h += '<div style="padding:18px;color:var(--muted);font-size:12px;text-align:center;">Not enough closed-matter data yet to chart this.</div></div>';
    return h;
  }
  const lo = (minV!==null && minV!==undefined) ? minV : Math.min(...nums);
  const hi = (maxV!==null && maxV!==undefined) ? maxV : Math.max(...nums);
  const span = (hi - lo) || 1;
  const W = 800, H = 140, padL = 24, padR = 24, padT = 14, padB = 26;
  const n = values.length;
  const xAt = i => padL + i * ((W - padL - padR) / Math.max(n-1,1));
  const yAt = v => padT + (H - padT - padB) - ((v - lo) / span) * (H - padT - padB);

  let segs = [], cur = '';
  values.forEach((v,i) => {
    if (v === null) { if (cur) segs.push(cur); cur = ''; return; }
    cur += (cur === '' ? 'M' : 'L') + xAt(i) + ' ' + yAt(v);
  });
  if (cur) segs.push(cur);

  h += '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:150px;">';
  segs.forEach(p => { h += '<path d="'+p+'" stroke="'+color+'" stroke-width="2.5" fill="none"/>'; });
  values.forEach((v,i) => { if (v !== null) h += '<circle cx="'+xAt(i)+'" cy="'+yAt(v)+'" r="3.5" fill="'+color+'"/>'; });
  months.forEach((d,i) => {
    if (n > 8 && i % 2 !== 0 && i !== n-1) return;
    h += '<text x="'+xAt(i)+'" y="'+(H-6)+'" font-size="9" fill="var(--dim)" text-anchor="middle">'+d.toLocaleDateString('en-US',{month:'short',year:'2-digit'})+'</text>';
  });
  h += '</svg>';

  h += '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;">';
  months.forEach((d,i) => {
    const v = values[i];
    h += '<div style="font-size:9.5px;color:var(--muted);background:var(--surf2);border-radius:4px;padding:3px 7px;" title="'+counts[i]+' closed this month">'
       + d.toLocaleDateString('en-US',{month:'short',year:'2-digit'}) + ': <strong style="color:'+(v===null?'var(--dim)':'var(--ink)')+';">' + (v===null ? '—' : fmt(v)) + '</strong>'
       + ' <span style="color:var(--dim);">(n='+counts[i]+')</span></div>';
  });
  h += '</div></div>';
  return h;
}

/* Cross-dimension breakdown table — win rate / avg CCI / avg cycle
   time grouped by any case field (case type, carrier, etc). CCI is
   averaged across all matters in the group (open + closed, since
   CCI is meaningful for open matters too); win rate and cycle time
   are computed from closed matters only, since those require a
   final outcome. */
function breakdownCard(title, keyFn, colLabel){
  const groups = {};
  CASES.forEach(c => {
    const k = keyFn(c) || 'Unspecified';
    if (!groups[k]) groups[k] = { all: [], closed: [] };
    groups[k].all.push(c);
    if (c.status === 'Closed') groups[k].closed.push(c);
  });
  const rows = Object.entries(groups).map(([k,g]) => {
    const wins = g.closed.filter(c => (c.exposure.settlementAmount||0) < (c.exposure.demandAmount||c.value)).length;
    const winRate = g.closed.length ? Math.round(wins/g.closed.length*100) : null;
    const avgCci = g.all.length ? Math.round(g.all.reduce((s,c)=>s+cci(c),0)/g.all.length) : 0;
    const avgCycle = g.closed.length ? Math.round(g.closed.reduce((s,c)=>s+daysOpen(c),0)/g.closed.length) : null;
    return { k, n: g.all.length, closedN: g.closed.length, winRate, avgCci, avgCycle };
  }).sort((a,b) => b.n - a.n);

  let h = '<div class="card"><div class="sh"><span>'+title+'</span><span style="color:var(--dim);font-weight:500;">'+rows.length+' '+colLabel.toLowerCase()+(rows.length===1?'':'s')+'</span></div>';
  h += '<div style="overflow-x:auto;"><table><thead><tr><th>'+colLabel+'</th><th>Matters</th><th>Closed</th><th>Win Rate</th><th>Avg CCI</th><th>Avg Cycle</th></tr></thead><tbody>';
  rows.forEach(r => {
    const wrColor = r.winRate===null ? 'var(--dim)' : (r.winRate>=60 ? 'var(--green)' : r.winRate>=40 ? 'var(--gold)' : 'var(--red)');
    h += '<tr>';
    h += '<td style="font-weight:700;">'+esc(r.k)+'</td>';
    h += '<td>'+r.n+'</td>';
    h += '<td>'+r.closedN+'</td>';
    h += '<td style="color:'+wrColor+';font-weight:700;">'+(r.winRate===null?'—':r.winRate+'%')+'</td>';

/* ── SCORECARDS ─────────────────────────────────────────────
   scorecardV() = summary grid (quick scan, click to drill in).
   attorneyDetailV() = the 14-feature detail page for one attorney,
   organized into the same 5 categories the enhancement spec used:
   Performance Tracking, Proactive Management, Detailed Analytics,
   Relationships, Context. */
/* Deterministic mentor pairing from the REAL attorney roster — the
   uploaded V3 file hardcoded fake names ('Patricia Thompson', etc.)
   that don't exist in ATTY, so it would never have shown anything
   for a real attorney. This pairs the top half of the roster (by
   LES) as mentors to the bottom half, stable across renders. */
function getMentorNetwork(name){
  const ranked = [...ATTY].sort((a,b) => attorneyScorecard(b).les - attorneyScorecard(a).les);
  const mid = Math.ceil(ranked.length/2);
  const mentors = ranked.slice(0, mid), mentees = ranked.slice(mid);
  const idx = mentees.indexOf(name);
  if (idx !== -1) return { mentors: [mentors[idx % mentors.length]], mentees: [] };
  const menteeIdx = mentors.indexOf(name);
  if (menteeIdx !== -1) {
    const myMentees = mentees.filter((_,i) => i % mentors.length === menteeIdx);
    return { mentors: [], mentees: myMentees };
  }
  return { mentors: [], mentees: [] };
}

function trendSparkline(trend, color, w, hgt){
  w = w || 400; hgt = hgt || 90;
  const min = Math.min(...trend)-3, max = Math.max(...trend)+3;
  let path = '';
  trend.forEach((v,i) => {
    const x = 8 + i*(w-16)/(trend.length-1);
    const y = hgt-10 - (v-min)/(max-min)*(hgt-20);
    path += (i===0?'M':'L')+x+' '+y;
  });
  let h = '<svg viewBox="0 0 '+w+' '+hgt+'" style="width:100%;height:'+hgt+'px;">';
  h += '<path d="'+path+'" stroke="'+color+'" stroke-width="2.5" fill="none"/>';
  trend.forEach((v,i) => {
    const x = 8 + i*(w-16)/(trend.length-1);
    const y = hgt-10 - (v-min)/(max-min)*(hgt-20);
    h += '<circle cx="'+x+'" cy="'+y+'" r="'+(i===trend.length-1?3.5:2)+'" fill="'+color+'"/>';
  });
  h += '</svg>';
  return h;
}

/* Report data builders */
function buildReportData(rptId){
  const tmpl = REPORT_TEMPLATES.find(r => r.id === rptId);
  if (!tmpl) return {rows:[], cols:[]};
  let rows = [], cols = [];
  switch(rptId){
    case 'r1': /* Active Catastrophe */
      cols = ['Matter #','Client','Carrier','Reserve','Stage','Atty'];
      rows = CASES.filter(c => c.catastrophe === 'Yes').map(c => [c.matterNo||c.id, c.client, c.insurance.carrier, fM(c.insurance.reserveAmount), c.litigationStage, c.attorney]);
      break;
    case 'r2': /* AOB Resolution */
      cols = ['Matter #','Client','Carrier','Coverage','Demand','Settlement','Status'];
      rows = CASES.filter(c => c.aob === 'Yes').map(c => [c.matterNo||c.id, c.client, c.insurance.carrier, c.coverageType||'—', fM(c.exposure.demandAmount), fM(c.exposure.settlementAmount), c.status]);
      break;
    case 'r3': /* Aging 12+ */
      cols = ['Matter #','Client','Days Open','Stage','Atty','Reserve'];
      rows = CASES.filter(c => daysOpen(c) >= 365 && c.status !== 'Closed').sort((a,b)=>daysOpen(b)-daysOpen(a)).map(c => [c.matterNo||c.id, c.client, daysOpen(c), c.litigationStage, c.attorney, fM(c.insurance.reserveAmount)]);
      break;
    case 'r4': /* Aging 24+ */
      cols = ['Matter #','Client','Days Open','Stage','Reserve','CCI'];
      rows = CASES.filter(c => daysOpen(c) >= 730 && c.status !== 'Closed').map(c => [c.matterNo||c.id, c.client, daysOpen(c), c.litigationStage, fM(c.insurance.reserveAmount), cci(c)]);
      break;
    case 'r5': /* Budget v Actual */
      cols = ['Matter #','Client','Budget','Billed','Variance','Burn %'];
      rows = CASES.filter(c => c.billing.budget > 0 || c.billing.totalBilled > 0).map(c => {
        const v = c.billing.budget - c.billing.totalBilled;
        const burn = c.billing.budget ? Math.round((c.billing.totalBilled/c.billing.budget)*100) : 0;
        return [c.matterNo||c.id, c.client, fM(c.billing.budget), fM(c.billing.totalBilled), fM(v), burn+'%'];
      });
      break;
    case 'r6': /* Last Settlement Offer */
      cols = ['Matter #','Client','Demand','Last Offer','Gap','Stage'];
      rows = CASES.filter(c => c.exposure.demandAmount > 0 || c.exposure.offerAmount > 0).map(c => [c.matterNo||c.id, c.client, fM(c.exposure.demandAmount), fM(c.exposure.offerAmount), fM(c.exposure.demandAmount - c.exposure.offerAmount), c.litigationStage]);
      break;
    case 'r7': /* Mediation Schedule */
      cols = ['Matter #','Client','Mediation Date','Stage','Atty','Carrier'];
      rows = CASES.filter(c => c.keyDates.mediationDate).map(c => [c.matterNo||c.id, c.client, c.keyDates.mediationDate, c.litigationStage, c.attorney, c.insurance.carrier]);
      break;
    case 'r8': /* Trial Schedule */
      cols = ['Matter #','Client','Trial Date','Atty','Exposure','CCI'];
      rows = CASES.filter(c => c.keyDates.trialDate).map(c => [c.matterNo||c.id, c.client, c.keyDates.trialDate, c.attorney, fM(c.exposure.likelyExposure||c.value), cci(c)]);
      break;
    case 'r9': /* Reserve Adequacy */
      cols = ['Matter #','Client','Reserve','Billed','Burn %','Status'];
      rows = CASES.map(c => {
        const burn = c.insurance.reserveAmount ? Math.round((c.billing.totalBilled/c.insurance.reserveAmount)*100) : 0;
        const stat = burn > 70 ? 'AT RISK' : burn > 50 ? 'MONITOR' : 'HEALTHY';
        return [c.matterNo||c.id, c.client, fM(c.insurance.reserveAmount), fM(c.billing.totalBilled), burn+'%', stat];
      });
      break;
    case 'r10': /* SOL Tracker */
      cols = ['Matter #','Client','SOL Date','Days','Status'];
      rows = CASES.filter(c => c.keyDates.sol).sort((a,b)=>new Date(a.keyDates.sol)-new Date(b.keyDates.sol)).map(c => {
        const days = Math.ceil((new Date(c.keyDates.sol)-Date.now())/864e5);
        return [c.matterNo||c.id, c.client, c.keyDates.sol, days+'d', c.keyDates.solStatus];
      });
      break;
    case 'r11': /* By Carrier */
      cols = ['Carrier','Matters','Total Reserves','Avg CCI'];
      const byCar = {};
      CASES.forEach(c => { const ca = c.insurance.carrier||'Unknown'; byCar[ca] = byCar[ca]||{n:0,r:0,i:[]}; byCar[ca].n++; byCar[ca].r += (c.insurance.reserveAmount||0); byCar[ca].i.push(cci(c)); });
      rows = Object.entries(byCar).sort((a,b)=>b[1].r-a[1].r).map(([n,d]) => [n, d.n, fM(d.r), Math.round(d.i.reduce((s,x)=>s+x,0)/d.i.length)]);
      break;
    case 'r12': /* Closed Matters */
      cols = ['Matter #','Client','Closed','Settlement','Days','Atty'];
      rows = CASES.filter(c => c.status === 'Closed').map(c => [c.matterNo||c.id, c.client, c.deadline, fM(c.exposure.settlementAmount), daysOpen(c), c.attorney]);
      break;
    case 'r13': /* Discovery Status */
      cols = ['Matter #','Client','Discovery Close','Atty','Stage'];
      rows = CASES.filter(c => c.status === 'Discovery' || c.litigationStage === 'Discovery').map(c => [c.matterNo||c.id, c.client, c.keyDates.discoveryClose||'—', c.attorney, c.litigationStage]);
      break;
    case 'r14': /* Expert Disclosures */
      cols = ['Matter #','Client','Expert Close','Experts','Atty'];
      rows = CASES.filter(c => (c.experts||[]).length > 0 || c.keyDates.expertClose).map(c => [c.matterNo||c.id, c.client, c.keyDates.expertClose||'—', (c.experts||[]).length, c.attorney]);
      break;
    case 'r15': /* High-Exposure */
      cols = ['Matter #','Client','Exposure','Reserve','CCI','Atty'];
      rows = CASES.filter(c => (c.exposure.likelyExposure||c.value) > 1e6).sort((a,b)=>(b.exposure.likelyExposure||b.value)-(a.exposure.likelyExposure||a.value)).map(c => [c.matterNo||c.id, c.client, fM(c.exposure.likelyExposure||c.value), fM(c.insurance.reserveAmount), cci(c), c.attorney]);
      break;
    case 'r16': /* Trial Candidates */
      cols = ['Matter #','Client','Stage','Trial Date','Exposure','Atty'];
      rows = CASES.filter(c => c.potentialTrialCandidate).map(c => [c.matterNo||c.id, c.client, c.litigationStage, c.keyDates.trialDate||'—', fM(c.exposure.likelyExposure||c.value), c.attorney]);
      break;
    case 'r17': /* By Plaintiff Firm */
      cols = ['Firm','Matters','Avg Exposure'];
      const byPF = {};
      CASES.forEach(c => { const f = c.opposing.counselFirm||'Unknown'; byPF[f] = byPF[f]||{n:0,e:0}; byPF[f].n++; byPF[f].e += (c.exposure.likelyExposure||c.value); });
      rows = Object.entries(byPF).filter(([n])=>n!=='Unknown'&&n!=='').sort((a,b)=>b[1].n-a[1].n).map(([n,d]) => [n, d.n, fM(d.e/d.n)]);
      break;
    case 'r18': /* Time & Expense */
      cols = ['Matter #','Client','Time Entries','Hours','Expenses','Total'];
      rows = CASES.map(c => {
        const te = c.billing.timeEntries||[]; const ee = c.billing.expenseEntries||[];
        const hrs = te.reduce((s,t)=>s+(t.hours||0),0);
        const exp = ee.reduce((s,e)=>s+(e.amount||0),0);
        return [c.matterNo||c.id, c.client, te.length, hrs.toFixed(1), fM(exp), fM(c.billing.totalBilled)];
      }).filter(r => r[2] > 0 || parseFloat(r[3]) > 0);
      break;
    case 'r19': /* Activity Log */
      cols = ['Date','Matter #','Client','Type','Author','Update'];
      rows = [];
      CASES.forEach(c => (c.updates||[]).forEach(u => rows.push([u.date, c.matterNo||c.id, c.client, u.type, u.author, u.text])));
      rows.sort((a,b) => new Date(b[0])-new Date(a[0])).slice(0,50);
      break;
    case 'r20': /* Open Matters */
      cols = ['Matter #','Client','Type','Status','Stage','Atty','Carrier','Reserve','CCI'];
      rows = CASES.filter(c => c.status !== 'Closed').map(c => [c.matterNo||c.id, c.client, c.type, c.status, c.litigationStage, c.attorney, c.insurance.carrier, fM(c.insurance.reserveAmount), cci(c)]);
      break;
    case 'r21': /* Closing Readiness / Claims Handoff */
      cols = ['Matter #','Client','Disposition','Open Liens','Pending Authority','Release','Dismissal','Readiness','Blockers'];
      rows = CASES.filter(c => c.status !== 'Closed' && (c.status === 'Closing' || (c.closing && c.closing.dispositionType))).map(c => {
        const readiness = closingReadiness(c);
        const openLiens = (c.liens||[]).filter(l => l.status !== 'Resolved' && l.status !== 'Waived').length;
        const pendingAuth = (c.authorityRequests||[]).filter(a => a.status === 'Pending').length;
        return [c.matterNo||c.id, c.client, c.closing.dispositionType||'—', openLiens, pendingAuth, c.closing.releaseStatus, c.closing.dismissalStatus, readiness.label, readiness.blockers.join('; ')||'None'];
      });
      break;
    case 'r22': /* Material Matters Watchlist */
      cols = ['Matter #','Client','Attorney','Carrier','Probability of Loss','Exposure','CCI'];
      rows = CASES.filter(c => c.status !== 'Closed' && (c.exposure.likelyExposure||c.value||0) > 10000000)
        .sort((a,b)=>(b.exposure.likelyExposure||b.value)-(a.exposure.likelyExposure||a.value))
        .map(c => [c.matterNo||c.id, c.client, c.attorney, c.insurance.carrier||'—', c.probabilityOfLoss||'Reasonably Possible', fM(c.exposure.likelyExposure||c.value), cci(c)]);
      break;
    case 'r23': /* Exposure by Probability of Loss */
      cols = ['Probability of Loss','Matter Count','Total Exposure'];
      { const pb = {Probable:{n:0,exp:0}, 'Reasonably Possible':{n:0,exp:0}, Remote:{n:0,exp:0}};
        CASES.filter(c=>c.status!=='Closed').forEach(c => { const p = c.probabilityOfLoss||'Reasonably Possible'; pb[p]=pb[p]||{n:0,exp:0}; pb[p].n++; pb[p].exp += (c.exposure.likelyExposure||c.value||0); });
        rows = Object.entries(pb).map(([label,d]) => [label, d.n, fM(d.exp)]); }
      break;
    case 'r24': /* Outside Counsel Performance Ranking */
      cols = ['Attorney','Total Spend','Open Matters','Closed Matters','Win Rate','Settlement Rate','LES Grade','Reserve Accuracy'];
      rows = ATTY.map(a=>attorneyScorecard(a)).sort((x,y)=>y.totalBilled-x.totalBilled)
        .map(sc => [sc.name, fM(sc.totalBilled), sc.open.length, sc.closed.length, sc.winPct+'%', sc.settlePct+'%', lesGrade(sc.les), sc.reserveAccuracy+'%']);
      break;
    case 'r25': /* Spend by Matter Type */
      cols = ['Matter Type','Total Spend','Matter Count'];
      { const st = {};
        CASES.forEach(c => { st[c.type] = st[c.type]||{spend:0,n:0}; st[c.type].spend += (c.billing.totalBilled||0); st[c.type].n++; });
        rows = Object.entries(st).sort((a,b)=>b[1].spend-a[1].spend).map(([t,d]) => [t, fM(d.spend), d.n]); }
      break;
    case 'r26': /* AFA Savings Detail */
      cols = ['Matter #','Client','Fee Type','Total Billed','Budget'];
      rows = CASES.filter(c => c.billing.type && c.billing.type !== 'Hourly').map(c => [c.matterNo||c.id, c.client, c.billing.type, fM(c.billing.totalBilled), fM(c.billing.budget)]);
      break;
    case 'r27': /* Litigation Inflow vs Outflow */
      cols = ['Month','New Filings (Inflow)','Closed (Outflow)'];
      { const fd = CASES.map(c=>new Date(c.filed).getTime()).filter(t=>!isNaN(t));
        const ref = new Date(Math.max(...fd));
        const ms = []; for (let i=11;i>=0;i--){ const d=new Date(ref.getFullYear(),ref.getMonth()-i,1); ms.push(d); }
        rows = ms.map(d => {
          const inflow = CASES.filter(c=>{ const f=new Date(c.filed); return !isNaN(f) && f.getFullYear()===d.getFullYear() && f.getMonth()===d.getMonth(); }).length;
          const outflow = CASES.filter(c=>{ if (c.status!=='Closed') return false; const cd=new Date(c.deadline); return !isNaN(cd) && cd.getFullYear()===d.getFullYear() && cd.getMonth()===d.getMonth(); }).length;
          return [d.toLocaleDateString('en-US',{month:'short',year:'numeric'}), inflow, outflow];
        }); }
      break;
    case 'r28': /* Avg Cycle Time by Claim Type */
      cols = ['Matter Type','Avg. Days to Resolution','Closed Matter Count'];
      { const ct = {};
        CASES.filter(c=>c.status==='Closed').forEach(c => { ct[c.type] = ct[c.type]||[]; ct[c.type].push(daysOpen(c)); });
        rows = Object.entries(ct).map(([t,arr]) => [t, Math.round(arr.reduce((a,b)=>a+b,0)/arr.length), arr.length]).sort((a,b)=>b[1]-a[1]); }
      break;
    case 'r29': /* Root Cause Analysis */
      cols = ['Root Cause','Matter Count','% of Portfolio'];
      { const rc = {};
        CASES.forEach(c => { const r = c.rootCause||'Other'; rc[r] = (rc[r]||0)+1; });
        rows = Object.entries(rc).sort((a,b)=>b[1]-a[1]).map(([r,n]) => [r, n, Math.round(n/CASES.length*100)+'%']); }
      break;
    case 'r30': /* Regulatory / Compliance Incidents */
      cols = ['ID','Incident','Agency','Status','Opened','Exposure Estimate','Notes'];
      rows = REGULATORY_INCIDENTS.map(r => [r.id, r.name, r.agency, r.status, r.openedDate, fM(r.exposureEstimate), r.notes||'']);
      break;
    /* ── Alert reports (share their logic with the dashboard alerts via attentionData) ── */
    case 'a0': { /* Full summary */
      cols = ['Alert','Severity','Matters / Items','Detail'];
      const un = unassignedOpenCases();
      rows = [];
      if (un.length) rows.push(['Matters need an attorney','Critical',un.length,un.slice(0,3).map(c=>c.client).join(', ')]);
      attentionData().forEach(it => rows.push([it.title, {red:'Critical',amber:'Watch',blue:'Good news'}[it.sev], it.count, String(it.detail||'').replace(/&amp;/g,'&').replace(/<[^>]*>/g,'')]));
      break; }
    case 'a1': { /* SOL early warning */
      cols = ['Matter #','Client','SOL Date','Days Left','Urgency','Atty','Reserve'];
      const it = attentionData().find(x => x.key==='sol'); const now = Date.now();
      rows = ((it && it.cases) || []).map(c => { const d = Math.ceil((new Date(c.keyDates.sol)-now)/864e5);
        return [c.matterNo||c.id, c.client, c.keyDates.sol, d, d<0?'PAST DUE':d<=30?'Critical (30 days or less)':d<=60?'Urgent (31-60 days)':'Heads-up', c.attorney||'Unassigned', fM(c.insurance.reserveAmount)]; });
      break; }
    case 'a2': {
      cols = ['Matter #','Client','Reserve','Likely Exposure','Shortfall','Reserve % of Exposure','Atty'];
      const it = attentionData().find(x => x.key==='reserve');
      rows = ((it && it.cases) || []).map(c => { const r = c.insurance.reserveAmount||0, e = c.exposure.likelyExposure;
        return [c.matterNo||c.id, c.client, fM(r), fM(e), fM(e-r), Math.round(r/e*100)+'%', c.attorney||'Unassigned']; }).sort((a,b)=>0);
      break; }
    case 'a3': {
      cols = ['Matter #','Client','Task','Due','Days Overdue','Assignee'];
      const t0 = new Date().toISOString().slice(0,10); rows = [];
      CASES.filter(c => c.status !== 'Closed').forEach(c => (c.tasks||[]).filter(t => !t.done && t.due && t.due < t0).forEach(t =>
        rows.push([c.matterNo||c.id, c.client, t.title, t.due, Math.floor((Date.now()-new Date(t.due))/864e5), t.assignee||c.attorney||'Unassigned'])));
      rows.sort((a,b)=>b[4]-a[4]);
      break; }
    case 'a4': {
      cols = ['Matter #','Client','Trial Date','Days Left','Atty','Exposure','CCI'];
      const it = attentionData().find(x => x.key==='trial');
      rows = ((it && it.cases) || []).map(c => [c.matterNo||c.id, c.client, c.keyDates.trialDate, Math.ceil((new Date(c.keyDates.trialDate)-Date.now())/864e5), c.attorney||'Unassigned', fM(c.exposure.likelyExposure||c.value), cci(c)]);
      break; }
    case 'a5': {
      cols = ['Matter #','Client','Reserve','Billed','Burn %','Remaining','Atty'];
      const it = attentionData().find(x => x.key==='burn');
      rows = ((it && it.cases) || []).map(c => { const r = c.insurance.reserveAmount, b = c.billing.totalBilled||0;
        return [c.matterNo||c.id, c.client, fM(r), fM(b), Math.round(b/r*100)+'%', fM(r-b), c.attorney||'Unassigned']; });
      rows.sort((a,b)=>parseInt(b[4])-parseInt(a[4]));
      break; }
    case 'a6': {
      cols = ['Matter #','Client','Last Activity','Days Quiet','Stage','Atty'];
      const it = attentionData().find(x => x.key==='stale');
      rows = ((it && it.cases) || []).map(c => [c.matterNo||c.id, c.client, new Date(caseLastActivity(c)).toISOString().slice(0,10), Math.floor((Date.now()-caseLastActivity(c))/864e5), c.litigationStage||c.status, c.attorney||'Unassigned']);
      break; }
    case 'a7': {
      cols = ['Matter #','Client','Stage','Days Open','Atty','Reserve'];
      const it = attentionData().find(x => x.key==='nostep');
      rows = ((it && it.cases) || []).map(c => [c.matterNo||c.id, c.client, c.litigationStage||c.status, daysOpen(c), c.attorney||'Unassigned', fM(c.insurance.reserveAmount)]);
      break; }
    case 'a8': {
      cols = ['Attorney','Open Matters','Total Reserves','Total Value','Status'];
      const m = {};
      CASES.filter(c => c.status !== 'Closed' && (c.attorney||'').trim() && c.attorney !== 'Unassigned').forEach(c => { const a = m[c.attorney] = m[c.attorney] || {n:0,res:0,val:0}; a.n++; a.res += c.insurance.reserveAmount||0; a.val += c.value||0; });
      rows = Object.entries(m).sort((a,b)=>b[1].n-a[1].n).map(([a,d]) => [a, d.n, fM(d.res), fM(d.val), d.n >= ATTN.OVERLOAD_OPEN ? 'AT CAPACITY' : d.n >= ATTN.OVERLOAD_OPEN-2 ? 'NEAR CAPACITY' : 'OK']);
      break; }
    case 'a9': {
      cols = ['Payable','Payee','Amount','Due','Status','Why it needs action'];
      const t0 = new Date().toISOString().slice(0,10);
      rows = PAYABLES.filter(p => p.status === 'Submitted' || (p.status === 'Approved' && p.dueDate && p.dueDate < t0))
        .map(p => [p.id, p.payeeName, fM(p.amount), p.dueDate||'—', p.status, p.status === 'Submitted' ? 'Awaiting approval' : 'Approved and past due — pay now']);
      break; }
    case 'a10': {
      cols = ['Matter #','Client','Disposition','Atty','Reserve'];
      const it = attentionData().find(x => x.key==='ready');
      rows = ((it && it.cases) || []).map(c => [c.matterNo||c.id, c.client, c.closing.dispositionType, c.attorney||'Unassigned', fM(c.insurance.reserveAmount)]);
      break; }
    case 'a11': {
      cols = ['Matter #','Client','Type','Value','Days Open','Filed','Priority'];
      rows = unassignedOpenCases().map(c => [c.matterNo||c.id, c.client, c.type, fM(c.value), daysOpen(c), c.filed||'—', c.priority||'—']);
      break; }
  }
  return {tmpl, rows, cols};
}

let CURRENT_REPORT_VIEW = null;
function reportPreviewModal(){
  let tmpl, rows, cols, generatedDate, aiSummary;
  const snap = S.viewingSavedId ? getSavedReport(S.viewingSavedId) : null;
  if (snap) {
    tmpl = snap; rows = snap.rows; cols = snap.cols; generatedDate = snap.generatedDate; aiSummary = snap.aiSummary;
  } else {
    const built = buildReportData(S.reportId);
    tmpl = built.tmpl; rows = built.rows; cols = built.cols; generatedDate = td(); aiSummary = '';
  }
  if (!tmpl) return '';
  CURRENT_REPORT_VIEW = {tmpl, rows, cols, generatedDate};
  let h = '<div class="modal-bg" onclick="if(event.target===this)st({showReportPreview:false})">';
  h += '<div class="modal" style="max-width:1100px;">';
  h += '<div class="modal-h">';
  h += '<div><div style="display:flex;align-items:center;gap:9px;margin-bottom:4px;"><span style="font-size:18px;color:'+tmpl.color+';">'+tmpl.icon+'</span><span class="tag" style="background:'+tmpl.color+'18;color:'+tmpl.color+';">'+tmpl.cat+'</span>'+(snap?'<span class="tag" style="background:#EEF1F7;color:var(--pri2);">Saved</span>':'')+'</div>';
  h += '<div class="serif" style="font-size:18px;font-weight:700;color:var(--ink);">'+esc(tmpl.name)+'</div>';
  h += '<div style="font-size:11px;color:var(--muted);margin-top:3px;">'+rows.length+' rows · Generated '+esc(generatedDate)+'</div></div>';
  h += '<button class="x" onclick="st({showReportPreview:false})">×</button></div>';
  h += '<div class="modal-b">';
  if (S.aiLoad) {
    h += '<div class="card" style="padding:18px;background:var(--surf2);border-left:3px solid var(--pri2);margin-bottom:14px;">';
    h += '<div style="font-size:10px;color:var(--pri2);font-weight:700;text-transform:uppercase;letter-spacing:1.3px;margin-bottom:6px;">★ Claude is analyzing this report…</div></div>';
  } else if (S.aiText || aiSummary) {
    h += '<div class="card" style="padding:18px;background:var(--surf2);border-left:3px solid var(--pri2);margin-bottom:14px;">';
    h += '<div style="font-size:10px;color:var(--pri2);font-weight:700;text-transform:uppercase;letter-spacing:1.3px;margin-bottom:9px;">★ AI Insights</div>';
    h += '<div style="font-size:12.5px;line-height:1.7;color:var(--ink);white-space:pre-wrap;">'+esc(S.aiText || aiSummary)+'</div></div>';
  }
  if (rows.length === 0) {
    h += '<div style="padding:40px;text-align:center;color:var(--muted);">No matching records.</div>';
  } else {
    h += '<div style="overflow-x:auto;border:1px solid var(--surf3);border-radius:6px;"><table>';
    h += '<thead><tr>'+cols.map(c => '<th>'+esc(c)+'</th>').join('')+'</tr></thead><tbody>';
    rows.forEach(r => {
      h += '<tr>'+r.map(v => '<td>'+esc(String(v))+'</td>').join('')+'</tr>';
    });
    h += '</tbody></table></div>';
  }
  h += '</div>';
  h += '<div class="modal-f">';
  h += '<button class="btn btn-out" onclick="exportCurrentReportCSV()">Export CSV</button>';
  h += '<button class="btn btn-out" onclick="genRptAI(\''+S.reportId+'\')">★ AI Insights</button>';
  if (S.viewingSavedId) h += '<button class="btn btn-out" style="color:var(--pri2);" onclick="openEmailModal(\''+S.viewingSavedId+'\')">✉ Email Report</button>';
  h += '<button class="btn btn-pri" onclick="st({showReportPreview:false})">Close</button>';
  h += '</div></div></div>';
  return h;
}
function exportCurrentReportCSV(){
  if (!CURRENT_REPORT_VIEW) return;
  const {tmpl, cols, rows, generatedDate} = CURRENT_REPORT_VIEW;
  downloadCSV(tmpl.name.replace(/[^a-z0-9]/gi,'_') + '_' + generatedDate + '.csv', cols, rows);
}

function exportReportCSV(rptId){
  const {tmpl, rows, cols} = buildReportData(rptId);
  if (!tmpl) return;
  downloadCSV(tmpl.name.replace(/[^a-z0-9]/gi,'_') + '_' + td() + '.csv', cols, rows);
}

/* ── EMAIL REPORT ──────────────────────────────────────────
   Two real send paths, no fake "sent!" confirmations:
   1. mailto — zero setup, opens the person's own mail client,
      always works, and downloads the CSV alongside so it can be
      attached (mailto can't attach files by spec).
   2. Server API — if the companion server.js is deployed with
      SMTP configured, POSTs to /api/reports/email for a real,
      immediate server-side send instead. Optional; blank by default. */
function openEmailModal(savedId){
  const snap = getSavedReport(savedId);
  if (!snap) return;
  const subject = 'Report: ' + snap.name + ' (' + snap.generatedDate + ')';
  const message = 'Hi,\n\nAttached is the "' + snap.name + '" report generated on ' + snap.generatedDate +
    ' (' + snap.rowCount + ' rows).\n\n' +
    (snap.aiSummary ? 'Summary:\n' + snap.aiSummary + '\n\n' : '') +
    'Full data is attached as a CSV export from Case Closed Pro.';
  st({showEmailModal:true, emailingReportId:savedId, _emailTo:S._emailTo||'', _emailSubject:subject, _emailMessage:message, emailStatus:'', emailStatusType:''});
}

function emailReportModal(){
  const snap = getSavedReport(S.emailingReportId);

  }

    h += inp('Your Name', '', 'window._acceptName=this.value', 'text', 'placeholder="Jane Doe"');

  }

async function submitAcceptInvite(){
  const name = (window._acceptName||'').trim();
  const password = window._acceptPassword || '';
  if (!name) { st({acceptInviteStatus:'Enter your name.', acceptInviteSuccess:false}); return; }
  if (!password || password.length < 8) { st({acceptInviteStatus:'Password must be at least 8 characters.', acceptInviteSuccess:false}); return; }
  st({loginLoading:true});

  if (supabaseClient) {
    try {
      // /team/accept-invite creates the account but doesn't log in by
      // itself — it has no session to hand back (it runs before one
      // exists). Sign in immediately after with the same credentials.
      const acceptData = await apiFetch('/team/accept-invite', { method:'POST', body: JSON.stringify({ token:S._inviteTokenFromUrl, name, password }) });
      const { data, error } = await supabaseClient.auth.signInWithPassword({ email: acceptData.email, password });
      if (error) throw error;
      S._inviteTokenFromUrl = '';
      await loadUserContextAfterAuth(data.session);
    } catch (e) {
      st({loginLoading:false, acceptInviteStatus:e.message, acceptInviteSuccess:false});
    }
    return;
  }
  if (API_BASE) {
    try {
      // server.js's /api/team/accept-invite returns a full session
      // directly ({token, user}) — no separate sign-in step needed.
      const data = await apiFetch('/api/team/accept-invite', { method:'POST', body: JSON.stringify({ token:S._inviteTokenFromUrl, name, password }) });
      S._inviteTokenFromUrl = '';
      completeLoginSession(data);
      await Promise.all([loadCasesFromApi(), loadMyFeatures()]);
      render();
    } catch (e) {
      st({loginLoading:false, acceptInviteStatus:e.message, acceptInviteSuccess:false});
    }
    return;
  }
  st({loginLoading:false, acceptInviteStatus:'This demo isn\'t connected to a real backend, so there\'s no invite to accept.', acceptInviteSuccess:false});
}

function sendReportMailto(){

    const r = await fetch(base + '/api/reports/email', {
      method:'POST',
      headers:{'Content-Type':'application/json', 'Authorization':'Bearer '+key},
      body: JSON.stringify({
        to, subject, message,
        reportName: snap.name,
        csv: csvFromRows(snap.cols, snap.rows),
        filename: snap.name.replace(/[^a-z0-9]/gi,'_') + '_' + snap.generatedDate + '.csv'
      })
    });
    const data = await r.json().catch(() => ({}));
    if (r.ok) st({emailStatus:'Sent to ' + to + '.', emailStatusType:'good'});
    else st({emailStatus:'Server error: ' + (data.error || r.status), emailStatusType:'bad'});
  } catch(e) {
    st({emailStatus:'Request failed: ' + e.message + ' (is the server running and CORS-enabled for this origin?)', emailStatusType:'bad'});
  }
}

/* ── INVOICE HUB / FIRM-WIDE BILLING ────────────────────── */
function invoiceHubV(){
  /* Aggregate billing data across all cases */
  let totalBilled = 0, totalPaid = 0, totalBudget = 0;
  const allInvoices = [];
  const allTimeEntries = [];
  CASES.forEach(c => {
    totalBilled += (c.billing.totalBilled||0);
    totalPaid += (c.billing.totalPaid||0);
    totalBudget += (c.billing.budget||0);
    (c.billing.invoices||[]).forEach(inv => allInvoices.push({...inv, case:c}));
    (c.billing.timeEntries||[]).forEach(te => allTimeEntries.push({...te, case:c}));
  });
  const outstanding = totalBilled - totalPaid;
  const collRate = totalBilled ? Math.round((totalPaid/totalBilled)*100) : 0;
  const arDisplay = fAR(outstanding);
  const collDisplay = fCollRate(totalPaid, totalBilled);

  /* AR aging buckets */
  const now = Date.now();
  const aging = {current:0, '30':0, '60':0, '90':0, '120':0};
  allInvoices.forEach(inv => {
    if (inv.status === 'Paid') return;
    const d = Math.floor((now - new Date(inv.date))/864e5);
    if (d <= 30) aging.current += inv.amount;
    else if (d <= 60) aging['30'] += inv.amount;
    else if (d <= 90) aging['60'] += inv.amount;
    else if (d <= 120) aging['90'] += inv.amount;
    else aging['120'] += inv.amount;
  });

  /* Top revenue cases */
  const topRev = [...CASES].sort((a,b) => (b.billing.totalBilled||0)-(a.billing.totalBilled||0)).slice(0,10);

  /* Timekeeper aggregation */
  const byAtty = {};
  ATTY.forEach(a => byAtty[a] = {hours:0, billed:0, entries:0, rate:0});
  allTimeEntries.forEach(te => {
    if (!byAtty[te.atty]) byAtty[te.atty] = {hours:0, billed:0, entries:0, rate:0};
    byAtty[te.atty].hours += (te.hours||0);
    byAtty[te.atty].billed += (te.hours||0) * (te.rate||0);
    byAtty[te.atty].entries++;
    byAtty[te.atty].rate = te.rate;
  });

  /* Budget burn flags */
  const overBudget = CASES.filter(c => c.billing.budget > 0 && c.billing.totalBilled > c.billing.budget);
  const nearBudget = CASES.filter(c => c.billing.budget > 0 && c.billing.totalBilled > c.billing.budget*0.8 && c.billing.totalBilled <= c.billing.budget);

  /* UTBMS code distribution */
  const byCode = {};
  allTimeEntries.forEach(te => {
    const code = (te.code||'').split(' - ')[0] || 'Other';
    byCode[code] = (byCode[code]||0) + (te.hours||0)*(te.rate||0);
  });
  const topCodes = Object.entries(byCode).sort((a,b) => b[1]-a[1]).slice(0,8);

  let h = '<div class="wrap">';
  h += '<div class="hero">';
  h += '<div class="hero-l"><div class="hero-eyebrow">Invoice Hub · Firm Billing</div>';
  h += '<h1 class="hero-title">Billing & Revenue Operations</h1>';
  h += '<p class="hero-sub">'+allInvoices.length+' invoices · '+allTimeEntries.length+' time entries · '+collDisplay.text+' collection rate</p></div>';
  h += '<div class="hero-r">';
  h += '<button class="btn btn-out" onclick="exportAllLEDES()">Export LEDES (All)</button>';
  h += '<button class="btn btn-pri" onclick="runBillingAI()">★ AI Billing Review</button>';
  h += '</div></div>';

  /* KPI strip */
  h += '<div class="kpi-grid">';
  h += '<div class="kpi"><div class="kpi-l">Total Billed</div><div class="kpi-v">'+fV(totalBilled)+'</div></div>';
  h += '<div class="kpi"><div class="kpi-l">Collected</div><div class="kpi-v" style="color:var(--green);">'+fV(totalPaid)+'</div></div>';
  h += '<div class="kpi"><div class="kpi-l">Outstanding AR</div><div class="kpi-v" style="color:var(--gold);">'+arDisplay.text+'</div>'+(arDisplay.note?'<div class="kpi-sub" style="color:var(--green);">'+arDisplay.note+'</div>':'')+'</div>';
  h += '<div class="kpi"><div class="kpi-l">Collection Rate</div><div class="kpi-v">'+collDisplay.text+'</div>'+(collDisplay.over?'<div class="kpi-sub" style="color:var(--green);">overpaid</div>':'')+'</div>';
  h += '<div class="kpi"><div class="kpi-l">Budget Allocated</div><div class="kpi-v">'+fV(totalBudget)+'</div></div>';
  h += '<div class="kpi"><div class="kpi-l">Over Budget</div><div class="kpi-v" style="color:var(--red);">'+overBudget.length+'</div></div>';
  h += '</div>';

  /* Row 1: AR Aging + Budget Status */
  h += '<div class="grid-2">';

  /* AR Aging */
  h += '<div class="card">';
  h += '<div class="sh"><span>Accounts Receivable Aging</span></div>';
  const totalAR = Object.values(aging).reduce((s,v)=>s+v, 0) || 1;
  const buckets = [['Current (0-30)', aging.current, 'var(--green)'],['31-60 days', aging['30'], 'var(--pri2)'],['61-90 days', aging['60'], 'var(--gold)'],['91-120 days', aging['90'], '#EA580C'],['120+ days', aging['120'], 'var(--red)']];
  buckets.forEach(([l,v,c]) => {
    const pct = (v/totalAR)*100;
    h += '<div class="bar-row"><span style="font-size:11px;color:var(--ink);min-width:115px;font-weight:500;">'+l+'</span>';

  h += '</div>';

  /* Budget Watch */
  h += '<div class="card">';

    [...overBudget, ...nearBudget].slice(0,8).forEach(c => {

  Object.entries(byAtty).filter(([,d]) => d.hours > 0).sort((a,b) => b[1].billed - a[1].billed).forEach(([a, d]) => {
    h += '<tr>';
    h += '<td style="font-weight:600;">'+esc(a)+'</td>';

    h += '<td>'+d.entries+'</td>';
    h += '<td>'+fM(d.rate)+'</td>';
    h += '<td style="color:var(--green);font-weight:700;">'+fM(d.billed)+'</td>';
    h += '</tr>';

  h += '</tbody></table></div></div>';

  h += '<div class="card">';
  h += '<div class="sh"><span>UTBMS Code Distribution</span></div>';
  if (topCodes.length === 0) {
    h += '<div style="padding:18px;text-align:center;color:var(--muted);font-size:12px;">No coded time entries yet.</div>';

      h += '<div class="bar-bg"><div class="bar-fill" style="width:'+((val/maxCode)*100)+'%;background:linear-gradient(90deg,var(--pri),var(--pri2));"></div></div>';

    ['CaseAPI.updateCase(id, patch)', 'Merge a partial update into an existing matter.', "CaseAPI.updateCase('CC-007', {insurance:{reserveAmount:160000}})"],

  h += '</tbody></table>';
  h += '</div>';

  h += '<div class="section-band">Try It — Live Console</div>';
  h += '<div class="card" style="margin-bottom:14px;">';
  h += '<div style="font-size:11px;color:var(--muted);margin-bottom:9px;">Runs against <code style="background:var(--surf3);padding:1px 5px;border-radius:4px;">window.CaseAPI</code> in this page. Try <code style="background:var(--surf3);padding:1px 5px;border-radius:4px;">CaseAPI.listCases({status:"Closed"})</code>.</div>';
  h += '<div style="display:flex;gap:8px;margin-bottom:9px;">';
  h += '<input class="inp" style="font-family:monospace;font-size:11.5px;" id="apiConsoleInput" placeholder="CaseAPI.listCases({status:\'Closed\'})" value="'+esc(S._consoleInput||'')+'" onchange="window._consoleInput=this.value"/>';
  h += '<button class="btn btn-pri" onclick="runApiConsole()">Run</button>';
  h += '</div>';
  h += '<div style="background:var(--ink);border-radius:7px;padding:12px;min-height:60px;max-height:280px;overflow:auto;"><pre style="color:#A7F3D0;font-family:monospace;font-size:10.5px;white-space:pre-wrap;margin:0;">'+esc(S._consoleOutput||'// output will appear here')+'</pre></div>';
  h += '</div>';

  /* ── REST API for external systems ── */
  h += '<div class="section-band">REST API — For External Systems</div>';
  h += '<div class="card">';
  h += '<div style="font-size:11.5px;color:var(--muted);margin-bottom:12px;line-height:1.6;">This browser-only prototype can\'t accept network calls from other systems directly — there\'s no server behind it. To let a claims system, TPA feed, or migration script push closed case history over HTTP, pair this app with the companion REST API (Node/Express) and OpenAPI spec provided alongside this file. Same data shape as the JS API above.</div>';

  const endpoints = [
    ['GET', '/api/cases', 'List matters, optional ?status=Closed filter'],
    ['GET', '/api/cases/:id', 'Fetch a single matter'],
    ['POST', '/api/cases', 'Create one matter'],
    ['POST', '/api/cases/import', 'Bulk import closed case history (array body)'],
    ['PATCH', '/api/cases/:id', 'Partially update a matter'],
    ['DELETE', '/api/cases/:id', 'Remove a matter']
  ];
  h += '<table><thead><tr><th>Method</th><th>Endpoint</th><th>Purpose</th></tr></thead><tbody>';
  endpoints.forEach(([m,e,d]) => {
    const mCol = m==='GET'?'#1D4ED8':m==='POST'?'#047857':m==='PATCH'?'#B45309':'#B91C1C';
    h += '<tr><td><span class="tag" style="background:'+mCol+'18;color:'+mCol+';font-weight:700;">'+m+'</span></td><td style="font-family:monospace;font-size:11.5px;">'+esc(e)+'</td><td style="font-size:11.5px;color:var(--muted);">'+esc(d)+'</td></tr>';
  });
  h += '</tbody></table>';
  h += '<div style="margin-top:12px;padding:10px 12px;background:var(--surf2);border-radius:7px;font-size:11px;color:var(--muted);">Full server code (<code style="background:var(--surf3);padding:1px 5px;border-radius:4px;">server.js</code>) and machine-readable spec (<code style="background:var(--surf3);padding:1px 5px;border-radius:4px;">openapi.yaml</code>) are provided as separate downloadable files.</div>';
  h += '</div>';

  h += '</div>';
  return h;
}

/* ── NEW CUSTOMER TAB (Admin) ───────────────────────────────
   Step-by-step onboarding checklist per customer, a contract and
   billing record, trials, invoice reminders and a customer health
   view. Backed by /api/admin/onboarding* in server.js. Nothing here
   charges anyone — invoices are still sent by hand; this tab just
   remembers what is owed and when. */
async function fetchOnboarding(){
  if (!API_BASE || !authToken) return;
  st({onbLoading:true, onbError:''});
  try {
    const data = await apiFetch('/api/admin/onboarding');
    st({onb:data, onbTemplates:data.templates, onbLoading:false});
  } catch (e) { st({onbError:e.message, onbLoading:false}); }
}
function onbPatchCustomer(c){
  if (!c || !S.onb) return;
  const list = S.onb.customers.map(x => x.id === c.id ? c : x);
  st({onb: Object.assign({}, S.onb, {customers:list}), onbError:''});
  fetchOnboarding(); // refresh invoice reminders too
}
async function onbStep(orgId, key, done){
  try {
    const r = await apiFetch('/api/admin/organizations/'+orgId+'/onboarding/step', {method:'POST', body: JSON.stringify({key, done})});
    onbPatchCustomer(r.customer);
  } catch (e) { st({onbError:e.message}); }
}
async function onbSaveContract(orgId, extra){
  const g = id => { const el = document.getElementById(id); return el ? el.value : undefined; };
  // Quick actions (mark invoice sent) send only that action, never the form fields of whichever customer is open.
  const body = extra ? extra : {
    signedDate: g('onb_signed'), renewalDate: g('onb_renewal'), termMonths: g('onb_term'),
    setupFee: moneyVal(g('onb_setupfee')), monthlyAmount: moneyVal(g('onb_monthly')), invoiceDay: g('onb_invday'),
    setupPaidDate: g('onb_paid'), billingNotes: g('onb_notes')
  };
  try {
    const r = await apiFetch('/api/admin/organizations/'+orgId+'/contract', {method:'POST', body: JSON.stringify(body)});
    onbPatchCustomer(r.customer);
    st({onbSaved:'Saved'}); setTimeout(()=>{ if (S.onbSaved) st({onbSaved:''}); }, 2500);
  } catch (e) { st({onbError:e.message}); }
}

const ONB_TONE = {green:['#ECFDF5','#047857'], amber:['#FFFBEB','#B45309'], red:['#FEF2F2','#B91C1C'], blue:['#EFF6FF','#1D4ED8']};
function onbBadge(h){ const t = ONB_TONE[h.tone] || ONB_TONE.blue; return '<span style="display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;background:'+t[0]+';color:'+t[1]+';">'+esc(h.label)+'</span>'; }
function onbDateLabel(d){ return d ? esc(String(d).slice(0,10)) : '—'; }
function onbAgo(days){ return days === null || days === undefined ? 'never' : days === 0 ? 'today' : days === 1 ? 'yesterday' : days + ' days ago'; }

    d.invoicesDue.forEach(i => {

    });
    h += '</div>';
  }

  // Filter + health table
  const filt = S.onbFilter || 'all';
  const all = d.customers || [];
  const attention = c => ['Stalled','At risk','Quiet','Suspended'].includes(c.health.label);

  h += '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;">';
  [['all','All ('+all.length+')'],['onboarding','Onboarding'],['live','Live'],['attention','Needs attention ('+all.filter(attention).length+')']].forEach(f => {
    h += '<button class="btn '+(filt===f[0]?'btn-pri':'btn-out')+'" style="font-size:11.5px;padding:4px 11px;" onclick="st({onbFilter:\''+f[0]+'\'})">'+f[1]+'</button>';
  });

  if (!shown.length) h += '<tr><td colspan="8" style="padding:20px;text-align:center;color:var(--dim);">No customers in this view.</td></tr>';

    h += '<td style="font-weight:700;">'+esc(c.name)+'<div style="font-size:10.5px;color:var(--dim);font-weight:500;">'+esc(c.persona==='defense'?'Defense firm':'TPA / carrier')+' · '+esc(c.planTier)+'</div></td>';

function onbDetailV(c){
  let h = '<div style="margin-top:18px;display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:14px;align-items:start;">';
  // LEFT: checklist or trial
  h += '<div class="card"><div class="sh"><span>'+esc(c.name)+'</span><span>'+onbBadge(c.health)+'</span></div>';
  h += '<div style="font-size:11.5px;color:var(--dim);margin-bottom:10px;">Owner: '+esc(c.ownerName||'—')+' · '+esc(c.ownerEmail||'no owner')+' · Template: '+esc(c.template==='custom'?'none':(S.onb.templates[c.template]||{}).label||c.template)+'</div>';
  {
    if (c.legacy) h += '<div class="alert-info" style="margin-bottom:12px;">This customer was set up before the checklist existed, so it is treated as live. You can still record its contract on the right.</div>';
    c.steps.forEach((s, i) => {
      const isCurrent = c.stage !== 'live' && c.currentStep === s.key;
      const locked = !s.done && !s.available;
      const col = s.done ? 'var(--green)' : isCurrent ? 'var(--pri2)' : 'var(--dim)';
      h += '<div style="display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--surf2);'+(locked?'opacity:.55;':'')+'">';
      h += '<div style="flex:0 0 26px;height:26px;border-radius:50%;border:2px solid '+col+';display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:'+(s.done?'#fff':col)+';background:'+(s.done?'var(--green)':'transparent')+';">'+(s.done?'&#10003;':(locked?'&#128274;':(i+1)))+'</div>';
      h += '<div style="flex:1;min-width:0;"><div style="font-weight:700;font-size:13px;">'+esc(s.label)+(s.done&&s.doneBy?'<span style="font-weight:500;color:var(--dim);font-size:10.5px;"> · marked by '+esc(s.doneBy)+'</span>':'')+(s.done&&s.auto?'<span style="font-weight:500;color:var(--dim);font-size:10.5px;"> · detected automatically</span>':'')+'</div>';
      if (!s.done) h += '<div style="font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.45;">'+(locked?'Finish the step above first.':esc(s.hint))+'</div>';
      if (isCurrent) {
        h += '<div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:8px;">';
        if (s.key === 'welcome') {
          h += '<button class="btn btn-out" style="font-size:11.5px;" onclick="onbWelcome(\''+c.id+'\')">Email welcome (no password)</button>';
          h += '<button class="btn btn-out" style="font-size:11.5px;" onclick="onbCopyWelcome(\''+c.id+'\')">Copy welcome text</button>';
        }
        if (s.key === 'contract') h += '<span style="font-size:11.5px;color:var(--dim);">Use the Contract and billing card on the right. This step completes itself when the three dates are filled in.</span>';
        else h += '<button class="btn btn-pri" style="font-size:11.5px;" onclick="onbStep(\''+c.id+'\',\''+s.key+'\',true)">'+(s.kind==='manual'?(s.key==='live'?'Go live':'Mark done'):'Mark done anyway')+'</button>';
        h += '</div>';
      }
      if (s.done && !s.auto && s.key !== 'account' && s.key !== 'contract') h += '<div style="margin-top:4px;"><span class="muted-link" style="cursor:pointer;font-size:11px;" onclick="onbStep(\''+c.id+'\',\''+s.key+'\',false)">Undo</span></div>';
      h += '</div></div>';
    });
  }
  h += '</div>';

  // RIGHT: contract and billing
  const k = c.contract;
  const field = (lbl, id, val, type, extra) => '<div class="fld"><label class="lbl">'+lbl+'</label><input id="'+id+'" type="'+(type||'text')+'" value="'+esc(val==null?'':val)+'" class="inp" '+(extra||'')+'></div>';
  h += '<div class="card"><div class="sh"><span>Contract and billing</span><span style="color:var(--dim);font-weight:500;">manual invoicing</span></div>';
  h += '<div class="grid-2">'+field('Contract signed','onb_signed',k.signedDate,'date')+field('Renewal date','onb_renewal',k.renewalDate,'date')+'</div>';
  h += '<div class="grid-2">'+field('Term (months)','onb_term',k.termMonths,'number','min="0"')+field('Invoice day of month','onb_invday',k.invoiceDay,'number','min="1" max="28"')+'</div>';
  h += '<div class="grid-2">'+field('Setup fee ($)','onb_setupfee',k.setupFee?Number(k.setupFee).toLocaleString():'')+field('Monthly amount ($)','onb_monthly',k.monthlyAmount?Number(k.monthlyAmount).toLocaleString():'')+'</div>';
  h += field('Setup fee paid on','onb_paid',k.setupPaidDate,'date');
  h += '<div class="fld"><label class="lbl">Billing notes</label><textarea id="onb_notes" class="inp" placeholder="PO number, who receives invoices, payment terms">'+esc(k.billingNotes||'')+'</textarea></div>';
  h += '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;"><button class="btn btn-pri" onclick="onbSaveContract(\''+c.id+'\')">Save</button>';
  h += '<button class="btn btn-out" onclick="onbSaveContract(\''+c.id+'\',{markSetupInvoiced:true})">'+(k.setupInvoicedDate?'Setup invoice sent '+onbDateLabel(k.setupInvoicedDate)+' (reset to today)':'Setup invoice sent today')+'</button></div>';
  if (c.nextInvoice) h += '<div style="margin-top:10px;font-size:12px;color:var(--muted);">Next monthly invoice: <strong>'+onbDateLabel(c.nextInvoice.date)+'</strong> ('+fM(c.nextInvoice.amount)+') <span class="muted-link" style="cursor:pointer;" onclick="onbSaveContract(\''+c.id+'\',{markMonthlyInvoiced:true})">Mark this month sent</span></div>';
  h += '<div style="font-size:10.5px;color:var(--dim);margin-top:10px;line-height:1.5;">Nothing is charged from here. Amounts are copied from the setup form and only drive reminders. Saving the renewal date also updates the Retention tab.</div>';
  h += '</div></div>';
  return h;
}

async function setRenewalDate(orgId, currentDate){
  const input = prompt('Renewal date for this organization (YYYY-MM-DD), or leave blank to clear it:', currentDate || '');
  if (input === null) return; // cancelled
  const trimmed = input.trim();
  if (trimmed && !/^\d{4}-\d{2}-\d{2}$/.test(trimmed)) { alert('Please enter a date as YYYY-MM-DD, e.g. 2026-12-31.'); return; }
  try {
    await apiFetch('/api/admin/organizations/'+orgId+'/renewal-date', {
      method: 'POST', body: JSON.stringify({ renewalDate: trimmed || null })
    });
    await fetchRetention();
  } catch (e) {
    alert('Could not save renewal date: ' + e.message);
  }
}

// Error tracking viewer — the admin-side counterpart to
// reportClientError() and the server's global error handler, both of
// which write to error_log. Defaults to unresolved-only so the first
// thing a platform admin sees is "what's actually still broken."
async function fetchErrors(filters){
  st({errorLogLoading:true, errorLogError:''});
  try {
    const f = filters !== undefined ? filters : (S.errorLogFilters || {resolved:'false'});
    const params = new URLSearchParams();
    if (f.source) params.set('source', f.source);
    if (f.resolved !== undefined && f.resolved !== '') params.set('resolved', f.resolved);
    params.set('limit', '150');
    const data = await apiFetch('/api/admin/errors?' + params.toString());
    st({errorLogEntries:data.errors, errorLogUnresolvedCount:data.unresolvedCount, errorLogLoading:false, errorLogFilters:f});
  } catch (e) {
    st({errorLogError:e.message, errorLogLoading:false});
  }
}
async function resolveError(id){
  try {
    await apiFetch('/api/admin/errors/'+id+'/resolve', { method:'POST' });
    await fetchErrors();
  } catch (e) {
    alert('Could not mark resolved: ' + e.message);
  }
}

async function suspendOrg(id, name){
  if (!confirm('Suspend access for "'+name+'"? Every user at this organization will be locked out immediately until you reactivate it.')) return;
  try {
    await apiFetch('/api/admin/organizations/'+id+'/suspend', { method:'POST' });
    await fetchAdminOrgs();
  } catch (e) {
    alert('Could not suspend: ' + e.message);
  }
}
async function activateOrg(id, name){
  try {
    // Reactivating a suspended org doesn't need owner info again —
    // the backend already knows. Only first-time activation (from
    // pending_activation) needs it, so we only ask if the backend
    // actually requires it.
    const org = (S.adminOrgs||[]).find(o => o.id === id);
    let body = {};
    if (org && org.accessStatus === 'pending_activation') {
      const ownerEmail = prompt('Owner email for '+(name||'this organization')+' — this creates their login. Confirm accounting has received the implementation fee before continuing:');
      if (!ownerEmail) return;
      const ownerName = prompt('Owner name (optional):') || '';
      body = { ownerEmail, ownerName };
    }
    const result = await apiFetch('/api/admin/organizations/'+id+'/activate', { method:'POST', body: JSON.stringify(body) });
    if (result.apiKey) {
      st({activateOrgResult: result});
    }
    await fetchAdminOrgs();
  } catch (e) {
    alert('Could not activate: ' + e.message);
  }
}

/* ── SENTINEL HEALTH CHECK ─────────────────────────────────
   A paid, pre-sales diagnostic your team runs FOR a prospect, on
   their real open caseload — not a self-serve prospect-facing
   flow. Collect the prospect's open matters as a CSV (their own
   export, reshaped to the template below), paste it in here, and
   this creates a dedicated isolated org, imports the matters with
   their real status, and runs the same risk-signal engine +
   Sentinel Watch AI brief a paying customer would see on their own
   book. See the matching /api/admin/sentinel-health-check route in
   server.js for why this deliberately uses OPEN cases, never closed
   ones with an already-known outcome. */
const HEALTH_CHECK_CSV_HEADERS = ['Client','Type','Status','Attorney','Carrier','ClaimNo','Filed','SOL','Value','Reserve','Demand','Offer','LastActivity','TotalBilled'];
// One clean example row only — anything else here would risk being
// parsed as a real matter if someone forgets to delete it before
// sending the CSV back. Column notes live in the modal's own copy
// instead, not in the file.
const HEALTH_CHECK_CSV_TEMPLATE = HEALTH_CHECK_CSV_HEADERS.join(',') + '\n' +
  'Acme Manufacturing Co,Contract Dispute,Active,,Zurich,CLM-2025-1234,2025-03-01,2027-03-01,1200000,450000,1500000,300000,2025-09-15,18500\n';

/* Upload a .csv instead of pasting it. Reads the file in the browser (nothing is sent anywhere until
   you run the check or import) and drops its text into the box so it can still be reviewed and edited. */
function loadCsvFile(source, stateKey){
  const file = source && (source.files ? source.files[0] : source);
  if (!file) return;
  if (!/\.csv$|\.txt$/i.test(file.name) && file.type && !/csv|text\/plain/.test(file.type)) {
    alert('Please choose a CSV file. In Excel use File > Save As > CSV (Comma delimited).'); return;
  }
  if (file.size > 5 * 1024 * 1024) { alert('That file is over 5 MB. Split it into smaller files and run them one at a time.'); return; }
  const r = new FileReader();
  r.onload = () => {
    const text = String(r.result || '').replace(/^\uFEFF/, '');
    st({[stateKey]: text, healthCheckError:'', openImportError:'', csvFileName: file.name});
  };
  r.onerror = () => alert('Could not read that file.');
  r.readAsText(file);
  if (source && source.value !== undefined) source.value = ''; // allow choosing the same file again
}
function csvDropHandler(ev, stateKey){
  ev.preventDefault();
  const f = ev.dataTransfer && ev.dataTransfer.files && ev.dataTransfer.files[0];
  if (f) loadCsvFile(f, stateKey);
}
function csvUploadButtonV(stateKey){
  return '<label class="btn btn-out" style="cursor:pointer;margin:0 8px 10px 0;">⬆ Upload CSV file<input type="file" accept=".csv,.txt,text/csv" style="display:none" onchange="loadCsvFile(this,\''+stateKey+'\')"></label>'+
    (S.csvFileName ? '<span style="font-size:11px;color:var(--dim);">Loaded: '+esc(S.csvFileName)+'</span>' : '');

// Minimal CSV line splitter — handles quoted fields containing commas
// (e.g. "Acme, Inc."), which a naive split(',') would break on.
function splitCsvLine(line){
  const out = []; let cur = '', inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (inQuotes) {
      if (ch === '"' && line[i+1] === '"') { cur += '"'; i++; }
      else if (ch === '"') { inQuotes = false; }
      else cur += ch;
    } else {
      if (ch === '"') inQuotes = true;
      else if (ch === ',') { out.push(cur); cur = ''; }
      else cur += ch;
    }
  }
  out.push(cur);
  return out.map(s => s.trim());
}

// Header-driven, case-insensitive — so reordering columns in Excel
// (which people always do) doesn't silently misalign the data.
function parseHealthCheckCSV(text){
  const lines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l.length);
  if (lines.length < 2) throw new Error('CSV needs a header row plus at least one matter.');
  const headers = splitCsvLine(lines[0]).map(h => h.toLowerCase());
  const col = name => headers.indexOf(name.toLowerCase());
  const idx = {
    client: col('Client'), type: col('Type'), status: col('Status'), attorney: col('Attorney'),
    carrier: col('Carrier'), claimNo: col('ClaimNo'), filed: col('Filed'), sol: col('SOL'),
    value: col('Value'), reserve: col('Reserve'), demand: col('Demand'), offer: col('Offer'),
    lastActivity: col('LastActivity'), totalBilled: col('TotalBilled')
  };
  if (idx.client === -1) throw new Error('CSV is missing a required "Client" column. Download the template to see the expected format.');
  const num = v => { const n = parseFloat(String(v||'').replace(/[^0-9.-]/g,'')); return isNaN(n) ? 0 : n; };

  const rows = [];
  for (let i = 1; i < lines.length; i++) {
    const cells = splitCsvLine(lines[i]);
    const client = idx.client >= 0 ? cells[idx.client] : '';
    if (!client) continue; // skip blank/example rows
    const filed = idx.filed >= 0 ? cells[idx.filed] : '';
    const sol = idx.sol >= 0 ? cells[idx.sol] : '';
    const lastActivity = (idx.lastActivity >= 0 && cells[idx.lastActivity]) ? cells[idx.lastActivity] : filed;
    rows.push({
      client,
      type: (idx.type >= 0 && cells[idx.type]) || 'Other',
      status: (idx.status >= 0 && cells[idx.status]) || 'Active',
      litigationStage: 'Active',
      attorney: idx.attorney >= 0 ? cells[idx.attorney] : '',
      carrier: idx.carrier >= 0 ? cells[idx.carrier] : '',
      claimNo: idx.claimNo >= 0 ? cells[idx.claimNo] : '',
      filed: filed || null,
      deadline: sol || null,
      value: idx.value >= 0 ? num(cells[idx.value]) : 0,
      reserveAmount: idx.reserve >= 0 ? num(cells[idx.reserve]) : 0,
      data: {
        exposure: {
          demandAmount: idx.demand >= 0 ? num(cells[idx.demand]) : 0,
          offerAmount: idx.offer >= 0 ? num(cells[idx.offer]) : 0,
          reserveAmount: idx.reserve >= 0 ? num(cells[idx.reserve]) : 0
        },
        keyDates: { sol: sol || '' },
        billing: { totalBilled: idx.totalBilled >= 0 ? num(cells[idx.totalBilled]) : 0 },
        updates: lastActivity ? [{ date: lastActivity, author: 'Import', type: 'Last Known Activity', text: 'Most recent activity date from prospect\'s source data.' }] : []
      }
    });
  }
  if (!rows.length) throw new Error('No matters found in that CSV — check that rows have a value in the Client column.');
  return rows;
}

// Generic CSV export — client-side only, no backend round trip
// needed since the data driving these exports (org list, a
// particular org's user list) is already loaded into state by the
// time someone clicks the button.
function downloadCSV(filename, rows){
  if (!rows || rows.length === 0) { alert('Nothing to export.'); return; }
  const headers = Object.keys(rows[0]);
  const escCell = v => {
    const s = v === null || v === undefined ? '' : String(v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
  };
  const lines = [headers.join(',')].concat(rows.map(r => headers.map(h => escCell(r[h])).join(',')));
  const blob = new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

let _impersonationTimer = null;
async function startImpersonation(orgId, orgName, userId, userEmail, userName, readOnly){
  const modeLabel = readOnly ? 'View (read-only)' : 'View as';
  const explain = readOnly
    ? 'You\'ll see exactly what they see, but every save/create/delete action will be blocked by the server — this is for looking, not acting.'
    : 'Every action you take will be logged to the audit trail as an impersonation action.';
  if (!confirm(modeLabel+' '+(userName||userEmail)+' at '+orgName+'?\n\n'+explain+' The session automatically ends after 20 minutes.')) return;
  try {
    const result = await apiFetch('/api/admin/organizations/'+orgId+'/impersonate', {
      method: 'POST',
      body: JSON.stringify(Object.assign({}, userId ? { userId } : {}, readOnly ? { readOnly: true } : {}))
    });
    const adminToken = authToken;
    const adminUser = S.currentUser;
    authToken = result.token;
    S.currentUser = {
      name: result.user.name, email: result.user.email, persona: null,
      orgId: result.organization.id, role: result.user.role, platformAdmin: false
    };
    S.impersonation = {
      active: true, orgId: result.organization.id, orgName: result.organization.name,
      userEmail: result.user.email, userName: result.user.name, expiresAt: result.expiresAt,
      readOnly: !!result.readOnly, adminToken, adminUser
    };
    CASES.length = 0;
    await loadCasesFromApi();
    if (_impersonationTimer) clearInterval(_impersonationTimer);
    _impersonationTimer = setInterval(() => {
      if (!S.impersonation?.active) { clearInterval(_impersonationTimer); return; }
      if (new Date(S.impersonation.expiresAt).getTime() <= Date.now()) { endImpersonation(true); return; }
      render();
    }, 15000);
    st({ role: 'litigation', showManageUsersModal: false, caseId: null, showWelcome: false });
  } catch (e) {
    alert('Could not start "View as" session: ' + e.message);
  }
}
async function endImpersonation(expired){
  const im = S.impersonation;
  if (!im) return;
  try { await apiFetch('/api/admin/impersonate/end', { method: 'POST' }); } catch (e) { /* best-effort */ }
  if (_impersonationTimer) { clearInterval(_impersonationTimer); _impersonationTimer = null; }
  authToken = im.adminToken;
  S.currentUser = im.adminUser;
  S.impersonation = null;
  st({ role: 'admin', adminTab: 'orgs', caseId: null, showWelcome: false });

}

/* ── window.CaseAPI — public data API ─────────────────────
   Kept intentionally close to the REST API's shape so the two
   stay interchangeable: a record accepted by CaseAPI.addClosedCase
   is also valid as a POST /api/cases body.                    */
window.CaseAPI = {
  listCases(filters){
    filters = filters || {};
    return CASES.filter(c =>
      (!filters.status || c.status === filters.status) &&
      (!filters.attorney || c.attorney === filters.attorney) &&
      (!filters.carrier || c.insurance.carrier === filters.carrier)
    );
  },
  getCase(id){
    return CASES.find(c => c.id === id || c.matterNo === id) || null;
  },
  getClosingSummary(id){
    const c = CaseAPI.getCase(id);
    if (!c) throw new Error('No case found for id: ' + id);
    return buildClosingSummaryText(c);
  },
  addClosedCase(record){
    const created = normalizeImportRecord(record);
    CASES.push(created);
    render();
    return created;
  },
  importClosedCases(records){
    // Kept for the documented browser-console / scripted-automation
    // use case (see the "In-App JS API" reference panel), where a
    // synchronous return value matters more than a guaranteed server
    // save. It updates local state immediately and best-effort syncs
    // to the server in the background — if that background save
    // fails, it's only logged to the console, not shown to whoever's
    // driving the console. The customer-facing "Import Closed Case
    // History" panel does NOT use this method anymore (see runImport
    // above) — it calls POST /api/cases/import directly and waits for
    // the real result, so what the customer sees always matches what
    // actually got saved.
    if (!Array.isArray(records)) throw new Error('importClosedCases expects an array of records');
    const created = records.map(r => normalizeImportRecord(r));
    CASES.push(...created);
    render();
    if (API_BASE) {
      apiFetch('/api/cases/import', { method:'POST', body: JSON.stringify(records) })
        .then(res => console.log('Server-side import: ' + res.imported + ' saved, ' + res.failed + ' failed'))
        .catch(e => console.error('Background import sync failed:', e.message));
    }
    return created;
  },
  updateCase(id, patch){
    const c = CaseAPI.getCase(id);
    if (!c) throw new Error('No case found for id: ' + id);
    deepMerge(c, patch);
    sc(c);
    render();
    return c;
  },
  deleteCase(id){
    const idx = CASES.findIndex(c => c.id === id || c.matterNo === id);
    if (idx === -1) return false;
    CASES.splice(idx, 1);
    render();
    return true;
  },
  exportCases(status){
    const rows = status ? CASES.filter(c => c.status === status) : CASES;
    return JSON.stringify(rows, null, 2);
  }
};

function deepMerge(target, patch){
  Object.keys(patch||{}).forEach(k => {
    if (patch[k] && typeof patch[k] === 'object' && !Array.isArray(patch[k]) && target[k] && typeof target[k] === 'object') {
      deepMerge(target[k], patch[k]);
    } else {
      target[k] = patch[k];
    }
  });
  return target;
}

/* Turn a loosely-shaped imported record into a full matter object
   using the same defaults as mkC(), then layer the caller's fields
   on top. Always forces status to Closed since this path exists
   specifically for closed case history. */
function normalizeImportRecord(r){
  r = r || {};
  const nextNum = CASES.length + 1;
  const id = r.id || ('CC-' + String(nextNum).padStart(3,'0') + '-H');
  const base = mkC(
    id,
    r.client || 'Unknown Client',
    r.type || 'Other',
    'Closed',
    r.priority || 'Low',
    r.attorney || ATTY[0],
    r.filed || r.openedDate || td(),
    r.deadline || r.closedDate || td(),
    r.value || r.exposure && r.exposure.likelyExposure || 0,
    100,
    r.claimNo || '',
    r.carrier || '',
    r.reserveAmount || (r.insurance && r.insurance.reserveAmount) || 0,
    r.adjuster || ''
  );
  base.litigationStage = 'Closed';
  base.matterNo = r.matterNo || base.matterNo;
  if (r.settlementAmount != null) base.exposure.settlementAmount = r.settlementAmount;
  if (r.demandAmount != null) base.exposure.demandAmount = r.demandAmount;
  base.updates.push({date: td(), author: 'Import', type: 'Case Opened', text: 'Historical closed case imported via API/bulk import.'});
  /* allow full nested overrides (insurance, exposure, court, keyDates, parties, etc.) */
  ['insurance','exposure','court','opposing','keyDates','contacts','billing','parties'].forEach(k => {
    if (r[k]) deepMerge(base[k], r[k]);
  });
  return base;
}

/* ── UI wiring for the Import panel ─────────────────────────
   Status is stored in app state (S.importMsg / S.importMsgType)
   rather than written directly to a DOM node, because render()
   replaces #app's innerHTML wholesale — a raw node reference
   grabbed before a re-render goes stale and silently no-ops. */
function handleImportFile(input){
  const file = input.files && input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    window._importJSON = e.target.result;
    st({_importJSON: e.target.result, importMsg:'File loaded — review below, then click Import.', importMsgType:'info'});
  };
  reader.readAsText(file);
}

// Calls the real backend (POST /api/cases/import) directly and waits
// for its actual result before telling the customer anything
// succeeded. Replaces an older version that pushed records straight
// into the browser's local CASES array and reported that local push
// as success, with the real save to the database happening as a
// silent, fire-and-forget background call — any row that failed
// server-side (bad data, etc.) would look imported in the moment,
// then quietly vanish on the next page load with no explanation ever
// shown to the customer. CaseAPI.importClosedCases (the documented
// console/API method) is unchanged and still available for scripted
// use; this UI button now talks to the server directly instead.
async function runImport(){
  const raw = window._importJSON || S._importJSON || '';
  let records;
  try {
    records = JSON.parse(raw);
  } catch (e) {
    st({importMsg:'Invalid JSON: ' + e.message, importMsgType:'bad'});
    return;
  }
  if (!Array.isArray(records) || records.length === 0) {
    st({importMsg:'Expected a non-empty JSON array of case records.', importMsgType:'bad'});
    return;
  }
  st({importMsg:'Importing…', importMsgType:'info', importLoading:true});
  try {
    const data = await apiFetch('/api/cases/import', { method:'POST', body: JSON.stringify(records) });
    if (data.imported > 0) await loadCasesFromApi();
    window._importJSON = '';
    let msg = 'Imported ' + data.imported + ' closed case' + (data.imported===1?'':'s') + '.';
    let msgType = 'good';
    if (data.failed) {
      msg += ' ' + data.failed + ' row' + (data.failed===1?'':'s') + ' skipped: ' + data.errors.map(e=>'#'+(e.index+1)+' ('+e.error+')').join(', ');
      msgType = data.imported > 0 ? 'info' : 'bad';
    }
    st({_importJSON:'', importMsg:msg, importMsgType:msgType, importLoading:false});
  } catch (e) {
    st({importMsg:'Import failed — nothing was saved: ' + e.message, importMsgType:'bad', importLoading:false});
  }
}

async function submitOpenCaseImport(){
  const csvText = (document.getElementById('openImportCsv')||{}).value || '';

  } catch (e) {
    st({openImportError:e.message});

  st({openImportLoading:true, openImportError:''});

    const data = await apiFetch('/api/cases/import-open', { method:'POST', body: JSON.stringify(cases) });

    st({openImportLoading:false, openImportResult:data});
  } catch (e) {
    st({openImportLoading:false, openImportError:e.message});
  }
}

  h += '<div class="card" style="background:var(--surf2);border-left:3px solid var(--pri2);margin-bottom:14px;">';

    h += '<div style="font-size:12px;color:var(--muted);">Set a Filed date to see suggested downstream deadlines here.</div>';

    calEst.forEach(e => {
      h += '<div style="font-size:11.5px;'+(e.alreadySet?'opacity:.45;':'')+'"><span style="color:var(--muted);">'+e.label+':</span> <strong style="color:'+(e.alreadySet?'var(--dim)':'var(--pri2)')+';">'+esc(e.suggestedDate)+'</strong>'+(e.alreadySet?' <span style="font-size:9.5px;">(already set)</span>':'')+'</div>';

    h += '</div>';
    if (blanks.length > 0) {
      h += '<button class="btn btn-out" onclick="applyLitigationCalendarEstimate(\''+c.id+'\')">Fill '+blanks.length+' Empty Date'+(blanks.length!==1?'s':'')+' With These Estimates</button>';
    } else {
      h += '<div style="font-size:11px;color:var(--green);">✓ All calendar dates already set — nothing to fill.</div>';
    }
  }
  h += '<div style="font-size:10px;color:var(--dim);margin-top:9px;line-height:1.5;">General civil-litigation timeline defaults, not jurisdiction-specific — actual scheduling orders vary by judge and court. Never overwrites a date already entered. Confirm every deadline against the real scheduling order.</div>';

  h += '<div>'+inp('Pretrial Conf', c.keyDates.pretrialConf, 'un(\'keyDates\',\'pretrialConf\',this.value)','date')+'</div>';
  h += '<div>'+inp('Mediation Date', c.keyDates.mediationDate, 'un(\'keyDates\',\'mediationDate\',this.value)','date')+'</div>';
  h += '</div>';
  h += '<div class="grid-2">';
  h += '<div>'+inp('Trial Date', c.keyDates.trialDate, 'un(\'keyDates\',\'trialDate\',this.value)','date')+'</div>';
  h += '<div>'+inp('Settlement Conference', c.keyDates.settlementConf, 'un(\'keyDates\',\'settlementConf\',this.value)','date')+'</div>';
  h += '</div>';
  return h;
}
