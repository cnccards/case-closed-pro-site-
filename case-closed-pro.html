  h += '<th style="padding:10px;text-align:left;font-size:12px;color:var(--muted);font-weight:700;">Matter</th>';
  h += '<th style="padding:10px;text-align:left;font-size:12px;color:var(--muted);font-weight:700;">Client</th>';
  h += '<th style="padding:10px;text-align:left;font-size:12px;color:var(--muted);font-weight:700;">Type</th>';
  h += '<th style="padding:10px;text-align:left;font-size:12px;color:var(--muted);font-weight:700;">Status</th>';
  h += '<th style="padding:10px;text-align:left;font-size:12px;color:var(--muted);font-weight:700;">Attorney</th>';
  h += '<th style="padding:10px;text-align:left;font-size:12px;color:var(--muted);font-weight:700;">Value</th>';
  h += '<th style="padding:10px;text-align:left;font-size:12px;color:var(--muted);font-weight:700;">Reserve</th>';
  h += '<th style="padding:10px;text-align:left;font-size:12px;color:var(--muted);font-weight:700;">Exposure</th>';
  h += '<th style="padding:10px;text-align:left;font-size:12px;color:var(--muted);font-weight:700;">CCI</th>';
  h += '<th style="padding:10px;text-align:center;font-size:12px;color:var(--muted);font-weight:700;">Action</th>';
  h += '</tr></thead><tbody>';
  
  filteredCases.forEach(c => {
    const idx = cci(c);
    h += '<tr style="border-bottom:1px solid var(--line);hover:background-color:var(--surf2);">';
    h += '<td style="padding:10px;font-weight:700;color:var(--pri2);">'+esc(c.matterNo||c.id)+'</td>';
    h += '<td style="padding:10px;">'+esc(c.client)+'</td>';
    h += '<td style="padding:10px;font-size:11px;color:var(--muted);">'+esc(c.type)+'</td>';
    h += '<td style="padding:10px;font-size:11px;">'+esc(c.status)+'</td>';
    h += '<td style="padding:10px;font-size:11px;">'+esc(c.attorney)+'</td>';
    h += '<td style="padding:10px;color:var(--gold);">'+fV(c.value)+'</td>';
    h += '<td style="padding:10px;color:var(--gold);">'+fM(c.insurance.reserveAmount||0)+'</td>';
    h += '<td style="padding:10px;color:var(--red);">'+fV(c.exposure.likelyExposure||0)+'</td>';
    h += '<td style="padding:10px;"><span class="cci-pill" style="background:'+cciColor(idx)+'22;color:'+cciColor(idx)+';padding:2px 6px;border-radius:3px;">'+idx+'</span></td>';
    h += '<td style="padding:10px;text-align:center;"><button onclick="stCase(\''+c.id+'\')" class="btn btn-pri" style="font-size:10px;padding:4px 8px;">View</button></td>';
    h += '</tr>';
  });
  
  h += '</tbody></table></div>';
  h += '</div>';
  return h;
}

function litigationDashV(){
  /* Check if showing drill-down view */
  if (S.showDrill) return drillDownV();

  if (S.showAssignCases) return assignCasesV();

  const totBl = CASES.reduce((s,c) => s + (c.billing.totalBilled||0), 0);
  const totPd = CASES.reduce((s,c) => s + (c.billing.totalPaid||0), 0);

  /* Top opposing law firms (open cases) */
  const lawFirmCounts = {};
  open.forEach(c => {
    const f = c.opposing.counselFirm || 'Unassigned';
    lawFirmCounts[f] = (lawFirmCounts[f] || 0) + 1;
  });
  const topLawFirms = Object.entries(lawFirmCounts).sort((a,b) => b[1]-a[1]).slice(0,8);
  const lawFirmTotal = topLawFirms.reduce((s,[,n]) => s+n, 0);

  /* Top plaintiff firms by avg settlement */
  const plaintiffStats = {};
  CASES.forEach(c => {
    const f = c.opposing.counselFirm;
    if (!f) return;
    if (!plaintiffStats[f]) plaintiffStats[f] = {firm:f, total:0, count:0};
    const settle = c.settlements && c.settlements.length ? c.settlements[0].offer : 0;
    if (settle > 0) {
      plaintiffStats[f].total += settle;
      plaintiffStats[f].count++;
    }
  });
  const topPlaintiff = Object.values(plaintiffStats).filter(p => p.count > 0)
    .map(p => ({...p, avg: Math.round(p.total/p.count)}))
    .sort((a,b) => b.avg-a.avg).slice(0,5);
  const maxAvg = topPlaintiff.length ? Math.max(...topPlaintiff.map(p=>p.avg)) : 1;

  /* Upcoming mediation & trial */
  const next90 = new Date(Date.now() + 90*864e5);
  const upcomingMed = CASES.filter(c => c.keyDates.mediationDate && new Date(c.keyDates.mediationDate) <= next90 && new Date(c.keyDates.mediationDate) >= new Date()).length;
  const upcomingTrial = CASES.filter(c => c.keyDates.trialDate && new Date(c.keyDates.trialDate) <= next90 && new Date(c.keyDates.trialDate) >= new Date()).length;

  /* Closed case data */
  const closedFees = closed.length ? Math.round(closed.reduce((s,c) => s + (c.billing.totalBilled||0), 0) / closed.length) : 0;
  const closedSettle = closed.length ? Math.round(closed.reduce((s,c) => s + (c.exposure.settlementAmount||0), 0) / closed.length) : 0;
  const closedDur = closed.length ? Math.round(closed.reduce((s,c) => s + daysOpen(c), 0) / closed.length) : 0;

  /* Settlement standouts: aggregate counts */
  const allSettlements = CASES.flatMap(c => c.settlements || []);

  const totalOffers = allSettlements.filter(s => s.offer > 0).length;

  h += '<div style="overflow-x:auto;"><table>';

  open.forEach(c => {
    const idx = cci(c);
    h += '<tr class="row-link" onclick="stCase(\''+c.id+'\')">';
    h += '<td style="color:var(--pri2);font-weight:700;">'+esc(c.matterNo || c.id)+'</td>';

    h += '<td style="color:var(--red);">'+fV(c.exposure.likelyExposure||c.value)+'</td>';

    h += '<td style="font-size:10px;color:'+solCol+';">'+(c.keyDates.sol||'—')+'</td>';
    h += '<td style="font-size:11px;">'+esc(c.attorney)+'</td>';

  });
  h += '</tbody></table></div>';
  h += '</div>';

  h += '</div>';
  return h;
}

/* ── TPA / CARRIER VIEW ────────────────────────────────── */
/* ── ACCOUNT EXECUTIVE — "My Clients" & account health ────────
   Each carrier/client is assigned round-robin to one of these AEs
   for demo purposes (no real AE-assignment field exists yet on
   carriers — this is the same simulate-a-real-field pattern used
   elsewhere for demo data). Swap the selector for a real logged-in
   AE identity once accounts carry a real owner field. ── */
const ACCOUNT_EXECS = ['Alex Rivera','Morgan Lee','Taylor Kim'];
function aeForCarrier(carrierName){
  // Deterministic assignment from the carrier name itself, so the
  // same carrier always maps to the same AE across renders.
  let hash = 0;
  for (let i=0;i<carrierName.length;i++) hash = (hash*31 + carrierName.charCodeAt(i)) >>> 0;
  return ACCOUNT_EXECS[hash % ACCOUNT_EXECS.length];
}
let CARRIER_INDEX_CACHE = null;

function tpaV(){
  const carriers = {};
  CASES.forEach(c => {
    const ca = c.insurance.carrier || 'Self-Insured';
    if (!carriers[ca]) carriers[ca] = {cases:[], reserve:0, billed:0, paid:0};
    carriers[ca].cases.push(c);
    carriers[ca].reserve += c.insurance.reserveAmount || 0;
    carriers[ca].billed += c.billing.totalBilled || 0;
    carriers[ca].paid += c.billing.totalPaid || 0;
  });
  CARRIER_INDEX_CACHE = carriers;

  const selectedAE = S.selectedAE || ACCOUNT_EXECS[0];
  const myCarrierNames = Object.keys(carriers).filter(name => aeForCarrier(name) === selectedAE);
  const carrierList = myCarrierNames.map(name => [name, carriers[name]]).sort((a,b) => b[1].reserve - a[1].reserve);
  const totalCases = carrierList.reduce((s,[,d])=>s+d.cases.length, 0);
  const totalReserves = carrierList.reduce((s,[,d])=>s+d.reserve, 0);
  const totalBilled = carrierList.reduce((s,[,d])=>s+d.billed, 0);
  const healthyCount = carrierList.filter(([,d]) => {
    const burn = d.reserve ? (d.billed/d.reserve)*100 : 0;
    const avgIdx = d.cases.length ? d.cases.reduce((s,c)=>s+cci(c),0)/d.cases.length : 50;
    return !(burn > 70 || avgIdx < 50);
  }).length;

  let h = '<div class="wrap">';
  h += '<div class="hero">';
  h += '<div class="hero-l"><div class="hero-eyebrow">Account Executive · My Clients</div>';
  h += '<h1 class="hero-title">'+esc(selectedAE)+'\'s Book of Business</h1>';
  h += '<p class="hero-sub">'+carrierList.length+' client'+(carrierList.length!==1?'s':'')+' · '+totalCases+' matters · '+fM(totalReserves)+' reserves under management</p></div>';
  h += '<div class="hero-r">'+sel('', 'st({selectedAE:this.value})', ACCOUNT_EXECS, selectedAE)+'</div>';
  h += '</div>';

  h += '<div class="kpi-grid">';
  h += '<div class="kpi"><div class="kpi-l">My Clients</div><div class="kpi-v">'+carrierList.length+'</div></div>';
  h += '<div class="kpi"><div class="kpi-l">Total Reserves</div><div class="kpi-v" style="color:var(--gold);">'+fV(totalReserves)+'</div></div>';
  h += '<div class="kpi"><div class="kpi-l">Billed YTD</div><div class="kpi-v">'+fV(totalBilled)+'</div></div>';
  h += '<div class="kpi"><div class="kpi-l">Healthy Accounts</div><div class="kpi-v" style="color:'+(healthyCount===carrierList.length?'var(--green)':'var(--gold)')+';">'+healthyCount+' / '+carrierList.length+'</div></div>';
  h += '</div>';

  /* Reserve Adequacy Table — scoped to this AE's clients only */
  h += '<div class="card">';
  h += '<div class="sh"><span>My Client Accounts — Health at a Glance</span></div>';
  if (carrierList.length === 0) {
    h += '<div style="padding:18px;color:var(--muted);font-size:12px;text-align:center;">No clients assigned to '+esc(selectedAE)+' in this demo data.</div>';
  } else {
  h += '<div style="overflow-x:auto;"><table>';
  h += '<thead><tr><th>Client</th><th>Matters</th><th>Total Reserves</th><th>Billed</th><th>Paid</th><th>Burn %</th><th>Avg CCI</th><th>Account Health</th></tr></thead><tbody>';
  carrierList.forEach(([name, data]) => {
    const burn = data.reserve ? Math.round((data.billed/data.reserve)*100) : 0;
    const avgIdx = Math.round(data.cases.reduce((s,c)=>s+cci(c),0)/data.cases.length);
    const burnCol = burn > 70 ? 'var(--red)' : burn > 50 ? 'var(--gold)' : 'var(--green)';
    const risk = burn > 70 || avgIdx < 50 ? '⚠ Needs Attention' : burn > 50 ? '◐ Monitor' : '✓ Healthy';
    const riskCol = risk.includes('Attention') ? 'var(--red)' : risk.includes('Monitor') ? 'var(--gold)' : 'var(--green)';
    h += '<tr>';
    h += '<td style="font-weight:700;color:var(--gold);">'+esc(name)+'</td>';
    h += '<td style="font-weight:600;">'+data.cases.length+'</td>';
    h += '<td>'+fV(data.reserve)+'</td>';
    h += '<td>'+fV(data.billed)+'</td>';
    h += '<td>'+fV(data.paid)+'</td>';
    h += '<td style="color:'+burnCol+';font-weight:700;">'+burn+'%</td>';
    h += '<td><span class="cci-pill" style="background:'+cciColor(avgIdx)+'22;color:'+cciColor(avgIdx)+';">'+avgIdx+'</span></td>';
    h += '<td style="color:'+riskCol+';font-weight:600;font-size:11px;">'+risk+'</td>';
    h += '</tr>';
  });
  h += '</tbody></table></div>';
  }
  h += '</div>';

  /* SOL Tracker — scoped to my clients */
  const myCases = carrierList.flatMap(([,d]) => d.cases);
  h += '<div class="card">';
  h += '<div class="sh"><span>SOL Watch — My Clients</span></div>';
  const solCases = myCases.filter(c => c.keyDates.sol).sort((a,b) => new Date(a.keyDates.sol) - new Date(b.keyDates.sol));
  if (solCases.length === 0) {
    h += '<div style="padding:18px;color:var(--muted);font-size:12px;text-align:center;">No SOL dates tracked yet for these accounts.</div>';
  } else {
    h += '<div style="overflow-x:auto;"><table>';
    h += '<thead><tr><th>Matter</th><th>Client</th><th>Carrier</th><th>SOL Date</th><th>Days</th><th>Status</th></tr></thead><tbody>';
    solCases.slice(0,15).forEach(c => {
      const days = Math.ceil((new Date(c.keyDates.sol) - Date.now())/864e5);
      const col = days < 90 ? 'var(--red)' : days < 180 ? 'var(--gold)' : 'var(--muted)';
      h += '<tr class="row-link" onclick="stCase(\''+c.id+'\')">';
      h += '<td style="font-weight:700;color:var(--pri2);">'+esc(c.matterNo||c.id)+'</td>';
      h += '<td>'+esc(c.client)+'</td>';
      h += '<td style="color:var(--gold);">'+esc(c.insurance.carrier||'—')+'</td>';
      h += '<td>'+esc(c.keyDates.sol)+'</td>';
      h += '<td style="color:'+col+';font-weight:700;">'+(days>0?days+'d':'EXPIRED')+'</td>';
      h += '<td><span class="pill">'+esc(c.keyDates.solStatus||'Active')+'</span></td>';
      h += '</tr>';
    });
    h += '</tbody></table></div>';
  }
  h += '</div>';

  /* Recent activity across my clients */
  h += '<div class="card">';
  h += '<div class="sh"><span>Recent Activity — My Clients</span></div>';
  const recentUpdates = [];
  myCases.forEach(c => { (c.updates||[]).slice(-2).forEach(u => recentUpdates.push({...u, case:c})); });
  if (recentUpdates.length === 0) {
    h += '<div style="padding:18px;color:var(--muted);font-size:12px;text-align:center;">No recent activity.</div>';
  }
  recentUpdates.sort((a,b) => new Date(b.date) - new Date(a.date)).slice(0,8).forEach(u => {
    h += '<div class="activity-item" onclick="stCase(\''+u.case.id+'\')">';
    h += '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:4px;">';
    h += '<div><span style="color:var(--pri2);font-weight:700;font-size:11px;">'+esc(u.case.matterNo||u.case.id)+'</span> · <span style="font-weight:600;font-size:12px;">'+esc(u.case.client)+'</span></div>';
    h += '<span style="font-size:10px;color:var(--dim);">'+esc(u.date)+'</span></div>';
    h += '<div style="font-size:11px;color:var(--muted);"><strong style="color:var(--ink);">'+esc(u.type)+':</strong> '+esc(u.text)+'</div>';
    h += '</div>';
  });
  h += '</div>';

  h += '</div>';
  return h;
}

/* ── PARTNER VIEW ──────────────────────────────────────── */
/* ── TPA LEADERSHIP — comprehensive executive view of EVERY
   customer/carrier the TPA works with, plus how each Account
   Executive's book is performing. This is the "see everything,
   nothing filtered" counterpart to the Account Executive view
   above, which is deliberately scoped to just one AE's clients. ── */
function partV(){
  const carriers = {};
  CASES.forEach(c => {
    const ca = c.insurance.carrier || 'Self-Insured';
    if (!carriers[ca]) carriers[ca] = {cases:[], reserve:0, billed:0, paid:0};
    carriers[ca].cases.push(c);
    carriers[ca].reserve += c.insurance.reserveAmount || 0;
    carriers[ca].billed += c.billing.totalBilled || 0;
    carriers[ca].paid += c.billing.totalPaid || 0;
  });
  const carrierList = Object.entries(carriers).sort((a,b) => b[1].reserve - a[1].reserve);
  const totalCases = CASES.length;
  const open = CASES.filter(c => c.status !== 'Closed');
  const totalReserves = Object.values(carriers).reduce((s,c) => s + c.reserve, 0);
  const totalBilled = Object.values(carriers).reduce((s,c) => s + c.billed, 0);
  const totalPaid = Object.values(carriers).reduce((s,c) => s + c.paid, 0);
  const atRisk = carrierList.filter(([,d]) => {
    const burn = d.reserve ? (d.billed/d.reserve)*100 : 0;
    const avgIdx = d.cases.length ? d.cases.reduce((s,c)=>s+cci(c),0)/d.cases.length : 50;
    return burn > 70 || avgIdx < 50;
  });

  let h = '<div class="wrap">';
  h += '<div class="hero">';
  h += '<div class="hero-l"><div class="hero-eyebrow">TPA Leadership · Executive Dashboard</div>';
  h += '<h1 class="hero-title">Every Customer, One View</h1>';
  h += '<p class="hero-sub">'+carrierList.length+' customers · '+totalCases+' matters · '+fM(totalReserves)+' total reserves under management</p></div></div>';

  /* ── THE WOW BANNER ──────────────────────────────────────────
     Four numbers, big, first thing anyone sees. This is the
     "sell the room in 5 seconds" moment — everything below is the
     receipts. Reuses the same navy gradient as the public landing
     hero so the product feels like one coherent brand, not a
     bolted-together dashboard. */
  const closedForOutcomes0 = CASES.filter(c => c.status === 'Closed');
  const wins0 = closedForOutcomes0.filter(c => (c.exposure.settlementAmount || 0) < (c.exposure.demandAmount || c.value));
  const winRate0 = closedForOutcomes0.length ? Math.round((wins0.length/closedForOutcomes0.length)*100) : 0;
  const avgCycle0 = closedForOutcomes0.length ? Math.round(closedForOutcomes0.reduce((s,c)=>s+daysOpen(c),0)/closedForOutcomes0.length) : 0;
  const cycleVsPromise = avgCycle0 && avgCycle0 < 300 ? Math.round((1 - avgCycle0/300)*100) : 0;
  h += '<div style="background:linear-gradient(160deg,#001C41 0%,#012a5e 45%,#0056D2 130%);border-radius:18px;padding:38px 40px;margin-bottom:22px;color:#fff;position:relative;overflow:hidden;">';
  h += '<div style="position:absolute;top:-100px;right:-100px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(0,201,219,.16) 0%,transparent 70%);"></div>';
  h += '<div style="font-size:10.5px;font-weight:700;letter-spacing:1.8px;text-transform:uppercase;color:#7FD4E8;margin-bottom:18px;position:relative;">The Book, At a Glance</div>';
  h += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:28px;position:relative;">';
  const wowStats = [
    [fV(totalReserves), 'Under Active Management', null],
    [winRate0+'%', 'Win Rate, Firm-Wide', winRate0>=60],
    [(avgCycle0||'—')+(avgCycle0?' days':''), 'Avg. Time to Close', avgCycle0>0 && avgCycle0<=200],
    [carrierList.length, 'Customers Served', null],
  ];
  wowStats.forEach(([val,label,good]) => {
    h += '<div>';
    h += '<div class="serif" style="font-size:40px;font-weight:700;letter-spacing:-1px;line-height:1;">'+val+(good===true?' <span style="font-size:16px;color:#6EE7B7;">▲</span>':good===false?' <span style="font-size:16px;color:#FCA5A5;">▼</span>':'')+'</div>';
    h += '<div style="font-size:11.5px;color:#9FB6D9;margin-top:6px;">'+label+'</div>';
    h += '</div>';
  });
  h += '</div>';
  if (cycleVsPromise > 0) h += '<div style="margin-top:22px;padding-top:18px;border-top:1px solid rgba(255,255,255,.15);font-size:12.5px;color:#C3D4EE;position:relative;">Closing matters <strong style="color:#7FD4E8;">'+cycleVsPromise+'% faster</strong> than the 300-day industry baseline this platform was built to beat.</div>';
  h += '</div>';

  h += '<div class="kpi-grid">';
  h += '<div class="kpi"><div class="kpi-l">Total Customers</div><div class="kpi-v">'+carrierList.length+'</div></div>';
  h += '<div class="kpi"><div class="kpi-l">Total Reserves</div><div class="kpi-v" style="color:var(--gold);">'+fV(totalReserves)+'</div></div>';
  h += '<div class="kpi"><div class="kpi-l">Billed / Paid YTD</div><div class="kpi-v">'+fV(totalBilled)+'</div><div class="kpi-sub">'+fV(totalPaid)+' collected</div></div>';
  h += '<div class="kpi"><div class="kpi-l">Accounts At Risk</div><div class="kpi-v" style="color:'+(atRisk.length?'var(--red)':'var(--green)')+';">'+atRisk.length+'</div></div>';
  h += '</div>';

  /* ── THE BOOK, VISUALIZED — a KPI column, a client-concentration
     donut, and a new-vs-resolved bar chart in one row, so the shape
     of the book and its direction read together at a glance. ── */
  const collRate0 = totalBilled ? Math.round((totalPaid/totalBilled)*100) : 0;
  const topClients0 = carrierList.slice(0,3);
  const top3Reserves0 = topClients0.reduce((s,[,d])=>s+d.reserve, 0);
  const otherReserves0 = Math.max(0, totalReserves-top3Reserves0);
  const donutColorsT = ['#0056D2','#00C9DB','#A16207','#94A3B8'];
  const donutSegsT = topClients0.map(([name,d]) => ({label:name, pct: totalReserves ? (d.reserve/totalReserves)*100 : 0}));
  donutSegsT.push({label:'Everyone Else', pct: totalReserves ? (otherReserves0/totalReserves)*100 : 0});

  const fdT = CASES.map(c=>new Date(c.filed).getTime()).filter(t=>!isNaN(t));
  const refT = fdT.length ? new Date(Math.max(...fdT)) : new Date();
  const monthsT = []; for (let i=5;i>=0;i--){ const d=new Date(refT.getFullYear(),refT.getMonth()-i,1); monthsT.push(d); }
  const inflowT = monthsT.map(d => CASES.filter(c=>{ const f=new Date(c.filed); return !isNaN(f) && f.getFullYear()===d.getFullYear() && f.getMonth()===d.getMonth(); }).length);
  const outflowT = monthsT.map(d => CASES.filter(c=>{ if (c.status!=='Closed') return false; const cd=new Date(c.deadline); return !isNaN(cd) && cd.getFullYear()===d.getFullYear() && cd.getMonth()===d.getMonth(); }).length);
  const monthLabelsT = monthsT.map(d=>d.toLocaleDateString('en-US',{month:'short'}));

  h += '<div class="section-band" style="margin-top:4px;">📊 The Book, Visualized</div>';
  h += kpiDonutBarRow({
    kpis: [
      {label:'Total Customers', value: carrierList.length},
      {label:'Total Reserves', value: fV(totalReserves), color:'var(--gold)'},
      {label:'Collection Rate', value: collRate0+'%', color: collRate0>=85?'var(--green)':collRate0>=65?'var(--gold)':'var(--red)'},
      {label:'Accounts At Risk', value: atRisk.length, color: atRisk.length?'var(--red)':'var(--green)'}
    ],
    donutTitle: 'Client Concentration', donutSub: 'Reserves by top customer',
    donutSegs: donutSegsT, donutColors: donutColorsT,
    barTitle: 'New Litigation vs. Resolved', barSub: 'Last 6 months',
    barLabels: monthLabelsT,
    barSeries: [
      {label:'New Litigation', color:'var(--red)', values: inflowT},
      {label:'Resolved', color:'var(--green)', values: outflowT}
    ]
  });

  /* ── WHAT C-LEVEL ACTUALLY LOOKS AT ─────────────────────────
     Fee revenue/collection health, client concentration risk,
     SLA/cycle-time performance against the company's own 100-200
     day promise, and whether the book is growing faster than it's
     being closed. Different questions than an AE or attorney asks. */
  h += '<div class="section-band" style="margin-top:4px;">💼 For Leadership</div>';

  h += '<div class="grid-3">';

  /* Collection health — this is the TPA's actual income, not case value */
  h += '<div class="card"><div class="sh"><span>Fee Revenue &amp; Collection Health</span></div>';
  const collRate = totalBilled ? Math.round((totalPaid/totalBilled)*100) : 0;
  h += '<div style="text-align:center;padding:6px 0 14px;">';
  h += '<div class="serif" style="font-size:32px;font-weight:700;color:'+(collRate>=85?'var(--green)':collRate>=65?'var(--gold)':'var(--red)')+';">'+collRate+'%</div>';
  h += '<div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-top:3px;">Collection Rate</div></div>';
  h += '<div style="display:flex;justify-content:space-between;font-size:11.5px;padding:6px 0;border-top:1px solid var(--surf2);"><span style="color:var(--muted);">Billed YTD</span><span style="font-weight:700;">'+fV(totalBilled)+'</span></div>';
  h += '<div style="display:flex;justify-content:space-between;font-size:11.5px;padding:6px 0;"><span style="color:var(--muted);">Collected</span><span style="font-weight:700;color:var(--green);">'+fV(totalPaid)+'</span></div>';
  h += '<div style="display:flex;justify-content:space-between;font-size:11.5px;padding:6px 0;"><span style="color:var(--muted);">Outstanding</span><span style="font-weight:700;color:'+(totalBilled-totalPaid>0?'var(--gold)':'var(--dim)')+';">'+fV(totalBilled-totalPaid)+'</span></div>';
  h += '</div>';

  /* Client concentration — a classic C-level risk question: how
     much of the book depends on any single client walking away */
  h += '<div class="card"><div class="sh"><span>Client Concentration Risk</span></div>';
  const topClients = carrierList.slice(0,3);
  const top3Reserves = topClients.reduce((s,[,d])=>s+d.reserve, 0);
  const concentrationPct = totalReserves ? Math.round((top3Reserves/totalReserves)*100) : 0;
  const concColor = concentrationPct>60?'#DC2626':concentrationPct>40?'#B45309':'#059669';
  // Real SVG donut, not just a number — segments for each of the
  // top 3 clients plus "everyone else," so the shape of the risk is
  // visible at a glance, not just a percentage to read.
  const donutSegs = topClients.map(([name,d]) => ({name, pct: totalReserves ? (d.reserve/totalReserves)*100 : 0}));
  const otherPct = Math.max(0, 100 - donutSegs.reduce((s,d)=>s+d.pct,0));
  const donutColors = ['#0056D2','#00C9DB','#A16207','#94A3B8'];
  let cumulative = 0;
  const R = 15.9155; // circumference-normalized radius trick for stroke-dasharray percentages
  h += '<div style="display:flex;align-items:center;gap:18px;padding:6px 0 12px;">';
  h += '<svg viewBox="0 0 42 42" style="width:110px;height:110px;flex-shrink:0;transform:rotate(-90deg);">';
  h += '<circle cx="21" cy="21" r="'+R+'" fill="transparent" stroke="var(--surf3)" stroke-width="6"></circle>';
  [...donutSegs, {name:'Everyone Else', pct:otherPct}].forEach((seg,i) => {
    if (seg.pct <= 0) return;
    const dash = (seg.pct/100) * (2*Math.PI*R);
    const gap = (2*Math.PI*R) - dash;
    h += '<circle cx="21" cy="21" r="'+R+'" fill="transparent" stroke="'+donutColors[i]+'" stroke-width="6" stroke-dasharray="'+dash+' '+gap+'" stroke-dashoffset="'+(-cumulative)+'"></circle>';
    cumulative += dash;
  });
  h += '</svg>';
  h += '<div>';
  h += '<div class="serif" style="font-size:32px;font-weight:700;color:'+concColor+';line-height:1;">'+concentrationPct+'%</div>';
  h += '<div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-top:3px;">of Book in Top 3 Clients</div>';
  h += '</div></div>';
  topClients.forEach(([name,d],i) => {
    const pct = totalReserves ? Math.round((d.reserve/totalReserves)*100) : 0;
    h += '<div style="display:flex;justify-content:space-between;align-items:center;font-size:11px;padding:5px 0;border-top:1px solid var(--surf2);"><span style="display:flex;align-items:center;gap:7px;"><span style="width:8px;height:8px;border-radius:2px;background:'+donutColors[i]+';display:inline-block;"></span>'+esc(name)+'</span><span style="font-weight:700;">'+pct+'%</span></div>';
  });
  if (concentrationPct > 60) h += '<div style="font-size:9.5px;color:var(--red);margin-top:8px;">⚠ High dependency — losing any one of these would materially impact the book.</div>';
  h += '</div>';

  /* SLA / cycle time — measured against the company's own public
     promise of 100-200 days, not a generic benchmark */
  h += '<div class="card"><div class="sh"><span>Cycle Time vs. SLA Target</span></div>';
  const closedCases = CASES.filter(c => c.status === 'Closed');
  const avgCycle = closedCases.length ? Math.round(closedCases.reduce((s,c)=>s+daysOpen(c),0)/closedCases.length) : 0;
  const withinTarget = closedCases.filter(c => daysOpen(c) <= 200).length;
  const targetPct = closedCases.length ? Math.round((withinTarget/closedCases.length)*100) : 0;
  const gaugeColor = targetPct>=70?'#059669':targetPct>=50?'#B45309':'#DC2626';
  const gaugeR = 15.9155, gaugeCirc = 2*Math.PI*gaugeR;
  h += '<div style="display:flex;align-items:center;gap:20px;padding:6px 0 14px;">';
  h += '<svg viewBox="0 0 42 42" style="width:120px;height:120px;flex-shrink:0;transform:rotate(-90deg);">';
  h += '<circle cx="21" cy="21" r="'+gaugeR+'" fill="transparent" stroke="var(--surf3)" stroke-width="6"></circle>';
  h += '<circle cx="21" cy="21" r="'+gaugeR+'" fill="transparent" stroke="'+gaugeColor+'" stroke-width="6" stroke-linecap="round" stroke-dasharray="'+(targetPct/100*gaugeCirc)+' '+gaugeCirc+'"></circle>';
  h += '</svg>';
  h += '<div>';
  h += '<div class="serif" style="font-size:34px;font-weight:700;color:'+gaugeColor+';line-height:1;">'+targetPct+'%</div>';
  h += '<div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-top:3px;">Closed Within SLA</div>';
  h += '</div></div>';
  h += '<div style="display:flex;justify-content:space-between;font-size:11.5px;padding:6px 0;border-top:1px solid var(--surf2);"><span style="color:var(--muted);">Avg. Days to Close</span><span style="font-weight:700;color:'+(avgCycle<=200&&avgCycle>0?'var(--green)':'var(--red)')+';">'+(avgCycle||'—')+' days</span></div>';
  h += '<div style="display:flex;justify-content:space-between;font-size:11.5px;padding:6px 0;"><span style="color:var(--muted);">Target (public promise)</span><span style="font-weight:700;">100–200 days</span></div>';
  h += '<div style="display:flex;justify-content:space-between;font-size:11.5px;padding:6px 0;"><span style="color:var(--muted);">Closed Matters (n)</span><span style="font-weight:700;">'+closedCases.length+'</span></div>';
  h += '</div>';

  h += '</div>';

  /* Book growth — is litigation inflow outpacing what's actually
     getting resolved (a growing backlog) or shrinking */
  h += '<div class="card"><div class="sh"><span>Book Growth — New Litigation vs. Resolved</span><span style="color:var(--dim);font-weight:500;">Last 12 months</span></div>';
  const fd = CASES.map(c=>new Date(c.filed).getTime()).filter(t=>!isNaN(t));
  if (fd.length) {
    const ref = new Date(Math.max(...fd));
    const months = []; for (let i=11;i>=0;i--){ const d=new Date(ref.getFullYear(),ref.getMonth()-i,1); months.push(d); }
    const inflow = months.map(d => CASES.filter(c=>{ const f=new Date(c.filed); return !isNaN(f) && f.getFullYear()===d.getFullYear() && f.getMonth()===d.getMonth(); }).length);
    const outflow = months.map(d => CASES.filter(c=>{ if (c.status!=='Closed') return false; const cd=new Date(c.deadline); return !isNaN(cd) && cd.getFullYear()===d.getFullYear() && cd.getMonth()===d.getMonth(); }).length);
    const maxIO = Math.max(...inflow, ...outflow, 1);
    h += '<svg viewBox="0 0 800 140" style="width:100%;height:150px;">';
    const lineFrom = (arr,color,dash) => { let p=''; arr.forEach((v,i)=>{ const x=20+i*(760/11); const y=120-(v/maxIO)*100; p += (i===0?'M':'L')+x+' '+y; }); return '<path d="'+p+'" stroke="'+color+'" stroke-width="2.5" fill="none"'+(dash?' stroke-dasharray="5 3"':'')+'/>'; };
    h += lineFrom(inflow,'var(--red)',false);
    h += lineFrom(outflow,'var(--green)',true);
    h += '</svg>';
    h += '<div style="display:flex;gap:18px;justify-content:center;margin-top:4px;">';
    h += '<div style="display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--muted);"><div style="width:14px;height:2.5px;background:var(--red);"></div>New Litigation Filed</div>';
    h += '<div style="display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--muted);"><div style="width:14px;height:2px;background:var(--green);background-image:linear-gradient(to right,var(--green) 60%,transparent 60%);background-size:5px 2px;"></div>Resolved</div>';
    h += '</div>';
    const totalInflow = inflow.reduce((a,b)=>a+b,0), totalOutflow = outflow.reduce((a,b)=>a+b,0);
    if (totalInflow > totalOutflow * 1.2) h += '<div style="font-size:10.5px;color:var(--gold);margin-top:8px;text-align:center;">Inflow is outpacing resolution — backlog is growing.</div>';
  } else {
    h += '<div style="padding:18px;color:var(--muted);font-size:12px;text-align:center;">Not enough filed-date data to chart this yet.</div>';
  }
  h += '</div>';

  /* ── WHAT THEY CARE ABOUT ON CLAIMS & LITIGATION SPECIFICALLY ──
     Different lens than the business KPIs above — this is "is our
     claims-handling actually good" and "where's the real risk,"
     drawn directly from features this product already tracks
     (probability of loss, root cause, CCI, SOL) rather than generic
     benchmarks. This is the part a TPA can point to and say "this
     is why our platform earns its keep," not just report numbers. */
  h += '<div class="section-band">⚖ Claims &amp; Litigation Risk — Portfolio-Wide</div>';
  h += '<div class="grid-2">';

  /* Exposure by probability of loss — the honest risk picture, not
     just total dollars, across every client at once */
  h += '<div class="card"><div class="sh"><span>Litigation Exposure by Probability of Loss</span><span style="color:var(--dim);font-weight:500;">All clients</span></div>';
  const probBuckets = {Probable:0, 'Reasonably Possible':0, Remote:0};
  open.forEach(c => { const p = c.probabilityOfLoss||'Reasonably Possible'; probBuckets[p] = (probBuckets[p]||0) + (c.exposure.likelyExposure||c.value||0); });
  const probColors = {Probable:'var(--red)', 'Reasonably Possible':'var(--gold)', Remote:'var(--green)'};
  const probTotal = Object.values(probBuckets).reduce((a,b)=>a+b,0) || 1;
  Object.entries(probBuckets).forEach(([label,amt]) => {
    const pct = Math.round(amt/probTotal*100);
    h += '<div style="margin-bottom:9px;"><div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:2px;"><span style="color:var(--muted);">'+label+'</span><span style="font-weight:700;color:'+probColors[label]+';">'+fV(amt)+'</span></div>';
    h += '<div style="background:var(--surf3);height:7px;border-radius:3px;overflow:hidden;"><div style="width:'+pct+'%;height:100%;background:'+probColors[label]+';"></div></div></div>';
  });
  h += '<div style="font-size:9.5px;color:var(--dim);margin-top:4px;">This is the number a board or reinsurer actually wants — not raw exposure, but how much of it is likely to materialize.</div>';
  h += '</div>';

  /* Catastrophic / material matters across the WHOLE TPA book —
     a huge single claim for even a small client is real risk to
     the TPA's own relationship and reputation with that carrier */
  h += '<div class="card"><div class="sh"><span>Catastrophic Claims Watchlist</span><span style="color:var(--dim);font-weight:500;">&gt;$5M, any client</span></div>';
  const catThreshold = 5000000;
  const catClaims = open.filter(c => (c.exposure.likelyExposure||c.value||0) > catThreshold).sort((a,b)=>(b.exposure.likelyExposure||b.value)-(a.exposure.likelyExposure||a.value));
  if (catClaims.length === 0) {
    h += '<div style="color:var(--green);font-size:12px;font-weight:600;padding:8px 0;">✓ No claims currently exceed $5M across any client.</div>';
  } else {
    catClaims.slice(0,6).forEach(c => {
      h += '<div class="row-link" onclick="stCase(\''+c.id+'\')" style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--surf2);font-size:11.5px;">';
      h += '<span>'+esc(c.insurance.carrier||'—')+' — '+esc(c.client)+'</span><span style="font-weight:700;color:var(--red);">'+fV(c.exposure.likelyExposure||c.value)+'</span></div>';
    });
  }
  h += '</div>';
  h += '</div>';

  h += '<div class="grid-2">';

  /* Are claims actually being handled well? The direct answer to
     "why should a carrier keep paying us" */
  h += '<div class="card"><div class="sh"><span>Litigation Outcomes Quality</span></div>';
  const closedForOutcomes = CASES.filter(c => c.status === 'Closed');
  const wins = closedForOutcomes.filter(c => (c.exposure.settlementAmount || 0) < (c.exposure.demandAmount || c.value));
  const winRate = closedForOutcomes.length ? Math.round((wins.length/closedForOutcomes.length)*100) : 0;
  const avgCCI = open.length ? Math.round(open.reduce((s,c)=>s+cci(c),0)/open.length) : 0;
  const outR = 15.9155, outCirc = 2*Math.PI*outR;
  const miniGauge = (pct, color) => {
    return '<svg viewBox="0 0 42 42" style="width:64px;height:64px;transform:rotate(-90deg);">'+
      '<circle cx="21" cy="21" r="'+outR+'" fill="transparent" stroke="var(--surf3)" stroke-width="6"></circle>'+
      '<circle cx="21" cy="21" r="'+outR+'" fill="transparent" stroke="'+color+'" stroke-width="6" stroke-linecap="round" stroke-dasharray="'+(pct/100*outCirc)+' '+outCirc+'"></circle></svg>';
  };
  h += '<div style="display:flex;gap:28px;flex-wrap:wrap;align-items:center;">';
  h += '<div style="text-align:center;">'+miniGauge(winRate, winRate>=60?'#059669':'#B45309')+'<div class="serif" style="font-size:20px;font-weight:700;color:'+(winRate>=60?'var(--green)':'var(--gold)')+';margin-top:-46px;position:relative;">'+winRate+'%</div><div style="font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-top:10px;">Win Rate</div></div>';
  h += '<div style="text-align:center;">'+miniGauge(avgCCI, cciColor(avgCCI))+'<div class="serif" style="font-size:20px;font-weight:700;color:'+cciColor(avgCCI)+';margin-top:-46px;position:relative;">'+avgCCI+'</div><div style="font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-top:10px;">Portfolio CCI</div></div>';
  h += '<div><div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:3px;">Closed Matters</div><div class="serif" style="font-size:30px;font-weight:700;">'+closedForOutcomes.length+'</div></div>';
  h += '</div>';
  h += '<div style="font-size:9.5px;color:var(--dim);margin-top:12px;">This is the evidence a renewal conversation runs on — outcomes, not just activity.</div>';
  h += '</div>';

  /* Root cause across every client — what a TPA can actually take
     back to a carrier as a loss-prevention conversation, which is
     real advisory value beyond just handling the claims */
  h += '<div class="card"><div class="sh"><span>Why Clients Are Being Sued</span><span style="color:var(--dim);font-weight:500;">All clients, ranked</span></div>';
  const byRootCause = {};
  CASES.forEach(c => { const rc = c.rootCause || 'Other'; byRootCause[rc] = (byRootCause[rc]||0)+1; });
  const rcEntries = Object.entries(byRootCause).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const rcTotal = rcEntries.reduce((s,[,n])=>s+n,0) || 1;
  const rcColors = ['#6D28D9','#0056D2','#00C9DB','#B45309','#DC2626','#059669'];
  const rcR = 15.9155, rcCirc = 2*Math.PI*rcR;
  h += '<div style="display:flex;align-items:center;gap:20px;margin-bottom:14px;">';
  h += '<svg viewBox="0 0 42 42" style="width:110px;height:110px;flex-shrink:0;transform:rotate(-90deg);">';
  h += '<circle cx="21" cy="21" r="'+rcR+'" fill="transparent" stroke="var(--surf3)" stroke-width="6"></circle>';
  let rcCumulative = 0;
  rcEntries.forEach(([rc,n],i) => {
    const dash = (n/rcTotal)*rcCirc;
    h += '<circle cx="21" cy="21" r="'+rcR+'" fill="transparent" stroke="'+rcColors[i%rcColors.length]+'" stroke-width="6" stroke-dasharray="'+dash+' '+(rcCirc-dash)+'" stroke-dashoffset="'+(-rcCumulative)+'"></circle>';
    rcCumulative += dash;
  });
  h += '</svg>';
  h += '<div><div class="serif" style="font-size:28px;font-weight:700;color:var(--ink);line-height:1;">'+esc(rcEntries[0]?.[0]||'—')+'</div><div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-top:4px;">Top Loss Driver</div></div>';
  h += '</div>';
  rcEntries.forEach(([rc,n],i) => {
    const pct = Math.round(n/rcTotal*100);
    h += '<div style="display:flex;justify-content:space-between;align-items:center;font-size:11px;padding:5px 0;border-top:1px solid var(--surf2);"><span style="display:flex;align-items:center;gap:7px;"><span style="width:9px;height:9px;border-radius:2px;background:'+rcColors[i%rcColors.length]+';display:inline-block;"></span>'+esc(rc)+'</span><span style="font-weight:700;">'+n+' <span style="color:var(--dim);font-weight:500;">('+pct+'%)</span></span></div>';
  });
  h += '<div style="font-size:9.5px;color:var(--dim);margin-top:8px;">The top cause here is a real, specific talking point for the next client renewal or QBR — not a guess.</div>';
  h += '</div>';
  h += '</div>';

  /* SOL/deadline risk — one of the product's signature features,
     rolled up to a single skimmable line for an executive, not the
     full case-by-case table the AE/claims-desk views already have */
  const solDue = open.filter(c => c.keyDates.sol && new Date(c.keyDates.sol) < new Date(Date.now()+90*864e5));
  const missingSol = open.filter(c => !c.keyDates.sol);
  if (solDue.length > 0 || missingSol.length > 0) {
    h += '<div class="card" style="border-left:3px solid var(--gold);">';
    h += '<div class="sh"><span>⏱ Deadline Risk — Portfolio-Wide</span></div>';
    h += '<div style="display:flex;gap:28px;flex-wrap:wrap;">';
    h += '<div><div class="serif" style="font-size:24px;font-weight:700;color:'+(solDue.length?'var(--red)':'var(--green)')+';">'+solDue.length+'</div><div style="font-size:10px;color:var(--muted);">SOL inside 90 days, any client</div></div>';
    h += '<div><div class="serif" style="font-size:24px;font-weight:700;color:'+(missingSol.length?'var(--gold)':'var(--green)')+';">'+missingSol.length+'</div><div style="font-size:10px;color:var(--muted);">Open matters missing an SOL date</div></div>';
    h += '</div></div>';
  }

  /* Account Executive rollup — how each AE's book is performing */
  h += '<div class="card">';
  h += '<div class="sh"><span>Account Executive Performance</span></div>';
  h += '<div style="overflow-x:auto;"><table>';
  h += '<thead><tr><th>Account Executive</th><th>Clients</th><th>Matters</th><th>Reserves Managed</th><th>At-Risk Accounts</th></tr></thead><tbody>';
  const aeReservesAll = ACCOUNT_EXECS.map(ae => carrierList.filter(([name]) => aeForCarrier(name) === ae).reduce((s,[,d])=>s+d.reserve, 0));
  const maxAeReserve = Math.max(...aeReservesAll, 1);
  ACCOUNT_EXECS.forEach((ae, aeIdx) => {
    const aeCarriers = carrierList.filter(([name]) => aeForCarrier(name) === ae);
    const aeMatters = aeCarriers.reduce((s,[,d])=>s+d.cases.length, 0);
    const aeReserves = aeCarriers.reduce((s,[,d])=>s+d.reserve, 0);
    const aeAtRisk = aeCarriers.filter(([,d]) => {
      const burn = d.reserve ? (d.billed/d.reserve)*100 : 0;
      const avgIdx = d.cases.length ? d.cases.reduce((s,c)=>s+cci(c),0)/d.cases.length : 50;
      return burn > 70 || avgIdx < 50;
    }).length;
    const barPct = Math.round(aeReserves/maxAeReserve*100);
    h += '<tr class="row-link" onclick="st({role:\'tpa\',selectedAE:\''+ae+'\'})">';
    h += '<td style="font-weight:700;">'+esc(ae)+'</td>';
    h += '<td>'+aeCarriers.length+'</td>';
    h += '<td>'+aeMatters+'</td>';
    h += '<td style="min-width:160px;"><div style="display:flex;align-items:center;gap:8px;"><span style="font-weight:700;white-space:nowrap;">'+fV(aeReserves)+'</span><div style="background:var(--surf3);height:6px;border-radius:3px;overflow:hidden;flex:1;min-width:50px;"><div style="width:'+barPct+'%;height:100%;background:var(--gold);"></div></div></div></td>';
    h += '<td style="color:'+(aeAtRisk?'var(--red)':'var(--green)')+';font-weight:700;">'+aeAtRisk+'</td>';
    h += '</tr>';
  });
  h += '</tbody></table></div></div>';

  /* Every customer, comprehensively — the full book, unfiltered */
  h += '<div class="card">';
  h += '<div class="sh"><span>All Customers — Portfolio-Wide</span><span style="color:var(--dim);font-weight:500;">'+carrierList.length+' total</span></div>';
  h += '<div style="overflow-x:auto;"><table>';
  h += '<thead><tr><th>Customer</th><th>Account Exec</th><th>Matters</th><th>Reserves</th><th>Billed</th><th>Burn %</th><th>Avg CCI</th><th>Health</th></tr></thead><tbody>';
  carrierList.forEach(([name, data]) => {
    const burn = data.reserve ? Math.round((data.billed/data.reserve)*100) : 0;
    const avgIdx = Math.round(data.cases.reduce((s,c)=>s+cci(c),0)/data.cases.length);
    const burnCol = burn > 70 ? 'var(--red)' : burn > 50 ? 'var(--gold)' : 'var(--green)';
    const risk = burn > 70 || avgIdx < 50 ? '⚠ At Risk' : burn > 50 ? '◐ Monitor' : '✓ Healthy';
    const riskCol = risk.includes('Risk') ? 'var(--red)' : risk.includes('Monitor') ? 'var(--gold)' : 'var(--green)';
    h += '<tr>';
    h += '<td style="font-weight:700;color:var(--gold);">'+esc(name)+'</td>';
    h += '<td style="font-size:11px;color:var(--muted);">'+esc(aeForCarrier(name))+'</td>';
    h += '<td style="font-weight:600;">'+data.cases.length+'</td>';
    h += '<td>'+fV(data.reserve)+'</td>';
    h += '<td>'+fV(data.billed)+'</td>';
    h += '<td style="color:'+burnCol+';font-weight:700;">'+burn+'%</td>';
    h += '<td><span class="cci-pill" style="background:'+cciColor(avgIdx)+'22;color:'+cciColor(avgIdx)+';">'+avgIdx+'</span></td>';
    h += '<td style="color:'+riskCol+';font-weight:600;font-size:11px;">'+risk+'</td>';
    h += '</tr>';
  });
  h += '</tbody></table></div></div>';

  /* Firm-wide attorney performance — still relevant at the leadership level */
  h += '<div class="card">';
  h += '<div class="sh"><span>Attorney Performance — Firm-Wide</span></div>';
  h += '<div style="overflow-x:auto;"><table>';
  h += '<thead><tr><th>Attorney</th><th>Active</th><th>Closed</th><th>Win Rate</th><th>Billed</th><th>Avg CCI</th><th>Workload</th></tr></thead><tbody>';
  ATTY.forEach(a => {
    const aCases = CASES.filter(c => c.attorney === a);
    const aOpen = aCases.filter(c => c.status !== 'Closed');
    const aClosed = aCases.filter(c => c.status === 'Closed');
    const aBilled = aCases.reduce((s,c) => s + (c.billing.totalBilled||0), 0);
    const aIdx = aOpen.length ? Math.round(aOpen.reduce((s,c)=>s+cci(c),0)/aOpen.length) : 50;
    const wins = aClosed.filter(c => (c.exposure.settlementAmount || 0) < (c.exposure.demandAmount || c.value));
    const winRate = aClosed.length ? Math.round((wins.length/aClosed.length)*100) : 0;
    const wlPct = Math.min(100, aOpen.length * 12);
    h += '<tr>';
    h += '<td style="font-weight:700;color:'+(ATTY_COLOR[a]||'var(--ink)')+';">'+esc(a)+'</td>';
    h += '<td>'+aOpen.length+'</td>';
    h += '<td>'+aClosed.length+'</td>';
    h += '<td style="color:'+(aClosed.length?'var(--green)':'var(--dim)')+';font-weight:600;">'+(aClosed.length?winRate+'%':'—')+'</td>';
    h += '<td>'+fV(aBilled)+'</td>';
    h += '<td><span class="cci-pill" style="background:'+cciColor(aIdx)+'22;color:'+cciColor(aIdx)+';">'+aIdx+'</span></td>';
    h += '<td><div style="background:var(--surf3);height:6px;border-radius:3px;overflow:hidden;width:80px;"><div style="width:'+wlPct+'%;height:100%;background:'+(wlPct>80?'var(--red)':wlPct>60?'var(--gold)':'var(--green)')+';"></div></div></td>';
    h += '</tr>';
  });
  h += '</tbody></table></div></div>';

  h += '</div>';
  return h;
}

/* ── EXECUTIVE DASHBOARD ───────────────────────────────────
   6 sections behind an internal sub-nav, same single-file pattern
   as every other view in this app. Attorney Performance reuses the
   LES scorecard engine directly (attorneyScorecard/firmAverages)
   instead of recomputing anything — one source of truth for
   attorney metrics across the whole app, not two. */
const EXEC_TABS = [
  ['glance','Firm at a Glance'],
  ['financial','Financial'],
  ['portfolio','Portfolio'],
  ['attorneys','Attorney Performance'],
  ['trends','Trends'],
  ['risk','Risk & Alerts'],
  ['reports','Detailed Reports']
];
function execSubNav(){
  let h = '<div class="exec-subnav" style="display:flex;gap:4px;background:var(--surf2);border:1px solid var(--line);border-radius:9px;padding:4px;margin-bottom:18px;flex-wrap:wrap;">';
  EXEC_TABS.forEach(([k,l]) => {
    h += '<button onclick="st({execTab:\''+k+'\'})" style="flex:1;min-width:120px;padding:9px 12px;border:none;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;background:'+(S.execTab===k?'#fff':'transparent')+';color:'+(S.execTab===k?'var(--pri)':'var(--muted)')+';box-shadow:'+(S.execTab===k?'0 1px 3px rgba(0,0,0,.1)':'none')+';">'+l+'</button>';
  });
  h += '</div>';
  return h;
}
function execV(){
  if (S.showDrill) return drillDownV();
  let h = '<div class="wrap">';
  h += '<div class="hero"><div class="hero-l"><div class="hero-eyebrow">Executive Dashboard</div>';
  h += '<h1 class="hero-title">'+(EXEC_TABS.find(([k])=>k===S.execTab)||[])[1]+'</h1>';
  h += '<p class="hero-sub">'+CASES.length+' total matters across the firm</p></div>';
  h += '<div class="hero-r"><button class="btn btn-out" onclick="window.print()">🖨 Export PDF</button></div></div>';

  h += execTotalLitigationSummaryV();
  h += weeklyDigestCardV();
  h += execSubNav();

  if (S.execTab === 'financial') h += execFinancialV();
  else if (S.execTab === 'portfolio') h += execPortfolioV();
  else if (S.execTab === 'attorneys') h += execAttorneyPerfV();
  else if (S.execTab === 'trends') h += execTrendsV();
  else if (S.execTab === 'risk') h += execRiskV();
  else if (S.execTab === 'reports') h += execReportsV();
  else h += execGlanceV();

  h += '</div>';
  return h;
}

/* ── TOTAL LITIGATION SUMMARY ─────────────────────────────
   Always visible at the top of the Executive Dashboard regardless
   of which subtab is selected — the one-glance answer to "where do
   we stand across the whole company right now." Everything below
   this (the subnav tabs) is the drill-down; this band is the
   summary. Pulls from real CASES data only — no seeded/placeholder
   figures. */
function execTotalLitigationSummaryV(){
  const open = CASES.filter(c => c.status !== 'Closed');
  const closed = CASES.filter(c => c.status === 'Closed');
  const totExposure = CASES.reduce((s,c) => s + (c.exposure.likelyExposure||c.value||0), 0);
  const totReserves = CASES.reduce((s,c) => s + (c.insurance.reserveAmount||0), 0);
  const totBilled = CASES.reduce((s,c) => s + (c.billing.totalBilled||0), 0);
  const totPaid = CASES.reduce((s,c) => s + (c.billing.totalPaid||0), 0);
  const wins = closed.filter(c => (c.exposure.settlementAmount || 0) < (c.exposure.demandAmount || c.value));
  const winRate = closed.length ? Math.round(wins.length/closed.length*100) : 0;
  const avgCycle = closed.length ? Math.round(closed.reduce((s,c)=>s+daysOpen(c),0)/closed.length) : 0;
  const avgIdx = open.length ? Math.round(open.reduce((s,c)=>s+cci(c),0)/open.length) : 0;
  const trialCount = CASES.filter(c => c.status !== 'Closed' && (c.status === 'Trial' || c.potentialTrialCandidate)).length;
  const missingSol = open.filter(c => !c.keyDates.sol).length;

  let h = '';

  /* ── THE WOW BANNER — same treatment as TPA Leadership, so the
     product feels like one coherent brand across both dashboards
     leadership will actually be shown in a sales conversation. ── */
  const cciTrend = avgIdx >= 60;
  h += '<div style="background:linear-gradient(160deg,#001C41 0%,#012a5e 45%,#0056D2 130%);border-radius:18px;padding:38px 40px;margin-bottom:18px;color:#fff;position:relative;overflow:hidden;">';
  h += '<div style="position:absolute;top:-100px;right:-100px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(0,201,219,.16) 0%,transparent 70%);"></div>';
  h += '<div style="font-size:10.5px;font-weight:700;letter-spacing:1.8px;text-transform:uppercase;color:#7FD4E8;margin-bottom:18px;position:relative;">Company-Wide Litigation, In One Glance</div>';
  h += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:28px;position:relative;">';
  const execWowStats = [
    [fV(totExposure), 'Total Exposure', null],
    [fV(totReserves), 'Total Reserves Held', null],
    [winRate+'%', 'Firm-Wide Win Rate', winRate>=60],
    [avgIdx, 'Portfolio Favorability (CCI)', cciTrend],
  ];
  execWowStats.forEach(([val,label,good]) => {
    h += '<div>';
    h += '<div class="serif" style="font-size:40px;font-weight:700;letter-spacing:-1px;line-height:1;">'+val+(good===true?' <span style="font-size:16px;color:#6EE7B7;">▲</span>':good===false?' <span style="font-size:16px;color:#FCA5A5;">▼</span>':'')+'</div>';
    h += '<div style="font-size:11.5px;color:#9FB6D9;margin-top:6px;">'+label+'</div>';
    h += '</div>';
  });
  h += '</div>';
  h += '<div style="margin-top:22px;padding-top:18px;border-top:1px solid rgba(255,255,255,.15);font-size:12.5px;color:#C3D4EE;position:relative;">'+CASES.length+' total matters · '+open.length+' open · '+closed.length+' closed — every number below updates live as the portfolio changes.</div>';
  h += '</div>';

  h += '<div class="card" style="margin-bottom:18px;background:linear-gradient(135deg,var(--surf) 0%,var(--surf2) 100%);border:1px solid var(--line);">';
  h += '<div class="sh"><span>📊 Total Litigation Summary — Company-Wide</span><span style="color:var(--dim);font-weight:500;">Live snapshot · updates automatically</span></div>';
  h += '<div class="kpi-grid" style="margin-bottom:0;">';
  const kpis = [
    ['Total Litigation', CASES.length, 'var(--pri)', open.length+' open · '+closed.length+' closed'],
    ['Total Exposure', fV(totExposure), 'var(--red)', 'likely exposure, all matters'],
    ['Total Reserves', fV(totReserves), 'var(--gold)', 'held across portfolio'],
    ['Total Billed / Paid', fV(totBilled), 'var(--ink)', fV(totPaid)+' collected'],
    ['Win Rate', winRate+'%', 'var(--green)', closed.length+' closed matters'],
    ['Avg. Days to Resolution', avgCycle, 'var(--pri2)', 'across closed matters'],
    ['Portfolio CCI', avgIdx, cciColor(avgIdx), cciLabel(avgIdx)+' average'],
    ['Trial Candidates', trialCount, trialCount>0?'var(--red)':'var(--green)', 'active or flagged'],
  ];
  kpis.forEach(([l,v,c,sub]) => {
    h += '<div class="kpi"><div class="kpi-bar" style="background:'+c+'"></div><div class="kpi-l">'+l+'</div><div class="kpi-v" style="color:'+c+';">'+v+'</div><div class="kpi-sub">'+sub+'</div></div>';
  });
  h += '</div>';
  if (missingSol > 0) {
    h += '<div class="alert-warn" style="margin-top:12px;">⚠ '+missingSol+' open matter'+(missingSol>1?'s are':' is')+' missing an SOL date. See the Key Dates tab on each matter for a general reference estimate, or check Risk &amp; Alerts below.</div>';
  }
  h += '</div>';
  return h;
}

/* ── WEEKLY EXECUTIVE DIGEST ─────────────────────────────────
   Composes the same numbers shown on this dashboard into a plain-
   text summary and emails it. Two honest limits, stated in the UI
   itself rather than buried in a comment:
   1. "Send Now" always works, zero setup — it's a mailto link, so
      it opens the person's own mail client with everything filled in.
   2. True unattended weekly sending — an email arriving every Monday
      whether or not anyone has this app open — needs a server that's
      always running to fire it on a timer. This is a browser app with
      no such server. What this DOES do without one: if someone has
      the app open on their chosen day, a one-click prompt appears so

function isoWeekKey(d){
  const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dayNum = date.getUTCDay() || 7;
  date.setUTCDate(date.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(date.getUTCFullYear(),0,1));
  const weekNo = Math.ceil((((date - yearStart) / 864e5) + 1)/7);
  return date.getUTCFullYear()+'-W'+weekNo;
}

  CASES.forEach(c => { const st = stateFromJurisdiction(c.court && c.court.jurisdiction) || 'Not Set'; byStateG[st] = byStateG[st]||{n:0,exp:0}; byStateG[st].n++; byStateG[st].exp += (c.exposure.likelyExposure||c.value||0); });
  Object.entries(byStateG).sort((a,b)=>b[1].exp-a[1].exp).slice(0,5).forEach(([st,d]) => {
    h += '<div class="row-link" onclick="st({showDrill:true,drillType:\'state-exposure\',drillValue:\''+escAttr(st)+'\',drillLabel:\''+escAttr(st)+' — Exposure\'})" style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--surf2);font-size:11.5px;"><span style="color:'+(st==='Not Set'?'var(--dim)':'var(--ink)')+';">'+esc(st)+' <span style="color:var(--dim);">('+d.n+')</span></span><span style="font-weight:700;color:var(--red);">'+fV(d.exp)+'</span></div>';
  });
  h += '</div>';

  h += '<div class="card"><div class="sh"><span>Largest Single Matters</span></div>';
  [...CASES].filter(c=>c.status!=='Closed').sort((a,b)=>(b.exposure.likelyExposure||b.value)-(a.exposure.likelyExposure||a.value)).slice(0,5).forEach(c => {
    h += '<div class="row-link" onclick="stCase(\''+c.id+'\')" style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--surf2);font-size:11.5px;"><span>'+esc(c.client.length>18?c.client.slice(0,18)+'…':c.client)+'</span><span style="font-weight:700;color:var(--red);">'+fV(c.exposure.likelyExposure||c.value)+'</span></div>';
  });
  h += '</div></div>';

  /* ── 3. RESERVE ADEQUACY — the ratio, plus the specific matters
     dragging it down, not just an aggregate percentage. */
  const reserveRatio = totExposure ? Math.round(totReserves/totExposure*100) : 0;
  const underReserved = CASES.filter(c => c.status!=='Closed' && c.exposure.likelyExposure && (c.insurance.reserveAmount/c.exposure.likelyExposure) < 0.7)
    .map(c => ({c, gap: (c.exposure.likelyExposure||0) - (c.insurance.reserveAmount||0)}))
    .sort((a,b) => b.gap - a.gap);
  h += '<div class="card" style="margin-top:14px;"><div class="sh"><span>💰 Reserve Adequacy</span><span style="color:var(--dim);font-weight:500;">Reserves vs. likely exposure, portfolio-wide</span></div>';
  h += '<div style="display:flex;gap:24px;align-items:center;flex-wrap:wrap;margin-bottom:'+(underReserved.length?'14px':'0')+';">';
  h += '<div style="text-align:center;"><div class="serif" style="font-size:36px;font-weight:700;color:'+(reserveRatio>=90?'var(--green)':reserveRatio>=70?'var(--gold)':'var(--red)')+';">'+reserveRatio+'%</div><div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-top:2px;">Reserves / Exposure</div></div>';
  h += '<div style="text-align:center;"><div class="serif" style="font-size:22px;font-weight:700;">'+fV(totReserves)+'</div><div style="font-size:10px;color:var(--muted);">Total Reserves</div></div>';
  h += '<div style="text-align:center;"><div class="serif" style="font-size:22px;font-weight:700;color:var(--red);">'+fV(totExposure)+'</div><div style="font-size:10px;color:var(--muted);">Total Likely Exposure</div></div>';
  h += '<div style="text-align:center;"><div class="serif" style="font-size:22px;font-weight:700;color:'+(underReserved.length>0?'var(--red)':'var(--green)')+';">'+underReserved.length+'</div><div style="font-size:10px;color:var(--muted);">Under-Reserved Matters</div></div>';
  h += '</div>';
  if (underReserved.length > 0) {
    h += '<div style="overflow-x:auto;"><table><thead><tr><th>Matter</th><th>Client</th><th>Reserve</th><th>Exposure</th><th>Gap</th></tr></thead><tbody>';
    underReserved.slice(0,6).forEach(({c,gap}) => {
      h += '<tr class="row-link" onclick="stCase(\''+c.id+'\',\'insurance\')"><td style="font-weight:700;color:var(--pri2);">'+esc(c.matterNo||c.id)+'</td><td>'+esc(c.client)+'</td><td>'+fM(c.insurance.reserveAmount)+'</td><td>'+fM(c.exposure.likelyExposure)+'</td><td style="color:var(--red);font-weight:700;">'+fM(gap)+'</td></tr>';
    });
    h += '</tbody></table></div>';
  }
  h += '</div>';

  /* ── 4. PORTFOLIO AT A GLANCE — a KPI column, a status donut, and
     a filed-vs-closed bar chart in one row, so leadership sees the
     book's shape and its trend side by side instead of hunting
     across separate cards. ── */
  const fa = firmAverages();
  const statusCounts = {};
  CASES.forEach(c => { statusCounts[c.status] = (statusCounts[c.status]||0)+1; });
  const statusColors = {Active:'var(--pri2)', Closed:'var(--green)', Trial:'var(--red)', Discovery:'var(--gold)', Settlement:'#6D28D9'};
  const statusEntries = Object.entries(statusCounts).sort((a,b)=>b[1]-a[1]);
  const statusTotal = CASES.length || 1;
  const donutSegs4 = statusEntries.map(([s,ct]) => ({label:s, pct: ct/statusTotal*100}));
  const donutColors4 = statusEntries.map(([s]) => statusColors[s] || 'var(--pri2)');

  const filedDates = CASES.map(c=>new Date(c.filed).getTime()).filter(t=>!isNaN(t));
  const nowRef = filedDates.length ? new Date(Math.max(...filedDates)) : new Date();
  const months4 = []; for (let i=5;i>=0;i--){ const d=new Date(nowRef.getFullYear(),nowRef.getMonth()-i,1); months4.push(d); }
  const filedByMonth = months4.map(d => CASES.filter(c=>{ const f=new Date(c.filed); return !isNaN(f) && f.getFullYear()===d.getFullYear() && f.getMonth()===d.getMonth(); }).length);
  const closedByMonth = months4.map(d => CASES.filter(c=>{ if (c.status!=='Closed') return false; const cd=new Date(c.deadline); return !isNaN(cd) && cd.getFullYear()===d.getFullYear() && cd.getMonth()===d.getMonth(); }).length);
  const monthLabels4 = months4.map(d=>d.toLocaleDateString('en-US',{month:'short'}));

  h += kpiDonutBarRow({
    kpis: [
      {label:'Open Matters', value: open.length},
      {label:'Closed to Date', value: closed.length},
      {label:'Avg. Resolution Time', value: fa.avgCycleTime+'d'},
      {label:'Win Rate', value: winRate+'%', color: winRate>=60?'var(--green)':'var(--gold)'}
    ],
    donutTitle: 'Cases by Status',
    donutSegs: donutSegs4, donutColors: donutColors4,
    barTitle: 'Matters Filed vs. Closed', barSub: 'Last 6 months',
    barLabels: monthLabels4,
    barSeries: [
      {label:'Filed', color:'var(--pri2)', values: filedByMonth},
      {label:'Closed', color:'var(--green)', values: closedByMonth}
    ]
  });

  /* ── 5. OUTCOMES SNAPSHOT — are we actually winning? ── */
  h += '<div class="card" style="margin-top:14px;"><div class="sh"><span>📈 Outcomes Snapshot</span></div>';
  h += '<div style="display:flex;gap:28px;flex-wrap:wrap;">';
  const outcomeStats = [
    ['Win Rate', winRate+'%', winRate>=60?'var(--green)':'var(--gold)'],
    ['Settlement Rate', fa.settlePct+'%', 'var(--pri2)'],
    ['Avg. Resolution Time', fa.avgCycleTime+' days', 'var(--ink)'],
    ['Portfolio CCI', fa.les ? Math.round(open.reduce((s,c)=>s+cci(c),0)/Math.max(open.length,1)) : 0, cciColor(Math.round(open.reduce((s,c)=>s+cci(c),0)/Math.max(open.length,1)))]
  ];
  outcomeStats.forEach(([l,v,c]) => {
    h += '<div><div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:3px;">'+l+'</div><div class="serif" style="font-size:24px;font-weight:700;color:'+c+';">'+v+'</div></div>';
  });
  h += '</div></div>';

  /* ── 6. TOP PERFORMERS ── */
  h += '<div class="card" style="margin-top:14px;"><div class="sh"><span>Top Performers</span><span style="color:var(--dim);font-weight:500;">By LES</span></div>';
  const ranked = ATTY.map(a => attorneyScorecard(a)).sort((x,y)=>y.les-x.les).slice(0,3);
  h += '<div class="grid-3" style="margin-bottom:0;">';
  ranked.forEach((sc,i) => {
    h += '<div style="text-align:center;padding:14px;background:var(--surf2);border-radius:9px;cursor:pointer;" onclick="st({role:\'scorecard\',scorecardDetail:\''+sc.name+'\'})">';
    h += '<div style="font-size:20px;">'+(i===0?'🥇':i===1?'🥈':'🥉')+'</div>';
    h += '<div style="font-weight:700;font-size:13px;margin-top:4px;">'+esc(sc.name)+'</div>';
    h += '<div class="serif" style="font-size:22px;font-weight:700;color:'+lesGradeColor(sc.les)+';">'+lesGrade(sc.les)+'</div>';
    h += '<div style="font-size:10px;color:var(--muted);">LES '+sc.les+'</div></div>';
  });
  h += '</div></div>';
  return execEnterpriseSectionsV(h, open, closed, totExposure, totReserves, winRate);
}

/* ── ENTERPRISE SECTIONS — appended onto the one Firm-at-a-Glance
   page rather than a separate tab, per direct instruction: everything
   on one simple screen, nothing extra to click into. Takes the
   already-built glance HTML and the figures already computed there
   so nothing is recalculated twice. ───────────────────────────── */
function execEnterpriseSectionsV(hIn, open, closed, totExposure, totReserves, winRate){
  let h = hIn;

  /* ── ENTERPRISE FINANCIAL EXPOSURE (the "Big Numbers") ── */
  h += '<div class="section-band" style="margin-top:22px;">💼 Enterprise Financial Exposure</div>';
  h += '<div class="grid-3">';

  h += '<div class="card"><div class="sh"><span>Exposure by Probability of Loss</span></div>';
  const probBuckets = {Probable:0, 'Reasonably Possible':0, Remote:0};
  CASES.filter(c=>c.status!=='Closed').forEach(c => { const p = c.probabilityOfLoss||'Reasonably Possible'; probBuckets[p] = (probBuckets[p]||0) + (c.exposure.likelyExposure||c.value||0); });
  const probColors = {Probable:'var(--red)', 'Reasonably Possible':'var(--gold)', Remote:'var(--green)'};
  const probTotal = Object.values(probBuckets).reduce((a,b)=>a+b,0) || 1;
  Object.entries(probBuckets).forEach(([label,amt]) => {
    const pct = Math.round(amt/probTotal*100);
    h += '<div style="margin-bottom:9px;cursor:pointer;" onclick="st({showDrill:true,drillType:\'probability-of-loss\',drillValue:\''+escAttr(label)+'\',drillLabel:\''+escAttr(label)+' — Loss Probability\'})"><div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:2px;"><span style="color:var(--muted);">'+label+'</span><span style="font-weight:700;color:'+probColors[label]+';">'+fV(amt)+'</span></div>';
    h += '<div style="background:var(--surf3);height:7px;border-radius:3px;overflow:hidden;"><div style="width:'+pct+'%;height:100%;background:'+probColors[label]+';"></div></div></div>';
  });
  h += '<div style="font-size:9.5px;color:var(--dim);margin-top:4px;">ASC 450 / SOX-style loss-contingency categorization, set per matter on the Exposure tab.</div>';
  h += '</div>';

  const totalBilledAll = CASES.reduce((s,c)=>s+(c.billing.totalBilled||0),0);
  h += '<div class="card"><div class="sh"><span>Legal Spend vs. Forecast</span></div>';
  h += '<div class="fld"><label class="lbl">Quarterly Budget</label><input type="text" inputmode="decimal" value="'+(S.enterpriseBudgetQuarterly?Number(S.enterpriseBudgetQuarterly).toLocaleString():'')+'" placeholder="Set quarterly target" onchange="st({enterpriseBudgetQuarterly:moneyVal(this.value)})" class="inp"></div>';
  h += '<div class="fld"><label class="lbl">Annual Budget</label><input type="text" inputmode="decimal" value="'+(S.enterpriseBudgetAnnual?Number(S.enterpriseBudgetAnnual).toLocaleString():'')+'" placeholder="Set annual target" onchange="st({enterpriseBudgetAnnual:moneyVal(this.value)})" class="inp"></div>';
  if (S.enterpriseBudgetAnnual > 0) {
    const burnPct = Math.min(100, Math.round(totalBilledAll/S.enterpriseBudgetAnnual*100));
    h += '<div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px;"><span style="color:var(--muted);">'+fV(totalBilledAll)+' spent of '+fV(S.enterpriseBudgetAnnual)+' annual</span><span style="font-weight:700;color:'+(burnPct>90?'var(--red)':'var(--ink)')+';">'+burnPct+'%</span></div>';
    h += '<div style="background:var(--surf3);height:8px;border-radius:4px;overflow:hidden;"><div style="width:'+burnPct+'%;height:100%;background:'+(burnPct>90?'var(--red)':'var(--pri2)')+';"></div></div>';
  } else {
    h += '<div style="font-size:11px;color:var(--dim);">Set a budget above to track spend vs. forecast.</div>';
  }
  h += '</div>';

  h += '<div class="card"><div class="sh"><span>Accruals &amp; Reserves</span></div>';
  h += '<div style="text-align:center;padding:8px 0;"><div class="serif" style="font-size:28px;font-weight:700;color:var(--gold);">'+fV(totReserves)+'</div><div style="font-size:10px;color:var(--muted);margin-top:3px;">Total held for pending settlements &amp; adverse judgments</div></div>';
  h += '<div style="font-size:9.5px;color:var(--dim);margin-top:6px;">Reflects reserves entered on each matter\'s Insurance tab — align with Finance before using for SEC/SOX financial-reporting disclosures.</div>';
  h += '</div></div>';

  /* ── STRATEGIC COST CONTROL & VENDOR ROI ── */
  h += '<div class="section-band">📊 Strategic Cost Control &amp; Vendor ROI</div>';
  h += '<div class="card" style="margin-bottom:14px;"><div class="sh"><span>Outside Counsel Performance</span></div>';
  h += '<div style="overflow-x:auto;"><table><thead><tr><th>Attorney</th><th>Total Spend</th><th>Open</th><th>Closed</th><th>Win Rate</th><th>Settlement Rate</th><th>LES Grade</th></tr></thead><tbody>';
  ATTY.map(a=>attorneyScorecard(a)).sort((x,y)=>y.totalBilled-x.totalBilled).forEach(sc => {
    h += '<tr class="row-link" onclick="st({role:\'scorecard\',scorecardDetail:\''+sc.name+'\'})"><td style="font-weight:700;">'+esc(sc.name)+'</td><td>'+fV(sc.totalBilled)+'</td><td>'+sc.open.length+'</td><td>'+sc.closed.length+'</td><td>'+sc.winPct+'%</td><td>'+sc.settlePct+'%</td><td><span class="serif" style="font-weight:700;color:'+lesGradeColor(sc.les)+';">'+lesGrade(sc.les)+'</span></td></tr>';
  });
  h += '</tbody></table></div></div>';

  h += '<div class="grid-2">';
  h += '<div class="card"><div class="sh"><span>Spend by Matter Type</span></div>';
  const spendByType = {};
  CASES.forEach(c => { spendByType[c.type] = (spendByType[c.type]||0) + (c.billing.totalBilled||0); });
  const maxSpendType = Math.max(...Object.values(spendByType), 1);
  Object.entries(spendByType).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]).slice(0,8).forEach(([t,v]) => {
    h += '<div style="margin-bottom:8px;cursor:pointer;" onclick="st({showDrill:true,drillType:\'matter-type-spend\',drillValue:\''+escAttr(t)+'\',drillLabel:\''+escAttr(t)+' — Spend\'})"><div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:2px;"><span style="color:var(--muted);">'+esc(t)+'</span><span style="font-weight:700;">'+fV(v)+'</span></div>';
    h += '<div style="background:var(--surf3);height:6px;border-radius:3px;overflow:hidden;"><div style="width:'+Math.round(v/maxSpendType*100)+'%;height:100%;background:var(--pri2);"></div></div></div>';
  });
  if (Object.values(spendByType).every(v=>v===0)) h += '<div style="font-size:11px;color:var(--dim);">No billing recorded yet.</div>';
  h += '</div>';

  h += '<div class="card"><div class="sh"><span>Alternative Fee Arrangement (AFA) Savings</span></div>';
  const afaCases = CASES.filter(c => c.billing.type && c.billing.type !== 'Hourly');
  const afaPct = CASES.length ? Math.round(afaCases.length/CASES.length*100) : 0;
  h += '<div style="text-align:center;padding:8px 0;cursor:pointer;" onclick="st({showDrill:true,drillType:\'afa-matters\',drillLabel:\'AFA-Billed Matters\'})"><div class="serif" style="font-size:32px;font-weight:700;color:var(--green);">'+afaPct+'%</div><div style="font-size:10px;color:var(--muted);margin-top:3px;">of matters billed via a fixed, capped, or contingency arrangement instead of pure hourly</div></div>';
  h += '<div style="font-size:11px;color:var(--muted);">'+afaCases.length+' of '+CASES.length+' matters. Set the Fee Type on each matter\'s Billing tab to update this.</div>';
  h += '</div></div>';

  /* ── CORPORATE RISK & PORTFOLIO HEALTH ── */
  h += '<div class="section-band">🚨 Corporate Risk &amp; Portfolio Health</div>';
  const materialThreshold = 10000000;
  const materialMatters = CASES.filter(c => c.status!=='Closed' && (c.exposure.likelyExposure||c.value||0) > materialThreshold).sort((a,b)=>(b.exposure.likelyExposure||b.value)-(a.exposure.likelyExposure||a.value));
  h += '<div class="card" style="margin-bottom:14px;'+(materialMatters.length?'border-left:3px solid var(--red);':'')+'"><div class="sh"><span>⚠ Material Matters (&gt;'+fV(materialThreshold)+' Exposure)</span><span style="color:var(--dim);font-weight:500;">'+materialMatters.length+' matter'+(materialMatters.length!==1?'s':'')+'</span></div>';
  if (materialMatters.length === 0) {
    h += '<div style="color:var(--green);font-size:12px;font-weight:600;">✓ No matters currently exceed the $'+(materialThreshold/1e6)+'M threat threshold.</div>';
  } else {
    h += '<div style="overflow-x:auto;"><table><thead><tr><th>Matter</th><th>Client</th><th>Attorney</th><th>Probability</th><th>Exposure</th></tr></thead><tbody>';
    materialMatters.forEach(c => {
      h += '<tr class="row-link" onclick="stCase(\''+c.id+'\')"><td style="font-weight:700;color:var(--pri2);">'+esc(c.matterNo||c.id)+'</td><td>'+esc(c.client)+'</td><td>'+esc(c.attorney)+'</td><td><span class="tag" style="background:'+probColors[c.probabilityOfLoss||'Reasonably Possible']+'22;color:'+probColors[c.probabilityOfLoss||'Reasonably Possible']+';">'+esc(c.probabilityOfLoss||'Reasonably Possible')+'</span></td><td style="font-weight:700;color:var(--red);">'+fV(c.exposure.likelyExposure||c.value)+'</td></tr>';
    });
    h += '</tbody></table></div>';
  }
  h += '</div>';

  h += '<div class="grid-2">';
  h += '<div class="card"><div class="sh"><span>Litigation Inflow vs. Outflow</span><span style="color:var(--dim);font-weight:500;">Last 12 months</span></div>';
  const filedDatesIO = CASES.map(c=>new Date(c.filed).getTime()).filter(t=>!isNaN(t));
  const nowRefIO = new Date(Math.max(...filedDatesIO));
  const monthsIO = []; for (let i=11;i>=0;i--){ const d=new Date(nowRefIO.getFullYear(),nowRefIO.getMonth()-i,1); monthsIO.push(d); }
  const inflow = monthsIO.map(d => CASES.filter(c=>{ const f=new Date(c.filed); return !isNaN(f) && f.getFullYear()===d.getFullYear() && f.getMonth()===d.getMonth(); }).length);
  const outflow = monthsIO.map(d => CASES.filter(c=>{ if (c.status!=='Closed') return false; const cd=new Date(c.deadline); return !isNaN(cd) && cd.getFullYear()===d.getFullYear() && cd.getMonth()===d.getMonth(); }).length);
  const maxIO = Math.max(...inflow, ...outflow, 1);
  h += '<svg viewBox="0 0 400 140" style="width:100%;height:150px;">';
  const lineFrom = (arr,color,dash) => { let p=''; arr.forEach((v,i)=>{ const x=20+i*(360/11); const y=120-(v/maxIO)*100; p += (i===0?'M':'L')+x+' '+y; }); return '<path d="'+p+'" stroke="'+color+'" stroke-width="2.5" fill="none"'+(dash?' stroke-dasharray="5 3"':'')+'/>'; };
  h += lineFrom(inflow,'var(--red)',false);
  h += lineFrom(outflow,'var(--green)',true);
  h += '</svg>';
  h += '<div style="display:flex;gap:18px;justify-content:center;margin-top:4px;">';
  h += '<div style="display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--muted);"><div style="width:14px;height:2.5px;background:var(--red);"></div>New Filings (Inflow)</div>';
  h += '<div style="display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--muted);"><div style="width:14px;height:2px;background:var(--green);background-image:linear-gradient(to right,var(--green) 60%,transparent 60%);background-size:5px 2px;"></div>Closed (Outflow)</div>';
  h += '</div></div>';

  h += '<div class="card"><div class="sh"><span>Regulatory / Compliance Incidents</span></div>';
  h += '<div style="display:flex;gap:8px;margin-bottom:10px;">';
  h += '<input type="text" id="regIncName" placeholder="Incident name" class="inp" style="flex:2;">';
  h += '<select id="regIncAgency" class="inp" style="flex:1;"><option>SEC</option><option>DOJ</option><option>FTC</option><option>State Insurance Dept.</option><option>State AG</option><option>Other</option></select>';
  h += '<button class="btn btn-pri" onclick="addRegulatoryIncident(document.getElementById(\'regIncName\').value, document.getElementById(\'regIncAgency\').value, 0)">+ Add</button>';
  h += '</div>';
  const openIncidents = REGULATORY_INCIDENTS.filter(r=>r.status==='Open');
  if (openIncidents.length === 0) {
    h += '<div style="font-size:11.5px;color:var(--green);font-weight:600;">✓ No open regulatory or compliance incidents.</div>';
  } else {
    openIncidents.forEach(r => {
      h += '<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--surf2);">';
      h += '<div><span class="tag" style="background:var(--red)18;color:var(--red);margin-right:6px;">'+esc(r.agency)+'</span><span style="font-size:11.5px;">'+esc(r.name)+'</span></div>';
      h += '<button class="btn btn-ghost" style="font-size:10px;padding:3px 7px;" onclick="closeRegulatoryIncident(\''+r.id+'\')">Mark Resolved</button></div>';
    });
  }
  h += '</div></div>';

  /* ── OPERATIONAL VELOCITY & PREVENTION ── */
  h += '<div class="section-band">⚙ Operational Velocity &amp; Prevention</div>';
  h += '<div class="grid-2">';

  h += '<div class="card"><div class="sh"><span>Avg. Cycle Time by Claim Type</span></div>';
  const cycleByType = {};
  CASES.filter(c=>c.status==='Closed').forEach(c => { cycleByType[c.type] = cycleByType[c.type]||[]; cycleByType[c.type].push(daysOpen(c)); });
  const cycleEntries = Object.entries(cycleByType).map(([t,arr]) => [t, Math.round(arr.reduce((a,b)=>a+b,0)/arr.length)]).sort((a,b)=>b[1]-a[1]);
  if (cycleEntries.length === 0) {
    h += '<div style="font-size:11px;color:var(--dim);">No closed matters yet to measure cycle time.</div>';
  } else {
    const maxCycle = Math.max(...cycleEntries.map(e=>e[1]), 1);
    cycleEntries.slice(0,8).forEach(([t,days]) => {
